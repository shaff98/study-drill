<style>

</style>
</head>

es the operating differential of the system by turning it off in advance of the actual set temperature.", "finished": false}, {"number": 6, "total": 105, "type": "single", "questionId": 57846, "question": "A cable contains a black wire, a white wire, and a smaller, uncoated copper wire. What should you do with the uncoated copper wire?", "choices": [{"pos": 0, "letter": "A", "text": "ground it", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "splice it", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "cut it off", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "insulate it", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  The uncoated copper wire in the cable should indeed be grounded.  Grounding is essential for safety in electrical systems.  It provides a path for electrical current to flow safely into the ground, preventing electrical shocks and reducing the risk of fire.", "finished": false}, {"number": 7, "total": 105, "type": "single", "questionId": 57847, "question": "When hooking up two fans in parallel, where should the thermostatic bulb be placed?", "choices": [{"pos": 0, "letter": "A", "text": "on the outlet of the evaporator/suction line", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "near the return air", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "near the suction line", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "near the evaporator", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  When connecting two fans in parallel, the thermostatic bulb should be placed on the outlet of the evaporator/suction line.  This ensures accurate temperature sensing and control.", "finished": false}, {"number": 8, "total": 105, "type": "single", "questionId": 54467, "question": "What makes the best insulator?", "choices": [{" ame?", "choices": [{"pos": 0, "letter": "A", "text": "wavy yellow flame", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "soft red flame", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "soft blue flame", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "soft blue flame with slightly yellow tips", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The color for the most efficient flame depends upon the type of gas that is being burned. The most efficient flame when burning NATURAL gas will be a soft blue without any yellow. The most efficient flame when burning PROPANE gas will be a soft blue with slightly yellow tips.", "finished": false}, {"number": 19, "total": 105, "type": "single", "questionId": 27242, "question": "How many gas lines should be run from the main gas supply to the furnace?", "choices": [{"pos": 0, "letter": "A", "text": "1", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "2", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "3", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "4", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": null, "finished": false}, {"number": 20, "total": 105, "type": "single", "questionId": 67947, "question": "What type of gauge would you use for very high vacuums?", "choices": [{"pos": 0, "letter": "A", "text": "thermistor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Cold cathode ionization", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Bourdon", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Pascal", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  If you’re dealing with high vacuum pressure, cold cathode ionization gauges is a durable and cost-effective choice.", "finished": false}, {"number": 21, "total": 105, "type": "single", "questionId": 54635, "question": "Calculate the heat loss through a 6′ x 6′ window over a period of 24 hours for the following conditions: inside temperature = 68°F, outside temperature = 62°F, U-value = 1.13", "choices": [{"pos": 0, "letter": "A", "text": "4,216 Btu", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "4,764 Btu", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "5,858 Btu", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "25,829 calories", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  Q = U x A x TD x 24 hours = 1.13 x 36 x 6 x 24 = 5,857.92 Btu.", "finished": false}, {"number": 22, "total": 105, "type": "single", "questionId": 54636, "question": "Calculate the heat loss through a 12′ x 12′ ceiling over a period of one hour for the following conditions: indoor design temperature = 75°, outdoor temperature = 50°, heat coefficient = 1.13", "choices": [{"pos": 0, "letter": "A", "text": "3,750 Btu", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "4,068 Btu", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "6,291 Btu", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "79,230 calories", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Q = U x A x TD x 1 hour =  1.13 x 144 x 25 x 1 = 4,068 Btu.", "finished": false}, {"number": 23, "total": 105, "type": "single", "questionId": 57858, "question": "Which of the following solders has a melting point below 1150°F?", "choices": [{"pos": 0, "letter": "A", "text": "Easy-Flo 45", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Unibraze 50", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Sil-Flos", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Unibraze 0", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  NOTE: Several versions of this question are said to have appeared on the State exam.  Please review the graphic.  Easy-Flo 45 is an extremely versatile, low-temperature silver braze alloy. It can be used for most ferrous and non-ferrous metals, including applications like fixing cast iron cracks and automotive repairs1.  The melting range for Easy-Flo 45 is approximately 1125°F (607°C) to 1145°F (618°C).", "finished": false}, {"number": 24, "total": 105, "type": "single", "questionId": 27247, "question": "A room has a 1,200 sq ft ceiling. The specs require 1 sq ft of register per 150 sq ft of ceiling. What is the smallest register you may use?", "choices": [{"pos": 0, "letter": "A", "text": "2′ x 2′", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "2′ x 4′", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "3′ x 3′", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "3′ x 5′", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. 1,200 ÷ 150 = 8 sq ft.", "finished": false}, {"number": 25, "total": 105, "type": "single", "questionId": 67948, "question": "Which gauge would you use to test manifold gas pressure?", "choices": [{"pos": 0, "letter": "A", "text": "U-tube water manometer", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "0-150 psi pressure gage", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a thermocouple gage", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "any Bourdon-type gage", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  To test manifold gas pressure, you would typically use a manometer.  This device measures the air pressure within the inlet manifold.  In the US, the reading is usually in inches of mercury (inHg).", "finished": false}, {"number": 26, "total": 105, "type": "single", "questionId": 57860, "question": "How do you add moisture to a space?", "choices": [{"pos": 0, "letter": "A", "text": "humidifier", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "dehumidifier", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "duct damper", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "hydrocouple", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  Humidifiers add moisture to the air.", "finished": false}, {"number": 27, "total": 105, "type": "single", "questionId": 57861, "question": "How long should flexible duct runs be?", "choices": [{"pos": 0, "letter": "A", "text": "as short as possible", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "as long as possible", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "whatever is convenient", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "either very long or very short", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  Flex duct runs should be as short as possible (5 to 6 ft. max.) and should be stretched as tight as possible. Ducts are classified in terms of velocity and pressure.", "finished": false}, {"number": 28, "total": 105, "type": "single", "questionId": 57862, "question": "The size of gas piping is determined by the:", "choices": [{"pos": 0, "letter": "A", "text": "number of burners and altitude above sea level", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "volume of heat loss of area", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "(1) Allowable loss in pressure from point of delivery to appliance. (2) Maximum gas demand. (3) Length of piping and number of fittings.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "number of burners and orifice size", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  To determine the size of piping used in a gas piping system, the following factors must be considered: (1) Allowable loss in pressure from point of delivery to appliance. (2) Maximum gas demand. (3) Length of piping and number of fittings.", "finished": false}, {"number": 29, "total": 105, "type": "single", "questionId": 57863, "question": "Duct systems should be constructed PRIMARILY according to:", "choices": [{"pos": 0, "letter": "A", "text": "ASTM Standards", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "California Mechanical Code", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "SMACNA Standards", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "cost", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  The California Mechanical Code (CMC) provides minimum standards to safeguard life, limb, health, property, and public welfare by regulating and controlling the design, construction, installation, quality of materials, location, operation, and maintenance or use of heating, ventilating, cooling, refrigeration systems, incinerators, and other miscellaneous heat-producing appliances.", "finished": false}, {"number": 30, "total": 105, "type": "single", "questionId": 57864, "question": "When may a Type-B gas venting system be used?", "choices": [{"pos": 0, "letter": "A", "text": "on gas venting systems serving appliances equipped with draft hoods", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "on gas venting systems serving gas-fired vented wall furnaces", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "on any gas venting system", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "never", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A.  A Type B Gas Vent system is designed for use with natural gas or liquid propane category I appliances that are draft hood equipped.", "finished": false}, {"number": 31, "total": 105, "type": "single", "questionId": 57865, "question": "Where in a furnace venting system may a Type-BW gas vent change to Type-B gas vent?", "choices": [{"pos": 0, "letter": "A", "text": "whenever the wall space is large enough to allow the Type-B vent", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "after the Type-BW vent passes through the highest ceiling plate above the furnace that it serves", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "after the Type-BW vent passes through the lowest ceiling plate above the furnace that it serves", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "never", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  A Type BW gas vent is a factory-made gas vent listed for venting listed or approved gas-fired vented furnaces in walls.  This practice is found in older CMC codes, but the question may still be on the exam.  When transitioning from a Type-BW gas vent to a Type-B gas vent in a furnace venting system, you can make the change after the Type-BW vent passes through the highest ceiling plate above the furnace it serves.", "finished": false}, {"number": 32, "total": 105, "type": "single", "questionId": 57866, "question": "What is the overfire rating on a small draft hood?", "choices": [{"pos": 0, "letter": "A", "text": ".02″ wg", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": ".04″ wg", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": ".06″ wg", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": ".08″ wg", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A.  The overfire rating for a draft hood is typically set to 0.02 inches of water gauge (wg) or slightly higher.  This ensures proper combustion and safe operation of gas appliances.", "finished": false}, {"number": 33, "total": 105, "type": "single", "questionId": 54640, "question": "What is the thermal resistance of a wall constructed with materials with R-values of 1.9, 7.9, 2.9, and 7.9?", "choices": [{"pos": 0, "letter": "A", "text": "7.9", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "12.5", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "20.6", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "343.88", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  1.9 + 7.9 + 2.9 + 7.9 = 20.6", "finished": false}, {"number": 34, "total": 105, "type": "single", "questionId": 54641, "question": "What is the total thermal conductance of a wall constructed with materials with R-values of 1.9, 7.9, 2.9, and 7.9?", "choices": [{"pos": 0, "letter": "A", "text": "0.003", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "0.05", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "0.08", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "0.13", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  Thermal conductance = C value = 1/R = 1/20.6 = 0.05", "finished": false}, {"number": 35, "total": 105, "type": "single", "questionId": 57867, "question": "What is the advantage of using armored cable vs. nonmetallic cable?", "choices": [{"pos": 0, "letter": "A", "text": "you may bury armored cable underground", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "armored is less expensive", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "armored resists breakage by mechanical causes", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "armored will not corrode", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  Armored cables provide higher mechanical protection, making them resistant to breakage caused by mechanical forces.", "finished": false}, {"number": 36, "total": 105, "type": "single", "questionId": 27259, "question": "Where should you locate registers for a forced warm-air system?", "choices": [{"pos": 0, "letter": "A", "text": "along an outside wall", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "along an inside wall", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "high on a wall", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "on the floor or low on a wall", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Registers may be located high or low on walls or on floors. Locating registers high on walls is the most popular method. Floor registers tend to collect dust and trash. Low wall registers sometimes interfere with furniture arrangement.", "finished": false}, {"number": 37, "total": 105, "type": "single", "questionId": 57868, "question": "What are used to change air direction in ducts?", "choices": [{"pos": 0, "letter": "A", "text": "elbows", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "dampers", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "baffles", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "any of the above", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A.  Duct elbows are essential components used to change the direction of airflow in ductwork.  They allow smooth redirection around corners or obstacles, optimizing the distribution of heated or cooled air.", "finished": false}, {"number": 38, "total": 105, "type": "single", "questionId": 27261, "question": "Which of the following affects temperature in a room?", "choices": [{"pos": 0, "letter": "A", "text": "radiation", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "dehydration", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "irradiation", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "deradiation", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. We assume this question is referring to dry-bulb temperature. An example of radiation would be heat gain from solar radiation through window glass.", "finished": false}, {"number": 39, "total": 105, "type": "single", "questionId": 27262, "question": "How far must combustible material be placed from an electric furnace?", "choices": [{"pos": 0, "letter": "A", "text": "3 ft", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "4 ft", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10 ft", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "none of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. There is no clearance requirement because the heat from an electric furnace is not produced by a flame.", "finished": false}, {"number": 40, "total": 105, "type": "single", "questionId": 27263, "question": "What is the minimum size air-supply duct that must be installed for a 60,000 Btu/h blower-type furnace?", "choices": [{"pos": 0, "letter": "A", "text": "12″ x 10″", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30″ x 10″", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "12″ x 20″", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "20″ x 40″", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The minimum size of supply-air ducts for a blower-type warm-air furnace must be at least 2 sq in/1000 Btu/h. 60,000 Btu/h x (2 sq in ÷ 1000 Btu/h) = 120 sq in. 12 in x 10 in = 120 sq in.\n\nThe State exam will have questions that ask for maximums and minimums with only four possible answer choices.  In this case, 12” by 10” is correct as the total unobstructed duct is computed as 2 sq inches for each 1,000 Btu.", "finished": false}, {"number": 41, "total": 105, "type": "single", "questionId": 27264, "question": "What is the minimum size air-supply duct that must be installed for a 60,000 Btu/h gravity-type furnace?", "choices": [{"pos": 0, "letter": "A", "text": "12″ x 20″", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30″ x 10″", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "12″ x 10″", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "14″ x 30″", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The minimum size of supply-air ducts for a gravity-type warm-air furnace must be at least 7 sq in/1000 Btu/h. 60,000 Btu/h x (7 sq in ÷ 1000 Btu/h) = 420 sq in. 14 in x 30 in = 420 sq in.", "finished": false}, {"number": 42, "total": 105, "type": "single", "questionId": 57869, "question": "Where can you obtain EER ratings?", "choices": [{"pos": 0, "letter": "A", "text": "AHRI or Energy Commission", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "ASTM or Energy Commission", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the architect", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the general contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  AHRI = Air-Conditioning, Heating, and Refrigeration Institute.   AHRI lists the certified energy efficiency ratings for specific equipment in its online AHRI Directory of Certified Product Performance.", "finished": false}, {"number": 43, "total": 105, "type": "single", "questionId": 57870, "question": "When you have a powered exhaust from a building, the make-up of the air vent will be:", "choices": [{"pos": 0, "letter": "A", "text": "smaller than the exhaust air vent", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "larger than the exhaust air vent", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the same size as the exhaust air vent", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "unrelated to the exhaust air vent", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D.  The makeup air vent (intake) should be appropriately sized to balance the exhaust system and maintain indoor air quality.  It doesn’t necessarily need to be the same size as the exhaust vent, but it should provide sufficient makeup air to prevent negative pressure and ensure proper ventilation.", "finished": false}, {"number": 44, "total": 105, "type": "single", "questionId": 27267, "question": "The volume of a poorly insulated room is 20,900 cu ft. A desired temperature change per hour requires 5.5 Btu/h per cu ft to achieve. What size heat pump compressor is needed to heat the space?", "choices": [{"pos": 0, "letter": "A", "text": "40,000 Btu/h", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "80,000 Btu/h", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "100,000 Btu/h", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "120,000 Btu/h", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. 20,900 cu ft x 5.5 Btu/h/cu ft = 114,950 Btu/h, which is rounded up to 120,000 Btu/h.", "finished": false}, {"number": 45, "total": 105, "type": "single", "questionId": 57871, "question": "To calibrate a pressure gage:", "choices": [{"pos": 0, "letter": "A", "text": "offset the needle when the gage is disconnected", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "set the needle const KEY = "c20-mastery-v1";

// Flatten all banks, dedupe by questionId, remember which test each came from.
const seen = new Set();
const QUESTIONS = [];
const testOf = {};
const TESTS = Object.keys(BANKS);
for (const name of TESTS) {
  for (const q of BANKS[name]) {
    if (seen.has(q.questionId)) continue;
    seen.add(q.questionId);
    testOf[q.questionId] = name;
    QUESTIONS.push(q);
  }
}
function testLabel(name) {
  const m = name.match(/(\d+)\s*$/);
  return m ? "Test " + m[1] : name;
}

let state = { mastered: {}, missed: {} };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) { /* storage unavailable — session-only mode */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let scope = (state.scope && BANKS[state.scope]) ? state.scope : "all";
function scopeQuestions(sc) {
  return sc === "all" ? QUESTIONS : QUESTIONS.filter(q => testOf[q.questionId] === sc);
}
// Every answer is either a miss or a mastery, so tries = misses + mastered.
function statsFor(sc) {
  let wrong = 0, mastered = 0;
  const qs = scopeQuestions(sc);
  for (const q of qs) {
    wrong += state.missed[q.questionId] || 0;
    if (state.mastered[q.questionId]) mastered++;
  }
  return { wrong, mastered, tries: wrong + mastered, total: qs.length };
}

let sessionRight = 0, sessionTotal = 0, current = null, lastId = null;

const $ = id => document.getElementById(id);
$("bankNote").textContent =
  QUESTIONS.length + " questions from " + Object.keys(BANKS).length + " test(s) · progress saves on this device";

function pool() { return scopeQuestions(scope).filter(q => !state.mastered[q.questionId]); }

// Picker: one combined option (no progress shown), then each test with its mastery.
const scopeSel = $("scopeSel");
const allOpt = document.createElement("option");
allOpt.value = "all"; allOpt.textContent = "All tests combined";
scopeSel.appendChild(allOpt);
for (const name of TESTS) {
  const o = document.createElement("option");
  o.value = name;
  scopeSel.appendChild(o);
}
scopeSel.value = scope;
function refreshOptions() {
  for (const o of scopeSel.options) {
    if (o.value === "all") continue;
    const s = statsFor(o.value);
    o.textContent = testLabel(o.value) + " \u2014 " + s.mastered + "/" + s.total + " mastered";
  }
}
scopeSel.onchange = () => {
  scope = scopeSel.value;
  state.scope = scope;
  save();
  lastId = null;
  disarmReset();
  draw();
};

function updateHeader() {
  const s = statsFor(scope);
  $("tally").innerHTML = "<b>" + s.mastered + "</b> / " + s.total + " mastered";
  $("barFill").style.width = s.total ? (100 * s.mastered / s.total) + "%" : "0";
  $("sessionStat").textContent = sessionTotal
    ? "This session: " + sessionRight + " of " + sessionTotal + " correct" : "";
  $("allTime").textContent = s.tries
    ? "Overall: " + s.wrong + " misses / " + s.tries + " tries" : "";
  refreshOptions();
}

function draw() {
  const p = pool();
  updateHeader();
  if (!p.length) return renderDone();
  let pick;
  do { pick = p[Math.floor(Math.random() * p.length)]; }
  while (p.length > 1 && pick.questionId === lastId);
  current = pick;
  lastId = pick.questionId;
  renderQuestion(pick);
}

function renderQuestion(q) {
  const misses = state.missed[q.questionId] || 0;
  $("missedChip").textContent = misses ? "missed " + misses + "\u00d7" : "";
  const card = $("card");
  card.innerHTML = "";
  const qt = document.createElement("p");
  qt.className = "qtext"; qt.textContent = q.question;
  card.appendChild(qt);
  const wrap = document.createElement("div");
  wrap.className = "choices";
  q.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = "<span class='letter'>" + c.letter + "</span><span></span>";
    b.lastChild.textContent = c.text;
    b.onclick = () => answer(b, c, q);
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
}

function answer(btn, choice, q) {
  const buttons = [...$("card").querySelectorAll(".choice")];
  if (buttons[0].disabled) return;
  sessionTotal++;
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (q.choices[i].isCorrect) b.classList.add("correct");
  });
  const verdict = document.createElement("p");
  verdict.className = "verdict";
  if (choice.isCorrect) {
    sessionRight++;
    state.mastered[q.questionId] = true;
    verdict.classList.add("good");
    verdict.textContent = "Correct — out of the pool";
  } else {
    btn.classList.add("wrong");
    state.missed[q.questionId] = (state.missed[q.questionId] || 0) + 1;
    verdict.classList.add("bad");
    verdict.textContent = "Wrong — stays in the pool";
  }
  save();
  const card = $("card");
  card.appendChild(verdict);
  if (q.explanation) {
    const ex = document.createElement("div");
    ex.className = "explanation";
    ex.textContent = q.explanation;
    card.appendChild(ex);
  }
  const next = document.createElement("button");
  next.className = "next"; next.textContent = "Next question";
  next.onclick = draw;
  card.appendChild(next);
  next.focus({ preventScroll: true });
  updateHeader();
}

function scopeName() { return scope === "all" ? "all tests" : testLabel(scope); }

function renderDone() {
  const s = statsFor(scope);
  $("missedChip").textContent = "";
  $("card").innerHTML =
    "<div class='done'><h2>Pool cleared.</h2>" +
    "<p>All " + s.total + " questions in " + scopeName() + " mastered · " +
    s.wrong + " misses along the way.</p>" +
    "<button class='next' id='againBtn'>Start over</button></div>";
  $("againBtn").onclick = resetScope;
}

function resetScope() {
  for (const q of scopeQuestions(scope)) {
    delete state.mastered[q.questionId];
    delete state.missed[q.questionId];
  }
  save();
  sessionRight = 0; sessionTotal = 0; lastId = null;
  draw();
}

// Two-tap reset: arm on first tap, wipe on second within 4 s.
let resetTimer = null;
const resetBtn = $("resetBtn");
function disarmReset() {
  clearTimeout(resetTimer);
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "Reset progress";
}
resetBtn.onclick = () => {
  if (resetBtn.classList.contains("armed")) {
    disarmReset();
    resetScope();
  } else {
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Tap again to wipe " +
      (scope === "all" ? "all progress" : testLabel(scope) + " progress");
    resetTimer = setTimeout(disarmReset, 4000);
  }
};

// Ask the browser to protect this origin's storage from eviction.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

draw();
</script>
