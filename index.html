2, "question": "When applying for a permit to re-install wiring that has been removed from an old Victorian house, the minimum license needed is:", "choices": [{"pos": 0, "letter": "A", "text": "specialty electrical license", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "general contractor’s license", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "remodeler’s license", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "no specific license is required", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. C-10 – Electrical Contractor California Code of Regulations Title 16, Division 8, Article 3. Classifications An electrical contractor places, installs, erects or connects any electrical wires, fixtures, appliances, apparatus, raceways, conduits, solar photovoltaic cells or any part thereof, which generate, transmit, transform or utilize electrical energy in any form or for any purpose.", "finished": false}, {"number": 19, "total": 120, "type": "single", "questionId": 42943, "question": "Records of accidents and injuries are kept:", "choices": [{"pos": 0, "letter": "A", "text": "for the exclusive benefit of employees", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "to help determine the causes of accidents and injuries", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "to show the insurance adjuster", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "to show the clients you are responsible", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. A review of records of accidents, near misses, and work-related injuries and illnesses can help identify causes and prevent recurrences.", "finished": false}, {"number": 20, "total": 120, "type": "single", "questionId": 42944, "question": "When does it make the most sense for a contractor to finance a job?", "choices": [{"pos": 0, "letter": "A", "text": "When he will not get the job otherwise", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "When the owner will go to a competitor otherwise", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "When it is an emergency situation, and the owner cannot get the money soon enough.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "When the owner has previous bankruptcies and cannot get credit.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. When it is an emergency situation and the owner cannot get the money soon enough is the situation that makes the most sense for a contractor to finance the job.", "finished": false}, {"number": 21, "total": 120, "type": "single", "questionId": 42945, "question": "Fixed costs apply to which of the following categories?", "choices": [{"pos": 0, "letter": "A", "text": "overhead", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "direct costs", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "travel expenses", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "labor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. In economics, fixed costs, indirect costs or overheads are business expenses that are not dependent on the level of goods or services produced by the business. They tend to be time-related, such as interest or rents being paid per month, and are often referred to as overhead costs.", "finished": false}, {"number": 22, "total": 120, "type": "single", "questionId": 57314, "question": "On a small job, what is the best way to make an efficient schedule?", "choices": [{"pos": 0, "letter": "A", "text": "bar chart", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "critical path method (CPM)", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "talk to suppliers to arrange around their schedules", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "talk to subs to arrange around their schedules", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  The bar chart is used for the representation of a project in which the activities are represented by horizontal segments, of which the length is proportional to the time necessary to conclude the task in question.  The bar chart is an effective tool for the management of work in a small project.", "finished": false}, {"number": 23, "total": 120, "type": "single", "questionId": 42947, "question": "On a large job, what is the best way to make an efficient schedule?", "choices": [{"pos": 0, "letter": "A", "text": "bar chart", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "critical path method (CPM)", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "follow your punch list", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "any of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Critical path was originally created to estimate task duration and help each of these behind-schedule projects get back on track. Today, the critical path method is used to identify the most important tasks and ensure your project doesn’t fall behind schedule.", "finished": false}, {"number": 24, "total": 120, "type": "single", "questionId": 42948, "question": "If you notice that the plans do not specify a fireproof door where one is required, you should:", "choices": [{"pos": 0, "letter": "A", "text": "report it to the architect", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "talk to the owner", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "fix it yourself", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "install the door and bill the client", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. If you notice something that is required is missing from plans you should report it to the architect. Architects in construction plays an important role and they are responsible for visual appearance of the buildings and structures before final structural design. Architect is a person appointed by the client, who develops a facility as per the design concept and the requirements specified by the client.", "finished": false}, {"number": 25, "total": 120, "type": "single", "questionId": 42949, "question": "How could a cash flow problem best be prevented?", "choices": [{"pos": 0, "letter": "A", "text": "Contract should specify 10% down and 80% along the way with a 10% retention.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Each payment should relate to a definite stage of the project.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Owner should pay in full at the start of the job.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Owner should pay 50% of total contract at start of the job.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  A typical home improvement contract provides for three or more progress payments. The other multiple-choice answers would be illegal.\n\nDown payment for a home improvement contract is limited to $1,000 or 10% of the contract price, whichever is less.\n\nManaging costs is about resource planning, cost estimating, budgeting, and control. Each payment should relate to a definite stage of the project.", "finished": false}, {"number": 26, "total": 120, "type": "single", "questionId": 42950, "question": "If a contractor has a bad set of plans, he or she should:", "choices": [{"pos": 0, "letter": "A", "text": "reject the job", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "do the job anyway", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "do a change order", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "talk to the owner and see if you can get a better set of plans & talk to an architect", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. If a contractor believes that the plans they are given are bad then they need to talk to the owner, and an architect about getting a better set of plans.", "finished": false}, {"number": 27, "total": 120, "type": "single", "questionId": 42951, "question": "Is Form 1099-MISC required for a corporation that provided $600 in services as an independent contractor during the calendar year?", "choices": [{"pos": 0, "letter": "A", "text": "Yes. Form 1099-MISC is required because the corporation is an independent contractor that was paid $500 or more.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "No. Form 1099-MISC is not required unless an independent contractor is paid over $1,000in a calendar year.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "No. Form 1099-MISC is not required for corporations with certain exceptions.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Yes. Form 1099-MISC is required for all individuals, partnerships, and corporations that provided services as an independent contractor during the calendar year.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. You are not required to issue a 1099-MISC to all corporations. Exceptions include payments of at least $600 to corporations that provide legal/attorney services.", "finished": false}, {"number": 28, "total": 120, "type": "single", "questionId": 42952, "question": "Which of the following are the best examples of fixed costs?", "choices": [{"pos": 0, "letter": "A", "text": "rent, truck payment, insurance", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "advertising, office supplies, equipment maintenance", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "mortgage, fuel, utilities", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "rent, utilities, equipment maintenance", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. In economics, fixed costs, indirect costs or overheads are business expenses that are not dependent on the level of goods or services produced by the business. They tend to be time-related, such as interest or rents being paid per month, and are often referred to as overhead costs. Examples of fixed costs include rental lease payments, salaries, insurance, property taxes, interest expenses.", "finished": false}, {"number": 29, "total": 120, "type": "single", "questionId": 42953, "question": "The minimum first-time offense fine for unlawful asbestos removal is:", "choices": [{"pos": 0, "letter": "A", "text": "$1,000", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$3,000", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$5,000", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "$7,000", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Fines and Penalties – A contractor who engages in asbestos-related abatement work of 100 square feet or more surface area of asbestos-containing materials without CSLB certification/licensure and DOSH registration is subject to one of the following fines and penalties by CSLB: • For a first offense conviction, the fine is between $1,000 and $3,000 and may include license revocation or suspension (Business and Professions Code section 7028.1(a)). • For conviction of a subsequent offense, the fine is between $3,000 and $5,000 or possible imprisonment in county jail for up to one year, or both, as well as license suspension or revocation (Business and Professions Code section 7028.1(b)).", "finished": false}, {"number": 30, "total": 120, "type": "single", "questionId": 42954, "question": "When putting together a basic insurance package that meets your construction company’s needs, which would not be considered?", "choices": [{"pos": 0, "letter": "A", "text": "property insurance", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "liability insurance", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "umbrella policy", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "workers’ compensation policy", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The references listed in the CSLB Study Guide recommend that a construction company obtain property, commercial general liability, and workers’ compensation insurance. An umbrella policy extends the limits of your coverage but is considered optional, especially for a new contractor.", "finished": false}, {"number": 31, "total": 120, "type": "single", "questionId": 42955, "question": "When an employee who is not hired for a specified period quits without notice, the employee must be paid:", "choices": [{"pos": 0, "letter": "A", "text": "within 5 days of quitting.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "within 72 hours of quitting.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "half immediately with the balance due within 30 days.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "immediately.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  The rule is that an employee who quits without notice must be paid within 72 hours (or 3 days) of quitting. An employee who has given 72 hours notice is entitled to wages at the time of quitting.", "finished": false}, {"number": 32, "total": 120, "type": "single", "questionId": 42956, "question": "Every original license, except an additional classification issued shall be a probationary license until:", "choices": [{"pos": 0, "letter": "A", "text": "the license is renewed", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "information is brought to the attention of the registrar, during such probationary period, regarding any act or omission of the licensee constituting grounds for denial, revocation, or suspension of an application or license.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "A & B", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Section 7077 – Probationary license Every original license, except an additional classification issued pursuant to Section 7059, shall be a probationary license until such time as the license is renewed. If information is brought to the attention of the registrar, during such probationary period, regarding any act or omission of the licensee constituting grounds for denial, revocation, or suspension of an application or license, such that, in the registrar’s discretion, it would be proper to revoke the probationary license, the registrar shall forthwith notify the applicant to show cause within not more than 30 days, why the probationary license should not be revoked.", "finished": false}, {"number": 33, "total": 120, "type": "single", "questionId": 42957, "question": "Which agency would you contact when changing the location of a driveway on private property?", "choices": [{"pos": 0, "letter": "A", "text": "state", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "local building department", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "county", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "national", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The first agency to contact would be the local building department. A permit may or may not be required depending on the type of construction. The building code may exempt driveways and walks not more than 30 inches above grade and not over any basement or story.", "finished": false}, {"number": 34, "total": 120, "type": "single", "questionId": 42958, "question": "When demolishing a three-story structure, which agency would you contact first?", "choices": [{"pos": 0, "letter": "A", "text": "state", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "local building department", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "county", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "national", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. You should first contact the local building department. A Cal/OSHA (state) permit is required for demolition of buildings more than three stories (36 feet) high.", "finished": false}, {"number": 35, "total": 120, "type": "single", "questionId": 42959, "question": "The purpose of a specification sheet attached to a set of plans is to:", "choices": [{"pos": 0, "letter": "A", "text": "show alternative plan views.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "provide details that are not on the plans.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "list work assignments.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "list specific dates of completion.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Specifications add details that are not on the plans. For example, the plans may show an exterior door and the dimensions of the opening, and the specifications might describe the door as a solid-core and left-hand swing.", "finished": false}, {"number": 36, "total": 120, "type": "single", "questionId": 69078, "question": "What is the best method of adjusting inventory in the general ledger?", "choices": [{"pos": 0, "letter": "A", "text": "adding new purchases", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "averaging last year’s inventory", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "counting the existing inventory", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "subtracting what you have used", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  Count the physical inventory at the end of the period, compare it to the book balance, and then record a journal entry to adjust the general ledger accordingly, so the physical count is what ultimately triggers the adjustment.", "finished": false}, {"number": 37, "total": 120, "type": "single", "questionId": 42961, "question": "Where must the supplier’s Safety Data Sheets (SDS) be kept?", "choices": [{"pos": 0, "letter": "A", "text": "at the job site", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at the office", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "they should be discarded", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "in a file cabinet", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A Safety Data Sheet “SDS” (formerly Material Safety Data Sheet “MSDS”) provides information on hazardous chemicals.", "finished": false}, {"number": 38, "total": 120, "type": "single", "questionId": 42962, "question": "Which of the following statements is true?", "choices": [{"pos": 0, "letter": "A", "text": "a 17 year old can legally drive a forklift", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "a 17 year old can legally work on a roof", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a 15 year old can legally work in a tunnel", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "an 18 year old can legally drive a vehicle as part of his normal job duties", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Federal and California laws prohibit minors from doing certain types of work including roofing, demolition, excavation, mining, driving forklifts, operating power-driven circular saws and band saws, and other activities considered hazardous.", "finished": false}, {"number": 39, "total": 120, "type": "single", "questionId": 68897, "question": "Which of the following is least important in preparing a bid for a home construction project?", "choices": [{"pos": 0, "letter": "A", "text": "cost of permits", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "cost of materials", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "cost of labor", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "overhead and profit", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The cost of permits would be the least important detail of the choices presented here. Labor and material costs will be much higher than permit fees. A bid should also include an appropriate allocation for overhead and allow for sufficient profit.", "finished": false}, {"number": 40, "total": 120, "type": "single", "questionId": 42964, "question": "A job calls for the demolition of an old residence in order for a new residence to be built. Which of the following should be done?", "choices": [{"pos": 0, "letter": "A", "text": "Call an asbestos abatement contractor to check for asbestos.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Call a demolition subcontractor to remove any suspected asbestos before the inspector arrives.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Demolish the building regardless of asbestos.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Remove any asbestos yourself, then demolish the building.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Removal must be in compliance with OSHA and EPA standards. Notification must be made to the State or EPA asbestos NESHAP coordinator 10 working days before demolition of any building, even if it does not contain asbestos. … All asbestos containing materials must be removed before burning a structure.", "finished": false}, {"number": 41, "total": 120, "type": "single", "questionId": 42965, "question": "When spraying toxic materials, which of the following safety equipment must be worn?", "choices": [{"pos": 0, "letter": "A", "text": "hooded suit", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "respirator specifically designed for that material", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "safety goggles", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "none, toxic materials should never be sprayed", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. OSHA’s respirator standard requires employers to establish and maintain an effective respiratory protection program when employees must wear respirators to protect against workplace hazards. Different hazards require different respirators, and employees are responsible for wearing the appropriate respirator and complying with the respiratory protection program.", "finished": false}, {"number": 42, "total": 120, "type": "single", "questionId": 42966, "question": "Federal regulations on overtime apply to:", "choices": [{"pos": 0, "letter": "A", "text": "piece work", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "hourly employees", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "salaried employees", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. In 2016 new federal overtime rules were adopted that removed certain long-standing exemptions. Salaried employees who do not meet a certain pay threshold will be entitled to overtime, as are hourly and other workers.", "finished": false}, {"number": 43, "total": 120, "type": "single", "questionId": 42967, "question": "Which of the following is a true statement about payroll taxes?", "choices": [{"pos": 0, "letter": "A", "text": "All wages are subject to taxation.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Bartered goods are not subject to taxes.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Bonuses are not subject to taxes.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Payroll taxes must be paid only once a year.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Wages are compensation for an employee’s personal services, whether paid by check or cash, or the reasonable cash value of noncash payments such as meals and lodging. Payments are considered wages even if the employee is a casual worker, a day or contract laborer, part-time or temporary worker, or paid by the day, hour, or any other method or measurement. Wages include, but are not limited to: Salaries, hourly pay, piece rate, or payments by the job. Commissions and bonuses. Overtime and vacation pay. The reasonable cash value of compensation other than cash. Wages are subject to all employment (payroll) taxes and reportable as Personal Income Tax (PIT) wages unless otherwise stated.", "finished": false}, {"number": 44, "total": 120, "type": "single", "questionId": 42968, "question": "The best two methods of keeping track of job expenses are:", "choices": [{"pos": 0, "letter": "A", "text": "general ledger and payroll journal", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "payroll journal and expense journal", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "expense journal and general ledger", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "general journal and general ledger", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A payroll journal is a detailed record of accounting transactions related to payroll. Expense Journal entries are the key accounting entries that reflect the expenditures incurred by the entity. Journal entries are the base of accounting. All journal entries construct financial statements and help in financial analysis and decision-making.", "finished": false}, {"number": 45, "total": 120, "type": "single", "questionId": 71744, "question": "Form I-9 must be completed by all employees, including U.S. citizens. When must the employer complete Form I-9?", "choices": [{"pos": 0, "letter": "A", "text": "when they apply for the job", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the first day they start work", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "within 3 business days of the date of hire", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "within 30 business days of the date of hire", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Be sure to read this question carefully because the requirements are different for employer and employee. Employers must complete Section 2 of Form I-9 within three business days of an employee’s first day of work for pay. While employees must complete Section 1 by their first day of work, the employer’s verification of documentation (Section 2) must be finalized by the end of the third business day. NOTE:  If the person will be employed for less than three days, the form must be completed by the end of the employee’s first working day.", "finished": false}, {"number": 46, "total": 120, "type": "single", "questionId": 42970, "question": "By law, the maximum hours in a day a minor may work is:", "choices": [{"pos": 0, "letter": "A", "text": "6", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "7", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "8", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "9", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. During the school year, minors aged 16 to 17 generally are limited to 4 hours of work on a school day, 8 hours on a nonschool day, from 5 a.m. to 10 p.m. (or until 12:30 a.m. on a nonschool day). When school is out, the limits are 8 hours per day and 48 per week. Minors 14 to 15 years of age may work up to 3 hours on a school day, 8 hours on a nonschool day, and 18 hours in a week, between 7 a.m. and 7 p.m. when school is in session, until 9 p.m. from June 1st through Labor Day, and as many as 40 hours per week when school is out.", "finished": false}, {"number": 47, "total": 120, "type": "single", "questionId": 42971, "question": "What is the maximum number of hours a minor can work on the day before a school day?", "choices": [{"pos": 0, "letter": "A", "text": "6", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "7", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "8", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "9", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. During the school year, minors aged 16 to 17 generally are limited to 4 hours of work on a school day, 8 hours on a nonschool day, from 5 a.m. to 10 p.m. (or until 12:30 a.m. on a nonschool day). When school is out, the limits are 8 hours per day and 48 per week. Minors 14 to 15 years of age may work up to 3 hours on a school day, 8 hours on a nonschool day, and 18 hours in a week, between 7 a.m. and 7 p.m. when school is in session, until 9 p.m. from June 1st through Labor Day, and as many as 40 hours per week when school is out.", "finished": false}, {"number": 48, "total": 120, "type": "single", "questionId": 42972, "question": "What is a qualifier called if he/she is a RME?", "choices": [{"pos": 0, "letter": "A", "text": "Qualifying Owner", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Qualifying Partner", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Qualifying Officer", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Qualifying Employee", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. If the qualifier is an employee, the title given to the individual is RME (Responsible Managing Employee).", "finished": false}, {"number": 49, "total": 120, "type": "single", "questionId": 42973, "question": "What is the best time to talk to a client about liens and stop notices?", "choices": [{"pos": 0, "letter": "A", "text": "before the job starts", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10 days after the job starts", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "20 days after the job starts", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "30 days after the job starts", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Consumers are required to receive a “Notice to Owner” warning about property liens. Anyone who helps improve property, but is not paid, may place what is called a mechanics lien on the property. The main difference between a Mechanics Lien and a Stop Notice is that the lien is secured against the property, ‘trapping’ it from being sold or transferred until your bill is paid. On the other hand, the notice has no affect on the property – instead, it ‘traps’ the funds on the project.", "finished": false}, {"number": 50, "total": 120, "type": "single", "questionId": 42974, "question": "When it comes to liens:", "choices": [{"pos": 0, "letter": "A", "text": "the owner is responsible for paying for the work of improvement.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "subcontractors cannot file a lien.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "you can file a lien at any time.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "suppliers cannot file a lien.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A mechanics lien is a “hold” against a property, filed by an unpaid contractor, subcontractor, laborer, or material supplier, and is recorded with the county recorder’s office. If unpaid, it allows a foreclosure action, forcing the sale of the property in lieu of compensation. A lien can result when the prime contractor (referred to as a “direct contractor” in mechanics lien revision statutes, effective July 1, 2012) has not paid subcontractors, laborers, or suppliers. Legally, the homeowner is ultimately responsible for payment — even if they already have paid the direct contractor.", "finished": false}, {"number": 51, "total": 120, "type": "single", "questionId": 42975, "question": "Your workers’ comp insurance policy lapsed two weeks ago. You mailed the check yesterday, and today one of your employees is injured on the job. Which of the following statements is true?", "choices": [{"pos": 0, "letter": "A", "text": "You are covered because you mailed a check.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "You are covered because the injury occurred within 30 days of the lapse of coverage.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "You are not covered because the policy lapsed.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "You are not covered because the injury occurred after the two-week grace period.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California law requires that employers, including those in the construction industry, carry workers’ compensation insurance, even if they have only one employee. If your policy lapses, you will not be covered. The key word in this question is “lapsed.” The definition commonly found in insurance manuals is: “LAPSE—This occurs when the premium on a policy is not paid, and the policy is beyond the grace period. No benefits would be paid.” In many cases, though, if you realize that your insurance has lapsed quickly enough, you can make the payment the next month and have the policy reinstated with “no lapse in coverage.” This means that any injuries that occurred during the time period when there was a lapse would be covered as workers’ compensation claims – do everything in your power to not let your insurance coverage lapse. California law requires that employers, including those in the construction industry, carry workers’ compensation insurance, even if they have only one employee. If your policy lapses, too long (31+ days) you will not be covered.", "finished": false}, {"number": 52, "total": 120, "type": "single", "questionId": 42976, "question": "Which type of bond ensures that the contractor will pay all labor and material bills and fulfill the terms of the contract?", "choices": [{"pos": 0, "letter": "A", "text": "contract bond", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "performance bond", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "materials bond", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "bid bond", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. A contract bond is a guarantee the terms of a contract are fulfilled. If the contracted party fails to fulfill its duties according to the agreed upon terms, the contract “owner” can claim against the bond to recover financial losses or a stated default provision. A contract bond is defined as a bond that guarantees “both job completion and payment of all labor and materials.” The performance bond guarantees job completion according to plans and specs but does not guarantee payment of bills.", "finished": false}, {"number": 53, "total": 120, "type": "single", "questionId": 42977, "question": "What must licensed plumbing, electrical sign, and well drilling contractors have displayed on both sides of their commercial vehicles?", "choices": [{"pos": 0, "letter": "A", "text": "name, business address, phone number, and contractor’s license number", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "name, business address, and contractor’s license number", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "name and contractor’s license number only", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "nothing", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The Contractors License Law requires that a C-36, C-45, or C-57 contractor display on both sides of their business vehicles “his or her name, permanent business address, and contractor’s license number, all in letters and numerals not less than 1-1/2 inches high.”", "finished": false}, {"number": 54, "total": 120, "type": "single", "questionId": 42978, "question": "You have determined that the job you are working on involves asbestos. What should you do?", "choices": [{"pos": 0, "letter": "A", "text": "File for an Asbestos Abatement certificate.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Stop work immediately.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Register with DOSH.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Remove any asbestos and keep working.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. If you have determined that the job you are working on involves asbestos, the first thing you do is to stop work immediately. The contractor(s) must always presume that asbestos is present in any building or structure unless the owner can produce proof that materials are asbestos-free. The owner’s response should be documented. The property owner, general contractor, or contractor must perform due diligence to prove the presence or absence of asbestos before disturbing suspect building materials on any building or structure built at any time.", "finished": false}, {"number": 55, "total": 120, "type": "single", "questionId": 42979, "question": "Which of the following would qualify a person as an “independent contractor”?", "choices": [{"pos": 0, "letter": "A", "text": "can make a profit or loss on work", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "doesn’t punch a time clock", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "works at home", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "only works on small jobs", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. IRS Publication 15-A lists various criteria that determine whether a person is an independent contractor as opposed to an employee. One of the criteria listed is: “The extent to which the worker can realize a profit or loss. An independent contractor can make a profit or loss.”", "finished": false}, {"number": 56, "total": 120, "type": "single", "questionId": 42980, "question": "One of your customer’s accounts has gone past 30 days. What is the best method of handling it?", "choices": [{"pos": 0, "letter": "A", "text": "Send it to a collection agency.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Contact the customer and put them on a new payment schedule.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Begin to charge interest on the customer’s account.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Stop work immediately.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Charging interest on the customer’s account would be the best way to handle past due payments.", "finished": false}, {"number": 57, "total": 120, "type": "single", "questionId": 42981, "question": "A bookkeeper for a construction company sends out invoices once a month. How should the company file its copy of each invoice?", "choices": [{"pos": 0, "letter": "A", "text": "accounts payable", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "notes payable", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "operating profit", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "accounts receivable", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Accounts receivable are the amounts due from customers. Accounts receivable are legally enforceable claims for payment held by a business for goods supplied and/or services rendered that customers/clients have ordered but not paid for. These are generally in the form of invoices raised by a business and delivered to the customer for payment within an agreed time frame.", "finished": false}, {"number": 58, "total": 120, "type": "single", "questionId": 42982, "question": "What should construction employees wear when working at night?", "choices": [{"pos": 0, "letter": "A", "text": "bright-colored vests", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "dark-colored jackets", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "light sticks on strings around their necks", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "night vision goggles", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The OSHA manual states that for daytime work, flaggers must wear a vest, shirt or jacket colored orange, yellow or strong yellow-green. It can be fluorescent. For night work flaggers must wear a “retroreflective” vest, shirt or jacket that reflects back a high percentage of headlight beams.", "finished": false}, {"number": 59, "total": 120, "type": "single", "questionId": 42983, "question": "Which of the following muscles should be used more when lifting heavy materials?", "choices": [{"pos": 0, "letter": "A", "text": "back", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "arms", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "legs", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "shoulders", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Lifting from your legs gives you the power and stability you need to move weights without hurting your back. Back injuries are among the most common form of injury in the United States. … Avoid twisting your trunk, your legs and arms should do most of the moving. Keep the weight close to your body.", "finished": false}, {"number": 60, "total": 120, "type": "single", "questionId": 42984, "question": "Where would a contractor go to verify that building permits were issued for all construction work done on a house?", "choices": [{"pos": 0, "letter": "A", "text": "agency that granted initial permit", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "State Department of Housing", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "OSHA", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "County Recorder’s office", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. When a contractor wants to verify that a building permit was issued, the best way to find out would be to check with agency that granted the initial permit.", "finished": false}, {"number": 61, "total": 120, "type": "single", "questionId": 42985, "question": "Which of the following must be included in a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "permit number", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "license bond number", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "approximate starting and completion dates", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "local building department requirements", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The Contractors License Law requires that a home improvement contract include the “approximate date on which work will be commenced” and the “approximate date of completion.”", "finished": false}, {"number": 62, "total": 120, "type": "single", "questionId": 42986, "question": "How many times may the qualifying individual take the State license exam before the application is voided?", "choices": [{"pos": 0, "letter": "A", "text": "once", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "twice", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "three times", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "as many times as necessary within 18 months", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. If you do not pass within 18 months after your application is accepted by the Board, your application is considered void, and you will have to submit a new application with new fees.", "finished": false}, {"number": 63, "total": 120, "type": "single", "questionId": 65089, "question": "A time card includes the day and hours the person worked, as well as:", "choices": [{"pos": 0, "letter": "A", "text": "the hourly wage", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the location of the job", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the employees date of birth", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a description of the work", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. a description of the work.  A typical time card will also usually include the employee’s name, the days and hours worked, and the job or project number. This is based on “Builders Guide to Accounting” which in the past was on the Law Study Guide. We like to keep questions that are based on CSLB Study Guides because it is common the CSLB will reuse older questions. The excerpt from the book is “ Each wage earring employee turns in an approved time card each week. Hours are listed by day and are broken down by project. The foreman approves the work description section and the weekly total hours for each man in his area.”", "finished": false}, {"number": 64, "total": 120, "type": "single", "questionId": 42988, "question": "When a contractor is bidding a job, which of the following is the biggest risk factor?", "choices": [{"pos": 0, "letter": "A", "text": "owner’s financial stability", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "change orders", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "small extras", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "finding subs", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Under financial risk factors, the identified risk factor with the highest mean score is funding uncertainties while stability of market condition scored the least, meaning that funding uncertainties is perceived as the greatest risk factor for building contractors in cost estimation.", "finished": false}, {"number": 65, "total": 120, "type": "single", "questionId": 42989, "question": "Which of the following statements about the State safety code is correct?", "choices": [{"pos": 0, "letter": "A", "text": "It is a complete code that adopts portions of local codes.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "It is a complete code that adopts all local codes.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Several state agencies are involved with regulation of the code.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It is the only code you must consult.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Safety requirements are reflected in numerous local, state, and federal laws and regulations. The bulk of the State requirements relating to contractors in California are found in the California Labor Code and Title 8 of the California Code of Regulations. Neither is considered a complete code. Several State agencies like DOSH have regulatory or advisory roles.", "finished": false}, {"number": 66, "total": 120, "type": "single", "questionId": 42990, "question": "Contractors should keep good business records:", "choices": [{"pos": 0, "letter": "A", "text": "for insurance purposes.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "to determine if the business is making a profit.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "to monitor the change in costs over a five-year period.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "in case the IRS audits them.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. For questions like this, you much choose the BEST answer. Good business records should be kept for insurance purposes, to monitor changes in costs, and for IRS audits. Determining if the business is making a profit (the bottom line) is the best answer.", "finished": false}, {"number": 67, "total": 120, "type": "single", "questionId": 42991, "question": "Where can workers obtain the name of the employer’s current workers’ compensation insurance carrier?", "choices": [{"pos": 0, "letter": "A", "text": "From the notice that must be posted conspicuously in a location frequented by employees.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "From the notice printed on every paycheck.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Only if the employer chooses to disclose the name of the carrier.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "By phoning the employer’s insurance agent.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. You must post the “notice to employees” poster in a conspicuous place at the work site. This poster provides employees with information on your workers’ compensation coverage and where to get medical care for work injuries. Specific requirements are contained in sections 3550-3553 of the California Labor Code. Failure to post this notice is a misdemeanor that can result in a civil penalty of up to $7,000 per violation. Contact your insurer to get the posting notice and the required information that must be included on it.", "finished": false}, {"number": 68, "total": 120, "type": "single", "questionId": 71851, "question": "A small contractor with no employees is working out of his/her garage. Which of the following types of license classification(s) requires the contractor to hold valid worker’ compensation insurance currently?", "choices": [{"pos": 0, "letter": "A", "text": "None of the below", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "C-39 Roofing, C-8 Concrete, C-20 HVAC.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "C-22 Asbestos Abatement, C-49 Tree and Palm", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "B and C", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Contractors who possess a C-8, C-20, C-22, C-39, or C-49 classification(s) are required to hold a valid workers’ compensation insurance, whether or not they have employees. The question is straightforward and the answers may seem jumbled, but the State examination tests candidates in such a way that they should be able to correctly answer this question. California SB 216 requires all licensed contractors to carry Workers’ Compensation insurance, whether or not they have employees. The first phase took effect in 2023 for specific contractor license types, such as C-8 Concrete, C-20 HVAC, C-22 Asbestos Abatement, and D-49 Tree Service. C-39 Roofing contractors without employees in California have been required to carry Workers’ Compensation insurance even before SB 216.  The second, broader phase required all other contractors to comply by January 2026, but has since been extended with a new bill, SB 1455 – postponed the deadline to meet the new requirements to January 1, 2028.", "finished": false}, {"number": 69, "total": 120, "type": "single", "questionId": 42993, "question": "The Mechanics Lien Warning is for the protection of:", "choices": [{"pos": 0, "letter": "A", "text": "the owner.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the contractor.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the contractor’s employees.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. NOTE: This question is asking about the Mechanics Lien WARNING, not the Mechanics Lien itself. The warning is to protect the owner. The Mechanics Lien Warning describes in non-technical language the basics of California’s lien laws and must be included in home improvement and swimming pool contracts. Anyone who helps improve a property, but who is not paid, may record what is called a mechanics lien on the property. A mechanics lien is a claim, like a mortgage or home equity loan, made against your property and recorded with the county recorder. Even if the owner pays their contractor in full, unpaid subcontractors, suppliers, and laborers who helped to improve their property may record mechanics liens and sue them in court to foreclose the lien.\n\nThe warning itself protects the owner by advising who is working their property and gives them a list of exactly who to pay. For example, the list of sub-contractors provided by the prime. In addition, it gives an owner notice of work being done that may not have been authorized too.", "finished": false}, {"number": 70, "total": 120, "type": "single", "questionId": 42994, "question": "Which of the following is/are grounds for a disciplinary action?", "choices": [{"pos": 0, "letter": "A", "text": "Failure to provide the owner with a Mechanics Lien Warning.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Failure to pay employees after receiving payment from the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Failure to complete a project for the price stated in the contract.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. All are grounds for disciplinary action that can range from fines to suspension or revocation of a license.", "finished": false}, {"number": 71, "total": 120, "type": "single", "questionId": 42995, "question": "At what rate must employees be paid if working a 40-hour week that includes work on a Sunday?", "choices": [{"pos": 0, "letter": "A", "text": "regular time", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "time and a half", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "double time", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "triple time", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Work over 40 hours in a week must be paid at 1-1/2 the regular rate, but an employee who works on Sunday in place of another day, and is still within 40 hours, gets regular pay unless an extra amount was offered as an incentive. Key word: includes.", "finished": false}, {"number": 72, "total": 120, "type": "single", "questionId": 42996, "question": "If an employee is fired as a result of a garnishment, he must notify __________ within _____ days, if he intends to file a claim disputing lost wages following the firing.", "choices": [{"pos": 0, "letter": "A", "text": "employer … 30", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "employer … 60", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Labor Commissioner … 30", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Labor Commissioner … 60", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. An employee may not be fired because of a wage garnishment to pay a judgment. If fired, the employee must give notice to the employer within 30 days of his/her INTENTION to file a wage claim, and has 60 days to file the actual claim with the Labor Commissioner.", "finished": false}, {"number": 73, "total": 120, "type": "single", "questionId": 42997, "question": "In Small Claims Court, if you want to be represented by an attorney (lawyer):", "choices": [{"pos": 0, "letter": "A", "text": "the attorney must remain quiet except when consulting.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "you are limited to one attorney.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "you cannot consult with attorney in Small Claims Court.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the attorney is limited to 10 minutes of bench time.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. You may not be represented by or consult with an attorney during a Small Claims Court proceeding. However, you may consult an attorney before filing a claim or after obtaining a judgment if you need assistance collecting the amount awarded by the Court.", "finished": false}, {"number": 74, "total": 120, "type": "single", "questionId": 42998, "question": "When a dispute over an alleged violation is referred to arbitration, the CSLB Registrar looks for:", "choices": [{"pos": 0, "letter": "A", "text": "licensee has 2 or less violations in past 10 years.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "license in good standing at time of alleged violation.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "all parties have agreed to private arbitration.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "amount of damage is over $50,000.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Arbitration is when disputing parties submit their differences to an impartial neutral person who makes a final award or decision. Many disputes between consumers and contractors can be resolved efficiently and in a timely manner through arbitration", "finished": false}, {"number": 75, "total": 120, "type": "single", "questionId": 42999, "question": "How many employees must an employer have before State Disability Insurance (SDI) deductions are required?", "choices": [{"pos": 0, "letter": "A", "text": "0", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1 or more", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "2 or more", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "3 or more", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. California law requires employers to participate in the state short-term disability insurance (SDI) program. Employers are required to withhold and send State Disability Insurance (SDI) contributions to the EDD. They must also inform their employees of laws and regulations pertaining to employment, benefits, and working conditions. State disability insurance (SDI) is deducted from the wages of each employee regardless of the number of employees.", "finished": false}, {"number": 76, "total": 120, "type": "single", "questionId": 62019, "question": "How many employees must an employer have before he must apply for workers compensation insurance? (aside from contractors who hold C-8, C-20, C-22, C-39, or C-49 classifications).", "choices": [{"pos": 0, "letter": "A", "text": "0", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1 or more", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "2 or more", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "3 or more", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. California law requires that employers, including those in the construction industry, carry workers’ compensation insurance, even if they have only one employee. The insurance exists for employees who get hurt or sick because of work. Workers’ compensation insurance provides basic benefits, including medical care, temporary disability benefits, permanent disability benefits, supplemental job displacement benefits and a return-to-work supplement, and death benefits. As of January 1, 2023 – Contractors who possess a C-8, C-20, C-22, C-39, or C-49 classification(s) are required to hold a valid workers’ compensation insurance, whether or not they have employees.", "finished": false}, {"number": 77, "total": 120, "type": "single", "questionId": 74262, "question": "What is the maximum amount a contractor can raise his prices during a declared state of emergency and not be guilty of price-gouging?", "choices": [{"pos": 0, "letter": "A", "text": "5%", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "10%", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "15%", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "20%", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. California’s anti-price gouging statute, Penal Code Section 396, prohibits raising the price of many consumer goods and services by more than 10% after an emergency has been declared.", "finished": false}, {"number": 78, "total": 120, "type": "single", "questionId": 43002, "question": "What is the maximum penalty for a contractor convicted of price-gouging during a declared state of emergency?", "choices": [{"pos": 0, "letter": "A", "text": "permanent license revocation by CSLB", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$10,000 fine", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "1 year in jail", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Criminal penalties would include a year in jail and/or a $10,000 fine. In addition, the CSLB may take disciplinary action ranging from a license suspension of six months to permanent revocation.", "finished": false}, {"number": 79, "total": 120, "type": "single", "questionId": 43003, "question": "What is the maximum penalty for working as a contractor with a license that has been revoked, suspended, or has lapsed?", "choices": [{"pos": 0, "letter": "A", "text": "3 years probation", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "1 year in jail", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "6 months in jail and $15,000 fine", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "3 years in prison", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Those who are caught contracting without a license likely will have to appear before a Superior Court judge to answer to misdemeanor charges that can carry a potential sentence of up to six months in jail and/or a $5,000 fine, as well as an administrative fine of $200 to $15,000. If illegal contracting continues, the penalties become more severe. A second offense results in a mandatory 90-day jail sentence and a fine of 20 percent of the contract price or $5,000.", "finished": false}, {"number": 80, "total": 120, "type": "single", "questionId": 43004, "question": "Which of the following components of a bid would be considered non-productive?", "choices": [{"pos": 0, "letter": "A", "text": "equipment purchased for job", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "surface preparation for painting", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "equipment rental", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "travel time", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Time is considered non-productive if it is paid but does not contribute to the production of work. Examples are travel time and safety meetings.", "finished": false}, {"number": 81, "total": 120, "type": "single", "questionId": 43005, "question": "A payment bond on a home improvement would be posted by the:", "choices": [{"pos": 0, "letter": "A", "text": "prime contractor or property owner.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "prime contractor or subcontractor.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "subcontractor or material supplier.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "property owner or material supplier.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Payment Bond is a bond usually procured by the owner or contractor in an amount sufficient to pay all claims of claimants. The bond gives the claimant the right to recover in any suit brought on the bond. Usually, the bond is used to protect against mechanics liens and substitutes the bond as security instead of the real property.", "finished": false}, {"number": 82, "total": 120, "type": "single", "questionId": 43006, "question": "Insurance Requirements for Public Works projects, the insurance must provide:", "choices": [{"pos": 0, "letter": "A", "text": "Workers’ Compensation as required by the Labor of the State of California and Employers Liability Insurance", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Commercial general liability coverage", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Automobile Liability for all owned and non-owned and hired automobiles", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Answers A, B and C are all required coverage for Public Works projects.", "finished": false}, {"number": 83, "total": 120, "type": "single", "questionId": 43007, "question": "To prevent cash flow problems at the end of a construction project, the contractor should:", "choices": [{"pos": 0, "letter": "A", "text": "obtain a line of credit from a bank.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "order all materials before beginning work.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "seriously consider changing the payment schedule.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "ask the owner to make payments before they are due.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. You can avoid a cash flow issue using accessible capital with options like a business line of credit or SBA loan. Lines of credit are quick loans for small business owners to cover expenses such as cash flow shortages, day-to-day expenses, and even larger purchases. Like a credit card, a business line of credit offers flexibility; you can use the funds whenever you need them without having to reapply. It is a revolving loan, which means that you can spend up to your credit limit and only pay interest on the amount that you borrow.", "finished": false}, {"number": 84, "total": 120, "type": "single", "questionId": 43008, "question": "A home improvement salesperson’s registration must be renewed:", "choices": [{"pos": 0, "letter": "A", "text": "for every job.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "once per year.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "every two years.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "every four years.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Home improvement registrations expire two years from the last day of the month in which it was issued.", "finished": false}, {"number": 85, "total": 120, "type": "single", "questionId": 43009, "question": "Which of the following is not a misdemeanor?", "choices": [{"pos": 0, "letter": "A", "text": "A home improvement salesperson failed to disclose the name of the contractor on a home improvement contract form.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A home improvement salesperson gave a homeowner $20 for each new customer the homeowner referred to the salesperson.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "A home improvement salesperson failed to give the contractor a $50 down payment the salesperson received from the customer.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "A home improvement salesperson gave a prospective customer an unconditional gift valued at $5 as part of a sales promotion.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Answers A, B and C would all be considered misdemeanors. Answer D. would not be considered misdemeanor.", "finished": false}, {"number": 86, "total": 120, "type": "single", "questionId": 43010, "question": "The prime contractor must pay the subcontractor within how many days after receiving a progress payment?", "choices": [{"pos": 0, "letter": "A", "text": "3 days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "7 days", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "15 days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "30 days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A prime contractor must pay a subcontractor no later than seven days after receipt of a progress payment, unless otherwise agreed in writing.", "finished": false}, {"number": 87, "total": 120, "type": "single", "questionId": 43011, "question": "If an employee is 20 minutes late for work, the employer may:", "choices": [{"pos": 0, "letter": "A", "text": "deduct a half hour’s wage", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "deduct an hour’s wage", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "deduct for 20 minutes only", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "not deduct from wages", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The employer may deduct a half hour’s wages for any time lost during the first 30 minutes of the workday. Per Labor Code section 2928.", "finished": false}, {"number": 88, "total": 120, "type": "single", "questionId": 69292, "question": "Of the following, who may file a Mechanics Lien?", "choices": [{"pos": 0, "letter": "A", "text": "manufacturers of construction materials and subcontractors", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "manufacturers of construction materials and clients", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "clients and subcontractors", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "equipment lessors and design professionals", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Unlike material suppliers (retailers), manufacturers are not entitled to file Mechanics Liens. The following parties are entitled to Mechanics Lien rights in California: direct contractors, subcontractors, material suppliers, equipment lessors, laborers, design professionals, and any person providing work authorized for site improvement. Additionally, if the work being performed requires a license, the claimant must be licensed to file a mechanics lien.", "finished": false}, {"number": 89, "total": 120, "type": "single", "questionId": 43013, "question": "A general contractor with a general building license wants to form a corporation with two specialty contractors – one has a C-10 license and the other a C-36. The new corporation should:", "choices": [{"pos": 0, "letter": "A", "text": "be licensed in the general building classification only.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "be licensed in the C-10 and C-36 classifications only.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "be licensed in all three license classifications.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "obtain a special license from the CSLB.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. A corporate license number is issued exclusively to a specific corporate registration number assigned by the Secretary of State’s Office. If this registration number changes, a new contractor license number will be required for the new corporation. If a corporation dissolves, merges, or surrenders the right to do business in California through the Secretary of State’s Office, the contractor license must be canceled.", "finished": false}, {"number": 90, "total": 120, "type": "single", "questionId": 43014, "question": "What is a likely penalty for contracting for jobs with an inactive license?", "choices": [{"pos": 0, "letter": "A", "text": "permanent revocation of license", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "fine, one-year license suspension, and a minimum of six months in jail", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "fine and/or license suspension for up to one year", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "temporary suspension of license only", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Any work performed while the license is inactive is considered to be unlicensed and disciplinary action can be taken against you.", "finished": false}, {"number": 91, "total": 120, "type": "single", "questionId": 43015, "question": "A licensed contractor wants to work with a person who is not licensed. Of the following, which is a legal alternative?", "choices": [{"pos": 0, "letter": "A", "text": "They could work as partners if the licensed contractor signs all of the contracts.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "They should apply for a sole proprietorship contractor’s license.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "They could form a corporation and obtain a corporate contractor’s license.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "They could obtain a joint venture contractor’s license.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Corporate Licenses: A corporate license number is issued exclusively to a specific corporate registration number assigned by the Secretary of State’s Office. If this registration number changes, a new contractor license number will be required for the new corporation.", "finished": false}, {"number": 92, "total": 120, "type": "single", "questionId": 43016, "question": "A schedule of payments in a home improvement contract must include which of the following details?", "choices": [{"pos": 0, "letter": "A", "text": "amount of each payment as a sum in dollars and cents", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "specific reference to the amount of work and services to be performed", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "specific reference to the materials and equipment to be supplied", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. In construction, a payment schedule (or schedule of payments) is a list of dates setting out when payments will be made by one party to another under the terms of the contract between them. The interval of other payments after the initial payment. The timeframe within which the project will be completed. By including a payment schedule in the contract, setting out who needs to do what and by when, the likelihood of parties getting dates wrong (e.g. employer failing to serve a payment notice on time, or a contractor failing to serve an application for payment on the right date), can be reduced, and so disputes are less likely.", "finished": false}, {"number": 93, "total": 120, "type": "single", "questionId": 43017, "question": "Which of the following jobs does not require a contractor’s license?", "choices": [{"pos": 0, "letter": "A", "text": "building a six-foot high fence", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Oil and gas operations performed by an owner or lessee", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "painting the interior or exterior of a building", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "installing a French door", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Per CSLB’s California Contractors License Law & Reference Book – Oil and gas operations performed by an owner or lessee are exempt from requiring a contractor’s license.", "finished": false}, {"number": 94, "total": 120, "type": "single", "questionId": 60555, "question": "Which of the following is the most important factor with respect to a schedule of payments?", "choices": [{"pos": 0, "letter": "A", "text": "date", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "amount", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "keeping lender informed of job progress", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "phase", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  In construction, a payment schedule is a timeline of the payments to be made throughout the lifetime of a project. On most jobs, contractors don’t receive a single, lump-sum payment for the work or materials they provide.", "finished": false}, {"number": 95, "total": 120, "type": "single", "questionId": 43019, "question": "What is the maximum penalty for contracting with an inactive, suspended or expired licensed?", "choices": [{"pos": 0, "letter": "A", "text": "revocation of license.", "isCorrect": true, "wasSe
