"pos": 0, "letter": "A", "text": "Civil Rights Act of 1964", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Civil Rights Act of 1972", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Civil Rights Act of 1984", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Wagner Act of 1935", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The Wagner Act of 1935 (aka National Labor Relations Act) guarantees basic rights of private sector workers to organize into trade unions, to engage in collective bargaining, to negotiate contracts.", "finished": false}, {"number": 104, "total": 120, "type": "single", "questionId": 42780, "question": "For which of the following projects would you need a building permit?", "choices": [{"pos": 0, "letter": "A", "text": "Projects valued over $1,000.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "When a permit is required by the local building department.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Only for public works project.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A building permit is required for all projects.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Most projects require a building permit issued by the local building department. Exceptions might include retaining walls less than four feet high and finish work like painting and paperhanging.", "finished": false}, {"number": 105, "total": 120, "type": "single", "questionId": 67223, "question": "A homeowner enters into a $10,000 home improvement contract with a contractor that includes a $1,000 retention. The homeowner has already made progress payments totaling $9,000, and gives the contractor a final check for $1,000 that was issued by the bank. Which of the following statements about releases is correct?", "choices": [{"pos": 0, "letter": "A", "text": "An unconditional release for $9,000 paid and a conditional release for the $1,000 check.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A conditional release for $9,000 paid and a conditional release on receipt of $1,000 check.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "A conditional release for $9,000 paid and an unconditional release prior to receipt of $1,000 check.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "An unconditional release for the $9,000 paid and an unconditional release for the final payment of $1,000.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. An Unconditional Waiver and Release form for a progress of a final 1 payment should only be used if checks have been paid by the bank, as is the case with this question. A Conditional Release form should be used if a check has been received but not cleared by the bank. Be sure to use the statutory forms listed on the CSLB’s website.", "finished": false}, {"number": 106, "total": 120, "type": "single", "questionId": 42782, "question": "A contractor sued the owner for refusing to make final payment after the job was completed. The owner was demanding changes. Of the following, which is the BEST way for the contractor to avoid a lawsuit?", "choices": [{"pos": 0, "letter": "A", "text": "The contractor should have asked the workers to testify.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The contractor should have walked the job with the owner and had the owner sign a job completion form.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor should have just walked the job with the owner.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Asking workers to testify would not prevent a lawsuit. The CSLB recommends: “Frequent punch lists are a good idea. A walk-through near the end of the job to determine the items that are left to be completed is recommended. “It is a good idea for the contractor to obtain the owner’s signature on the final punch list (job completion form).", "finished": false}, {"number": 107, "total": 120, "type": "single", "questionId": 42783, "question": "An employer accrues $2,400 in federal withholding, Social Security, and Medicare taxes during a quarter. Which of the following statements about payments of the tax liability is correct?", "choices": [{"pos": 0, "letter": "A", "text": "The taxes may be reported and paid quarterly based on a calendar year.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The taxes must be deposited monthly.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The taxes must be reported and paid quarterly based on a fiscal year.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The taxes must be deposited semiweekly.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. If the federal tax obligation for a quarter is less than $2,500, the employer may report and pay taxes with Form 941 quarterly (calendar-year basis). If the employer’s tax obligation exceeds $2,500 for the quarter, payments are subject to a deposit schedule that may be monthly, semiweekly, or daily depending on the amount.", "finished": false}, {"number": 108, "total": 120, "type": "single", "questionId": 61203, "question": "Which of the following statements about a registered home improvement salesperson (HIS) is incorrect?", "choices": [{"pos": 0, "letter": "A", "text": "An HIS may represent multiple employers.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Employers must notify the CSLB in writing before hiring a HIS and when employment ends.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "A HIS registration expires four years from the last day of the month in which it was issued.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "A HIS must be at least 18 years old, and there are no education, residency, or experience requirements.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Remember: This questions is asking which answer is incorrect. Home Improvement Salesperson’s registration expires two years from the last day of the month in which it was issued. A new law was passed that allows an HIS to file a single registration with the CSLB and represent more than one contractor. Contractors are required to notify the CSLB in writing before hiring an HIS and within 90 days after employment ends.", "finished": false}, {"number": 109, "total": 120, "type": "single", "questionId": 42785, "question": "If an employee suffers an injury on the job that requires only minor first aid, an insured contractor:", "choices": [{"pos": 0, "letter": "A", "text": "must file a complete report of the injury with the workers’ compensation insurer.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "is not required to file a report.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "must file complete reports of the injury with Division of Labor Statistics and Research (DSLR), and the workers’ compensation insurer.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "must report the injury to DOSH by telephone.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The contractor is not required to report an injury that: (a) does not result in lost work time beyond the date of the injury, and (b) does not require medical treatment beyond first aid. If an occupational injury or illness results in lost time beyond the date of the injury or requires medical treatment beyond first aid, the contractor MUST file a complete report with the Division of Labor Statistics and Research (DSLR) and with the workers’ compensation insurer. In addition a serious injury or death must be reported immediately by telephone to DOSH.", "finished": false}, {"number": 110, "total": 120, "type": "single", "questionId": 42786, "question": "According to State Law, what should an employer do if an employee is using defective machinery?", "choices": [{"pos": 0, "letter": "A", "text": "Correct the safety violation immediately.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "First report the safety violation to Cal/OSHA.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "First report the problem to the prime contractor or awarding authority.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Ask for a consultation with a safety engineer.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. If a tool is defective, remove it from service, and tag it clearly “Out of service for repair”. Replace damaged equipment immediately – do not use defective tools “temporarily”.", "finished": false}, {"number": 111, "total": 120, "type": "single", "questionId": 42787, "question": "If a subcontractor wants to substitute material on a job, who must approve the substitution?", "choices": [{"pos": 0, "letter": "A", "text": "building inspector", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "prime contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "owner", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "architect", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The key word is “approve.” The prime contractor cannot approve substitutions or changes. In fact, a departure from plans and specifications without the consent of the owner or his or her duly authorized representative can result in disciplinary action by the CSLB. An architect may prepare plans and specifications and oversee the construction, but changes in construction materials would be subject to the owner’s approval.", "finished": false}, {"number": 112, "total": 120, "type": "single", "questionId": 42788, "question": "Which two types of loans is a contractor most likely to engage in?", "choices": [{"pos": 0, "letter": "A", "text": "construction or permanent", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "bank or saving & loan (“S&L”)", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "government or private", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "fixed or variable", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Construction loans are typically short term with a time limit of six months to a year. Permanent loans are amortized over a period of 10 years, 15 years, or longer.", "finished": false}, {"number": 113, "total": 120, "type": "single", "questionId": 42789, "question": "There is a near-miss safety situation on a job. What steps should the employer take?", "choices": [{"pos": 0, "letter": "A", "text": "Report the near-miss to DOSH.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Report the near-miss to the workers’ compensation insurance carrier.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The unsafe situation must be investigated, and the investigation must include a written report.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The unsafe situation must be investigated, but a written report is not required.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Cal/OSHA’s definition: “Near misses describe incidences where no property was damaged and no personal injury sustained, but where, given a slight shift in time or position, damage and/or injury easily could have occurred.” Near misses are subject to an investigation that includes a written report that adequately identifies the cause of the occurrence.", "finished": false}, {"number": 114, "total": 120, "type": "single", "questionId": 42790, "question": "What is the net profit if you have $300,000 in sales, $95,000 in labor, $35,000 in miscellaneous expenses, $55,000 in materials, $25,000 in depreciation, and a $35,000 loan to the owner?", "choices": [{"pos": 0, "letter": "A", "text": "$40,000", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "$90,000", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$100,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$150,000", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Net profit is the amount left after subtracting all expenses from income (sales): $300,000 – ($95,000 + $35,000 + $55,000 + $25,000) = $300,000 – $210,000 = $90,000. The $35,000 loan to the owner would be recorded as a Note Receivable on a balance sheet.", "finished": false}, {"number": 115, "total": 120, "type": "single", "questionId": 66367, "question": "Where is truck insurance listed on an income statement?", "choices": [{"pos": 0, "letter": "A", "text": "depreciation", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "liabilities", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "operating expenses", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "owner expenses", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Truck insurance is typically included under operating expenses cover the costs required to keep a business running, and insurance for company vehicles falls into this category since it is a regular, necessary expense for operations.", "finished": false}, {"number": 116, "total": 120, "type": "single", "questionId": 42792, "question": "On a private works project, the owner failed to make a payment by the due date specified in the contract and is not disputing the work performed. Which of the following is a correct statement?", "choices": [{"pos": 0, "letter": "A", "text": "The prime contractor may serve the owner with a stop work order stating that work will stop if payment is not made within five days from the due date specified in the contract.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The prime contractor may serve the owner with a stop work order stating that work will stop if payment is not made within ten days from the date of service of the order.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The prime contractor must stop working on the date of service of a stop work order.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The prime contractor must complete the project even if the owner stops making payments.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The CIVIL CODE gives the prime/original contractor the right to serve a “10-Day Stop Work Order” if payment is not made within 35 days of the due date specified in the contract. If the payment is not made within 10 days of service of the order, the prime contractor may stop work and seek an expedited determination of liability for payment due from the local Superior Court.", "finished": false}, {"number": 117, "total": 120, "type": "single", "questionId": 42793, "question": "To which workers does prevailing wage apply?", "choices": [{"pos": 0, "letter": "A", "text": "To superintendents, project managers, and professional staff.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "To all covered personnel performing work on public works projects.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "To all licensed contractors in the State of California.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "To all covered personnel performing work on any public and private work projects.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. California state law requires that, on public works projects, pay to workers must equal: “the general prevailing rate of per diem wages for work of a similar character in the locality in which the public work is performed, and not less than the general prevailing rate.", "finished": false}, {"number": 118, "total": 120, "type": "single", "questionId": 60559, "question": "A scheduling method used for construction projects is the most effective planning tool, is the ________________.", "choices": [{"pos": 0, "letter": "A", "text": "S-curve chart", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "bar chart", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "critical path", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Timeline", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  The critical path method, helps identify the order and interdependence of events. The basic concept of the Critical Path Method (CPM) is to show the start of each given activity and it’s dependence upon the completion of proceeding activities and how it’s completion also restricts following activities.", "finished": false}, {"number": 119, "total": 120, "type": "single", "questionId": 42795, "question": "Prior to signing a contract, the contractor must thoroughly review all _______________.", "choices": [{"pos": 0, "letter": "A", "text": "plans", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "specifications", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "estimates", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "A & B", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Everything must be clearly explained and understood. All questions must be answered before signing the contract. Prior to signing the contract, payment schedules, how change orders will be handled, work hours, delivery of materials, and other concerns must be made clear.", "finished": false}, {"number": 120, "total": 120, "type": "single", "questionId": 42796, "question": "An employee works 8 hours per day Monday through Thursday, is off on Friday for a holiday, then works 8 hours on Saturday and 8 hours on Sunday. At what rate is the employee paid for working on Sunday?", "choices": [{"pos": 0, "letter": "A", "text": "the regular rate", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "2-1/2 times the regular rate", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "twice the regular rate", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1-1/2 times the regular rate", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The employee must be paid 1-1/2 times the regular rate of pay for any hours worked in excess of 8 hours in a day or 40 hours in a week. The first 8 hours worked on the 7th day of a work week are also paid at 1-1/2 times the regular rate. Overtime is calculated based on hours actually worked. A paid holiday does not count toward hours subject to overtime.", "finished": false}], "law-bus-test-3": [{"number": 1, "total": 120, "type": "single", "questionId": 68745, "question": "The California Family Rights Act (CFRA) provides eligible employees up to ____ weeks of ____ leave.", "choices": [{"pos": 0, "letter": "A", "text": "6 … paid", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "6 … unpaid", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "12 … paid", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "12 … unpaid", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. 12 … unpaid.  The California Family Rights Act (CFRA) provides eligible employees with up to 12 weeks of unpaid, job-protected leave within a 12-month period. This leave can be used for qualifying reasons such as bonding with a new child, caring for a family member with a serious health condition, or for the employee’s own serious health condition. Eligibility requires working for an employer with 5 or more employees and meeting certain length of service and hours worked criteria.", "finished": false}, {"number": 2, "total": 120, "type": "single", "questionId": 42557, "question": "When is an employee allowed to view their own personnel file?", "choices": [{"pos": 0, "letter": "A", "text": "never", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "when they have a court order", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "whenever they wish to", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "during employee evaluations", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Per Labor Code Section 1198.5 – California law requires that employers allow current and former employees access to their personnel file and records that relate to the employee’s performance or to any grievance concerning the employee.", "finished": false}, {"number": 3, "total": 120, "type": "single", "questionId": 42803, "question": "Of the following four items to consider when bidding, which is the most important?", "choices": [{"pos": 0, "letter": "A", "text": "overhead", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "labor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "materials", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "profit", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The references listed in the CSLB Study Guide consider profit as essential to the continuation of a business. Insufficient profits can create cash flow problems.", "finished": false}, {"number": 4, "total": 120, "type": "single", "questionId": 55353, "question": "Does an employer need to allow an employee to use/smoke marijuana if it is a medical prescription?", "choices": [{"pos": 0, "letter": "A", "text": "if it is 6 feet from the workplace", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "if it is in a designated area", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "never because it is prohibited by the supreme court", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "if its once a month", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  The California Supreme Court clarified that the Fair Employment and Housing Act (FEHA) does not provide protection for current marijuana use, even if it is taken for medicinal purposes.  Worker’s rights/employer regulations were affirmed by the Supreme Court and Federal case law states that an employer may dictate what happens at their workplace for the safety of all employees.", "finished": false}, {"number": 5, "total": 120, "type": "single", "questionId": 61204, "question": "In regards to workers compensation insurance, the classification and what other factors are used to set premium?", "choices": [{"pos": 0, "letter": "A", "text": "payroll history", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "number of employees", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "benefits of employees", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Workers compensation insurance premiums are determined by a classification code rate set by the Workers Compensation Insurance Rating Bureau (WCIRB) which is licensed by the California Department of Insurance.", "finished": false}, {"number": 6, "total": 120, "type": "single", "questionId": 69047, "question": "An employee was injured because the contractor had overlooked a hazardous situation. Which of the following is a correct statement regarding responsibility for the injury?", "choices": [{"pos": 0, "letter": "A", "text": "The employee is not guilty of contributory negligence because safety laws were violated by the employer.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The employee and the employer are equally guilty of negligence because the employee accepted the job knowing it was unsafe.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The employee’s labor contract would not cover damages.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Everyone is at fault: The employee should have been more careful.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  It is an employer’s duty to protect the health, safety and welfare of their employees and other people who might be affected by their business. Employers must do whatever is reasonably practicable to achieve this. … Employers have duties under health and safety law to assess risks in the workplace.", "finished": false}, {"number": 7, "total": 120, "type": "single", "questionId": 42805, "question": "What color paint is normally used to mark an excavation area?", "choices": [{"pos": 0, "letter": "A", "text": "red", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "brown", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "white", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "green", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. White is is normally used to mark an excavation area. APWA Uniform Color Codes: RED – Electric Power Lines, Cables, Conduit, and Lighting Cables. YELLOW – Gas, Oil, Steam, Petroleum, or Gaseous Material. ORANGE – Communication, Alarm or Signal Lines, Cables, or Conduit. BLUE – Potable Water. GREEN – Sewers and Drain Lines. WHITE – Proposed Excavation Limits or Route.", "finished": false}, {"number": 8, "total": 120, "type": "single", "questionId": 68296, "question": "If there is no collective bargaining agreement, which of the following is a correct statement regarding the payment of wages by an employer?", "choices": [{"pos": 0, "letter": "A", "text": "The employer may pay wages whenever the employer chooses.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The employer may pay wages at the end of the job.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The employer may pay wages at the end of the job if the employees agree.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The employer may pay wages minimum twice a month.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. In California, wages, with some exceptions, must be paid at least twice during each calendar month on the days designated in advance as regular paydays. The employer must establish a regular payday and is required to post a notice that shows the day, time and location of payment. If the employees are not covered by a collective bargaining agreement, the Labor Code allows the employer to pay wages weekly, biweekly (every two weeks), or semimonthly (twice a month).", "finished": false}, {"number": 9, "total": 120, "type": "single", "questionId": 42807, "question": "A Cal/OSHA permit is required for trenches that are _____ or more in depth.", "choices": [{"pos": 0, "letter": "A", "text": "4 feet", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "5 feet", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "6 feet", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "8 feet", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The Division will require a permit for the construction of trenches or excavations which are five (5) feet or deeper and into which a person is required to descend. For permit purposes, “descend” means to enter any part of the trench or excavation once the excavation has attained a depth of 5 feet or more.", "finished": false}, {"number": 10, "total": 120, "type": "single", "questionId": 42808, "question": "A customer wants to accept a bid but does not have enough money. A wise contract decision would be to:", "choices": [{"pos": 0, "letter": "A", "text": "eliminate the profit and take the job for overhead", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "match the lowest bid of another contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "do the job at cost", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "stick close to your bid even if it means losing the job", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  If a customer wants to accept a bid but does not have enough money. The best decision would be to stick close to your bid even if it means losing the job.\n\nA customer who does not have the financial resources to authorize work, but states they still want to have the work completed, may put a contractor at a financial disadvantage if they accept the contract.", "finished": false}, {"number": 11, "total": 120, "type": "single", "questionId": 42809, "question": "When bidding on work, which of the following would you not include in the price of your bid?", "choices": [{"pos": 0, "letter": "A", "text": "overhead", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "worker’s compensation insurance premium", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "profit", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. You would not include worker’s compensation insurance premiums because those are paid by the contractor. Workers’ compensation premiums are not figured as a separate item in a bid. However, the figure for labor should be based on an hourly rate that reflects the cost of workers’ compensation coverage, health insurance or retirement benefits, and other “hidden” labor costs.", "finished": false}, {"number": 12, "total": 120, "type": "single", "questionId": 42810, "question": "A contractor keeps change orders on file:", "choices": [{"pos": 0, "letter": "A", "text": "by CBC requirement", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "by law", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "to get paid when the job is over", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "for tax purposes", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Change Orders become part of the contract once the order is prepared in writing and signed by the parties prior to the commencement of work covered by the new change order. The order must describe the scope of the extra work or change, the cost to be added or subtracted from the contract, and the effect the order will have on the schedule of progress payments.\n\n7159.6. Work or change order.", "finished": false}, {"number": 13, "total": 120, "type": "single", "questionId": 42811, "question": "What should be done with the contractor’s copy of IRS Form W-2?", "choices": [{"pos": 0, "letter": "A", "text": "File the copy in the contractor’s office.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Give the copy to the employee.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Submit the copy with the contractor’s payroll tax return.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Destroy the copy to protect the employee’s right to privacy.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Form W-2 (Wage and Tax Statement) consists of several copies. The last copy, “Copy D For Employer,” is for the contractor’s records. It should be filed in the contractor’s office with all other payroll tax related documents.", "finished": false}, {"number": 14, "total": 120, "type": "single", "questionId": 42812, "question": "If your accumulated Personal Income Taxes (PIT) withholding is less than $350, your State disability and Income (SDI) taxes must be:", "choices": [{"pos": 0, "letter": "A", "text": "paid quarterly and reported yearly", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "reported and paid yearly", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "reported and paid quarterly", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "reported quarterly and paid yearly", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. You may need to deposit employee withholdings for State Disability Insurance (SDI) and California Personal Income Tax (PIT) more often if you withhold over $350 in PIT. Your deposit frequency is based on your federal deposit schedule and the amount of total PIT withheld.", "finished": false}, {"number": 15, "total": 120, "type": "single", "questionId": 42813, "question": "If you get a quote from a material supplier, the quote is:", "choices": [{"pos": 0, "letter": "A", "text": "not firm and can change", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "a guaranteed price that cannot increase", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "firm and includes all materials", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "firm but may not include all materials", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Our recommended answer is based on one of the references listed in the CSLB Study Guide. It states: “Suppliers will stand behind their quoted cost for every item they price, but they won’t guarantee to quote every item on your prints or materials list.” Also, a supplier will often limit the quote to a certain time period (e.g., 30 days).", "finished": false}, {"number": 16, "total": 120, "type": "single", "questionId": 42814, "question": "If you are required to report employment taxes or give tax statements, the __________ must obtain a federal Employer Identification Number.", "choices": [{"pos": 0, "letter": "A", "text": "employee and employer", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "employee", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "employer", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "bookkeeper", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. You would use IRS Form SS-4 to apply for a federal Employer Identification Number.", "finished": false}, {"number": 17, "total": 120, "type": "single", "questionId": 42816, "question": "A subcontractor signs an Unconditional Waiver and Release upon final payment. This means that the:", "choices": [{"pos": 0, "letter": "A", "text": "subcontractor can request additional payment only from the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "owner may not ask the subcontractor to correct any defects in materials or workmanship.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "subcontractor may receive additional payment only from the prime contractor.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "subcontractor has waived any lien, stop payment notice, or payment bond rights.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. An Unconditional Waiver and Release on final payment waives and releases any lien, stop payment notice, and payment bond rights that the subcontractor may have for labor, service, equipment, and materials provided. The subcontractor has acknowledged receiving final payment.", "finished": false}, {"number": 18, "total": 120, "type": "single", "questionId": 42817, "question": "Who is responsible for selecting materials when refilling a first-aid kit for a jobsite?", "choices": [{"pos": 0, "letter": "A", "text": "first-aid tech", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "doctor", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "nurse", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "RN", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The Construction Safety Orders require that the minimum first-aid supplies be determined by an employer-authorized licensed physician or comply with the table in Section 1512(c) that lists types of first-aid supplies based on the number of employees.", "finished": false}, {"number": 19, "total": 120, "type": "single", "questionId": 42818, "question": "Good accounting records are necessary for:", "choices": [{"pos": 0, "letter": "A", "text": "maintaining financial statements", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "obtaining financing", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "effective management", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. 12 Reasons to Keep Good Accounting Records 1. Enables you to manage your business and make it grow. 2. Helps to stay organised when dealing with customers and suppliers 3. Makes it easy to prepare management accounts 4. Makes it possible to find important information and documents quickly 5. Makes it easier to get a bank loan or overdraft 6. Helps you plan in advance for tax payments and other liabilities 7. Helps us to check your tax position accurately 8. Helps to reduce your accountant’s fees and save them time 9. Makes you filling your tax return easier and can save you tax 10. Avoids interest and penalties by making it easier to pay the right tax at the right time 11. Will support your claims to some tax reliefs or capital allowances 12. Record keeping complies with the law", "finished": false}, {"number": 20, "total": 120, "type": "single", "questionId": 42819, "question": "How long must an employer keep records of FUTA and other federal payroll taxes?", "choices": [{"pos": 0, "letter": "A", "text": "2 years", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "4 years", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "6 years", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10 years", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. All records of employment taxes must be kept for a minimum of 4 years. This requirement is not limited to payroll tax returns. An employer may be asked to produce the names, addresses, social security numbers, dates of employment, and work classification of every person employed. The IRS may also request verification of the dates and amounts of tax deposits.", "finished": false}, {"number": 21, "total": 120, "type": "single", "questionId": 42820, "question": "Which state agency issues an employer’s ID number?", "choices": [{"pos": 0, "letter": "A", "text": "Board of Equalization", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Secretary of State", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Employment Development Department", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Franchise Tax Board", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C.  The Employment Development Department (EDD) is the only State agency that issues a State Employer Identification Number (SEIN), often referred to as an employer payroll tax\n\naccount number. This is different from the Federal Employer Identification Number (FEIN or EIN) issued by the IRS.\n\nThe question asks which state agency. The Internal Revenue Service (IRS) is a Federal Agency.", "finished": false}, {"number": 22, "total": 120, "type": "single", "questionId": 42821, "question": "If an employee quits without prior notice, the contractor must pay wages:", "choices": [{"pos": 0, "letter": "A", "text": "immediately", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "immediately, but 3 days’ wages may be deducted", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "in part, with the balance due within the month", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "in full, within 3 days of quitting", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Under California employment law, departing employees are entitled to receive their final paycheck almost immediately. Employees who quit must receive their final paycheck within 72 hours of giving notice that they’re leaving. Employees who are fired must be paid on the same day as termination.", "finished": false}, {"number": 23, "total": 120, "type": "single", "questionId": 42822, "question": "A contractor is offering a job that will last at least six months but could continue longer. What should the contractor tell people when interviewing for the job?", "choices": [{"pos": 0, "letter": "A", "text": "The job is temporary.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The job is permanent.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The job is temporary and may become permanent.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The job is part-time.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Employer’s Legal Handbook states: “During the hiring process, don’t give assurances that you may not be able to honor and that may give the applicant a false sense of security.”", "finished": false}, {"number": 24, "total": 120, "type": "single", "questionId": 42823, "question": "Worker’s compensation insurance covers injuries or illnesses:", "choices": [{"pos": 0, "letter": "A", "text": "in all cases", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "in the event of theft", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "that are job-related", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "that occur while on any job", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California workers’ compensation laws require no-fault insurance coverage. The illnesses or injuries must be job-related. However, a worker need not be present at the job site when an injury occurs. For example, a foreman who is injured while driving to a building supply house to pick up materials for a job would be covered by the employer’s workers’ compensation policy.", "finished": false}, {"number": 25, "total": 120, "type": "single", "questionId": 60061, "question": "Contractors do not have to be licensed if:", "choices": [{"pos": 0, "letter": "A", "text": "all of their jobs are under $1,500.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "they carry commercial general liability insurance.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the value of labor and materials for a job is $1,000 or less", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all potential customers are told that they are not licensed.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C.  Contracts where the combined value of labor, materials, and all other items is $1,000 or less fall under the “minor work” exemption.  Starting January 1, 2025, Assembly Bill 2622 increases the minor work license exemption from $500 to $1,000, but there is a catch: the work cannot require a permit, and the unlicensed person cannot employ anyone for the project. In other words, if the minor work is subject to a permit requirement of any kind, or if the unlicensed person hires one or more workers to assist or perform the work, a license is required – even if the project is less than $1,000", "finished": false}, {"number": 26, "total": 120, "type": "single", "questionId": 42825, "question": "A contract for the construction of a single-family dwelling must be signed by:", "choices": [{"pos": 0, "letter": "A", "text": "just the contractor", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "just the owner", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the owner and contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the architect, owner, and contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. (a) Notwithstanding Section 7044 , every contract and any changes in a contract, between an owner and a contractor, for the construction of a single-family dwelling to be retained by the owner for at least one year shall be evidenced in writing signed by both parties.", "finished": false}, {"number": 27, "total": 120, "type": "single", "questionId": 42826, "question": "When would an employee be required to complete a new IRS Form W-4?", "choices": [{"pos": 0, "letter": "A", "text": "after a change in marital status", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "after a change in address and phone number", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "only if fewer than 10 exemptions are claimed", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "after a change in age", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Answer A. would be the only reason (out of the answer choices) to have to complete a new W-4 form.", "finished": false}, {"number": 28, "total": 120, "type": "single", "questionId": 42827, "question": "Which of the following bonds guarantees both job completion and payment of subcontractors and suppliers?", "choices": [{"pos": 0, "letter": "A", "text": "payment bond", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "bid bond", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "performance bond", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "contract bond", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A contract bond is a guarantee the terms of a contract are fulfilled. If the contracted party fails to fulfill its duties according to the agreed upon terms, the contract “owner” can claim against the bond to recover financial losses or a stated default provision.", "finished": false}, {"number": 29, "total": 120, "type": "single", "questionId": 42828, "question": "If you work on a ____________ works job, you may be allowed to file both a mechanics lien and stop payment notice.", "choices": [{"pos": 0, "letter": "A", "text": "public", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "commercial", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "private", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "public, commercial, private", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  Contractors, subcontractors, laborers, and material suppliers can file what is called a “mechanics lien” on a homeowner’s property if they don’t get paid. Property owners need to be aware of the process so they can avoid financial and legal pitfalls.\n\nIn legal terms, there is only public works and private.  Commercial is a description of any designated area whose main purpose is non residential.", "finished": false}, {"number": 30, "total": 120, "type": "single", "questionId": 42829, "question": "In your construction business, the secretary handles the accounts receivable. These would include:", "choices": [{"pos": 0, "letter": "A", "text": "labor received and payments due", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "material suppliers paid and services due", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "labor paid and services rendered", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "services rendered and payments due", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Accounts receivable is the balance of money due to a firm for goods or services delivered or used but not yet paid for by customers….Accounts receivable refers to the outstanding invoices a company has or the money clients owe the company. An account receivable clerk ensures organizations receive payment for services offered or goods sold to clients. This typically involves sending bill reminders and statements to clients, posting financial transaction to an accounting system and making bank deposits.", "finished": false}, {"number": 31, "total": 120, "type": "single", "questionId": 42830, "question": "Who is best qualified to submit plans and specifications?", "choices": [{"pos": 0, "letter": "A", "text": "architect", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "engineer", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "builder", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "owner", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. It is the architect’s responsibility to represent the work in sufficient detail on the plans and to describe it in sufficient detail in the specifications.", "finished": false}, {"number": 32, "total": 120, "type": "single", "questionId": 42831, "question": "Who is best prepared to submit a financial statement to a bank to obtain a loan?", "choices": [{"pos": 0, "letter": "A", "text": "owner", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "accountant", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "bookkeeper", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Accountants are best qualified to prepare and submit financial statements. Only certified public accountants can prepare audited financial statements.", "finished": false}, {"number": 33, "total": 120, "type": "single", "questionId": 55595, "question": "Which of the following costs is the easiest for the contractor to control?", "choices": [{"pos": 0, "letter": "A", "text": "subcontract labor", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "employees who are paid hourly", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "indirect labor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "direct labor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  When putting together a bid, you should get a firm price from each subcontractor.  This eliminates subcontract labor as a variable cost.  This is a cost accounting question and not an expenditure forecast question.", "finished": false}, {"number": 34, "total": 120, "type": "single", "questionId": 42833, "question": "Which of the following improvements does not require a building permit?", "choices": [{"pos": 0, "letter": "A", "text": "room addition", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "roof", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "in-ground swimming pool", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "painting and wallpaper hanging", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Painting and wallpapering do not require a building permit.", "finished": false}, {"number": 35, "total": 120, "type": "single", "questionId": 42834, "question": "To which state agency does the employer send unemployment insurance taxes?", "choices": [{"pos": 0, "letter": "A", "text": "IRS", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "EDD", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Board of Equalization", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Franchise Tax Board", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. If your small business has employees working in California, you’ll need to pay California unemployment insurance (UI) tax. The UI tax funds unemployment compensation programs for eligible employees. In California, state UI tax is just one of several taxes that employers must pay.", "finished": false}, {"number": 36, "total": 120, "type": "single", "questionId": 42835, "question": "Which two types of loans would a contractor most likely see?", "choices": [{"pos": 0, "letter": "A", "text": "construction or permanent", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "bank or savings & loan (“S&L”)", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "government or private", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "fixed or variable", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. According to one of the references in the CSLB Study Guide, except for small jobs, financing for construction projects is usually in the form of construction and permanent loans from banks. S&L’s rarely offer construction loans.", "finished": false}, {"number": 37, "total": 120, "type": "single", "questionId": 42836, "question": "Where would a contractor obtain a surety bond?", "choices": [{"pos": 0, "letter": "A", "text": "bank", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "credit union", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "insurance agent", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Contractors’ State License Board", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The bond must be written by a surety company licensed through the California Department of Insurance.", "finished": false}, {"number": 38, "total": 120, "type": "single", "questionId": 42837, "question": "Patent defects are:", "choices": [{"pos": 0, "letter": "A", "text": "readily observable flaws or faults.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "hidden.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the lender’s responsibility.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the owner’s responsibility", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A common test to determine if a construction defect is patent is to ask “whether the average consumer during the course of a reasonable inspection would discover the defect.”", "finished": false}, {"number": 39, "total": 120, "type": "single", "questionId": 42838, "question": "If an employee violates a safety rule and because of that another employee is injured, who is responsible?", "choices": [{"pos": 0, "letter": "A", "text": "The employee who violated the safety rule.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The employee who violated the safety rule and the employer are both responsible.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The employer is responsible.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Under the doctrine of RESPONDEAT SUPERIOR (Latin: let the superior of the principal answer), the employer is legally responsible for the actions of employees when they are doing their job or acting on the employer’s behalf.", "finished": false}, {"number": 40, "total": 120, "type": "single", "questionId": 42839, "question": "The following clause is included in a contract: “THE CONTRACTOR IS NOT RESPONSIBLE FOR DELAYS CAUSED BY WEATHER, EARTHQUAKES, FLOODS, OR OTHER ACTS OF GOD.” This clause would limit the contractor’s liability for delays caused by:", "choices": [{"pos": 0, "letter": "A", "text": "suppliers not delivering materials on time", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "a labor strike", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "heavy rains", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "lack of working capital", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Heavy rains is the only answer choice offered here that is caused by nature/weather (aka Acts of God).", "finished": false}, {"number": 41, "total": 120, "type": "single", "questionId": 42840, "question": "From where do you obtain permits for working in a hazardous area?", "choices": [{"pos": 0, "letter": "A", "text": "Cal/OSHA", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Contractors’ State License Board", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "City Planning Commission", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Fed/OSHA", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A number of OSHA health and safety regulations require some type of formal documentation, often in the form of a work permit. A “permit” under OSHA rules is a bit different than permits under US EPA or US DOT hazardous materials regulations. These other agencies issue permits to businesses to allow the businesses to perform certain activities, like discharging pollutants or transporting certain explosives. An OSHA “permit” is an employer-created and signed document that details the safeguards in place to protect an employee who’s been assigned a particularly dangerous job function like working in a confined space, welding and cutting, or working on “live” electrical equipment. While the 29 CFR OSHA safety standards don’t provide employers with a standard form or template to use to create a work permit, they do include “samples” that show what OSHA expects in the permits for different regulated activities.", "finished": false}, {"number": 42, "total": 120, "type": "single", "questionId": 42841, "question": "Which of the following best describes the difference between “claims-made” and “occurrence” types of liability insurance?", "choices": [{"pos": 0, "letter": "A", "text": "Unlike occurrence insurance, a claims-made policy covers claims made after the policy expires.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "An occurrence policy is intended to cover a particular one-time accident.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "A claims-made policy is intended to cover a particular one-time accident.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Unlike claims-made coverage, occurrence insurance covers claims made after the policy expires.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Occurrence-Made Policies • Liability insurance is traditionally written in occurrence-made form. This means that as long as the incident occurred when the policy was in force, the insurer will still handle the resulting claim, even if the policy is no longer in force when the claim is filed. Automobile and most commercial liability policies are still written this way, as of April 2011. However, occurrence-made policies leave insurers vulnerable to long-term exposure, forcing them to handle expensive malpractice claims even if the policy in question expired a decade before the claim arose. Claims-Made Policies • The insurance industry’s answer to the problem of long-term malpractice exposure was the claims-made policy form. This limits insurers’ exposure by requiring that a malpractice incident and the resulting claim both occur while the insurance policy is active. This means that if you make a bad professional judgment in May, switch insurers in August and get sued in December for the May incident, your initial insurer won’t cover the claim. Your new insurer won’t, either, because the incident occurred before your new policy was effective. Claims-made policies limit clients’ ability to switch insurers because it exposes them to uncovered liability claims.", "finished": false}, {"number": 43, "total": 120, "type": "single", "questionId": 42842, "question": "The most important thing to include when advertising for construction work is:", "choices": [{"pos": 0, "letter": "A", "text": "the company’s complete name style", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "a list of all the owners of the company", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the contractor’s license number", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the company’s address", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The Contractors License Law requires that the company’s license number appear in all forms of advertising. The CSLB’s Rules and Regulations define advertising as “any card, contract, proposal, sign, billboard, lettering on vehicles, registered in this or any other state, brochure, pamphlet, circular, newspaper, airwave transmission and any form of directory under any listing denoting ‘Contractor’ or any word or words of similar import or meaning requesting any work for which a license is required by the Contractors License Law.”", "finished": false}, {"number": 44, "total": 120, "type": "single", "questionId": 42843, "question": "When should safety clothing be worn on a job site?", "choices": [{"pos": 0, "letter": "A", "text": "when pouring concrete", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "when operating machinery", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "when you arrive at the job site", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Safety clothing be worn at all times while on the job site.", "finished": false}, {"number": 45, "total": 120, "type": "single", "questionId": 42844, "question": "If a contractor is doing asbestos-related work that involves 100 square feet or more, _____ must be notified.", "choices": [{"pos": 0, "letter": "A", "text": "DOSH", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "EPA", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Fed/OSHA", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Registrar of Contractors", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. For any work that involves 100 square feet or more surface area of asbestos-containing construction material a contractor must be asbestos certified or licensed and also registered with Cal/OSHA (DOSH). This means that contractors must pass either an Asbestos Certification examination or a C-22 Asbestos Abatement Licensure examination administered by CSLB.", "finished": false}, {"number": 46, "total": 120, "type": "single", "questionId": 42845, "question": "Which of the following is most important regarding safety at a job site?", "choices": [{"pos": 0, "letter": "A", "text": "The contractor should show the workers how to use safety equipment.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The contractor should require the workers to use safety equipment.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor should inspect the safety equipment every day.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The contractor should properly store safety equipment when not in use.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. All of the choices given are important, but “B” is critical. Not all workers will use safety equipment unless it is required.", "finished": false}, {"number": 47, "total": 120, "type": "single", "questionId": 42846, "question": "According to State law, what should an employer do if he or she notices an employee using defective machinery?", "choices": [{"pos": 0, "letter": "A", "text": "Correct the problem immediately.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Report the problem to Cal/OSHA.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Report the problem to the prime contractor.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Ask for a consultation with a safety engineer.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Employees should never be allowed to use faulty equipment/machinery. Improper maintenance and repair can lead to malfunctions that endanger workers, as can defective machinery. When faulty equipment causes injuries, worker’s compensation may not be enough to cover your losses.", "finished": false}, {"number": 48, "total": 120, "type": "single", "questionId": 42847, "question": "The typical retention, especially on public works or large jobs where an architect is involved, would be:", "choices": [{"pos": 0, "letter": "A", "text": "5% of the total job price", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10% of the first draw", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "10% of the total job price", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "25% of the total job price", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Public works law changed Jan 2012. 5% is correct however not they can hold more then that under unusual circumstances. New Law Limits Public Works Contract Retention to 5 Percent as of January 1, 2012. If that is not one of the choices you should challenge the question when taking the exam.", "finished": false}, {"number": 49, "total": 120, "type": "single", "questionId": 42848, "question": "What should you do if a client is unhappy with your work?", "choices": [{"pos": 0, "letter": "A", "text": "Keep working and leave the client alone to cool off.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Continue working and worry about the client at the end of the job.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Ignore the client until after all work is done.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Handle the problem in a timely manner when it comes up.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. If your client is unhappy with your work you need to handle the problem as soon as possible.", "finished": false}, {"number": 50, "total": 120, "type": "single", "questionId": 42849, "question": "An owner objects to the materials being used for a job and complains to a worker. Upon learning of the complaint, the contractor should:", "choices": [{"pos": 0, "letter": "A", "text": "write a letter to the owner as soon as possible", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "ignore the complaint", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contact the owner immediately and explain why the specific materials are being used", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "order the crew to stop work immediately until an on-site meeting can be scheduled with the owner", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. If an owner is unhappy with materials being used on a job, work should immediately stop until the contractor has on on-site meeting with the owner to discuss how to fix the issue.", "finished": false}, {"number": 51, "total": 120, "type": "single", "questionId": 42850, "question": "Which of the following is not eligible to receive benefits from a contractor’s license bond?", "choices": [{"pos": 0, "letter": "A", "text": "A customer who was defrauded by the contractor.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A subcontractor involved in an accident on the job site.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "An employee who was not paid wages that were due.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A homeowner with a valid claim that the contractor abandoned the job.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A contractor’s license bond is filed for the benefit of consumers who may be damaged because of defective construction or other violations of contractors’ state license law, and for employees who have not been paid wages they are owed. The Contractors License Law states: “The contractor’s bond shall be for the benefit of the following: (a) Any homeowner contracting for home improvement upon the personal family residence damaged as a result of a violation of this chapter by the licensee … (b) Any employee of the licensee damaged by the licensee’s failure to pay wages.”\\", "finished": false}, {"number": 52, "total": 120, "type": "single", "questionId": 42851, "question": "What is the best way to establish if a contractor’s license is active and in good standing?", "choices": [{"pos": 0, "letter": "A", "text": "Ask the contractor if he is licensed.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Look at the contractor’s pocket license.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Ask to see the contractor’s license bond.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Check with the CSLB.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The best way to confirm that a contractor is duly licensed is by checking with CSLB. Anyone can verify that the license is active and in good standing at www.cslb.ca.gov.", "finished": false}, {"number": 53, "total": 120, "type": "single", "questionId": 42852, "question": "Of the following, which would not be required in a written home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "name, address, and license number of the contractor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "name of the project", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the approximate dates when work will begin and be substantially completed", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "a description of the work to be done", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The name, address, and license number of the contractor, the approximate dates when work will begin and be substantially completed, and a description of the work to be done are all required in a home improvement contract. The name of the project is not required.", "finished": false}, {"number": 54, "total": 120, "type": "single", "questionId": 42853, "question": "If a contractor changes a business name or address or has any changes in the personnel listed on the license, the Registrar must be notified within:", "choices": [{"pos": 0, "letter": "A", "text": "10 days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "45 days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "60 days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "90 days", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. If your business name or address changes, you must report the change(s) within 90 days of the change (Business and Professions Code section 7083).\n\n7083.\n(a) Notwithstanding any other law, licensees shall notify the registrar, on a form prescribed by the registrar, in writing within 90 days of any change to information recorded under this chapter. This notification requirement shall include, but not be limited to, changes in business address, personnel, business name, qualifying individual bond exemption pursuant to Section 7071.9, or exemption to qualify multiple licenses pursuant to Section 7068.1.\n\n“Personnel” means the Affiliates, officers, directors, employees, agents, contractors, consultants, vendors, invitees and representatives of a party to the Agreement and of the party’s Affiliates.", "finished": false}, {"number": 55, "total": 120, "type": "single", "questionId": 42854, "question": "What is the most common reason that a license is suspended?", "choices": [{"pos": 0, "letter": "A", "text": "one serious accident", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "two serious accidents", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a lapse of the contractor’s bond", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "employee complaints", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Violating bond requirements is one of the fastest routes to a license suspension.", "finished": false}, {"number": 56, "total": 120, "type": "single", "questionId": 42855, "question": "How deep must asbestos be buried within 24 hours of delivery at a disposal site?", "choices": [{"pos": 0, "letter": "A", "text": "6 inches", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10 inches", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "12 inches", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "18 inches", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. There must be no visible emissions from active asbestos-containing waste disposal sites. If there are emissions, one of the following methods must be used, or an alternative method approved by EPA: At the end of each operating day, or once in a 24 hour period, the waste material is covered with either at least 15 cm (6 in.) of compacted nonasbestos-containing material A resinous or petroleum based dust suppression agent is applied, waste crank case oil is not suitable for this purpose.", "finished": false}, {"number": 57, "total": 120, "type": "single", "questionId": 42856, "question": "On a job application, John states he has experience soldering pipe. What is the best way to determine his soldering ability?", "choices": [{"pos": 0, "letter": "A", "text": "Rely on the job application.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Talk to his last employer.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Watch John solder pipe.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Review photographs of John’s last soldering job.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The best way to judge an applicant’s ability is to have them perform the task for you.", "finished": false}, {"number": 58, "total": 120, "type": "single", "questionId": 73587, "question": "Of the following, which is a correct statement regarding a schedule of payments in an original bid?", "choices": [{"pos": 0, "letter": "A", "text": "The schedule must include specific dates and dollar amounts.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The second payment is not due until after 60% of the work is completed.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The material must be paid for as it is installed.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "You are not required to include a schedule of payments in the original bid.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. An original bid is the contractor’s first formal price proposal, the baseline number that anchors all later negotiations, revisions, and contract decisions. You are not required to include a schedule of payments in the original bid. Schedule of Payments – A home improvement contract must include a payment schedule. It should show the amount of each payment and explain what work, materials or services are to be performed for that particular payment. Payments to the contractor cannot exceed the value of the performed work. An original bid is the contractor’s first formal price proposal, the baseline number that anchors all later negotiations, revisions, and contract decisions.", "finished": false}, {"number": 59, "total": 120, "type": "single", "questionId": 42858, "question": "What can be flexibly interpreted when the following statement is in a contract? “THE CONTRACTOR IS NOT RESPONSIBLE FOR DELAYS CAUSED BY NATURAL DISASTERS OR ACTS OF GOD.”", "choices": [{"pos": 0, "letter": "A", "text": "joint control", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "payment schedule", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the dates for starting and finishing work", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "change orders", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. In legal usage throughout the English-speaking world, an act of God[1] is a natural hazard outside human control, such as an earthquake or tsunami, for which no person can be held responsible. An act of God may amount to an exception to liability in contracts. In the law of contracts, an act of God may be interpreted as an implied defense under the rule of impossibility or impracticability. If so, the promise is discharged because of unforeseen occurrences, which were unavoidable and would result in insurmountable delay, expense, or other material breach.", "finished": false}, {"number": 60, "total": 120, "type": "single", "questionId": 42859, "question": "A health and safety order must be:", "choices": [{"pos": 0, "letter": "A", "text": "handed out by supervisors at their quarterly meetings", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "handed out with monthly pay checks", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "posted in a conspicuous place at the j
