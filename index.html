lected": false}, {"pos": 1, "letter": "B", "text": "one-year license suspension", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "fine and license suspension for up to one year", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "suspension of license for five days or more", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The maximum penalty would be licensed revocation. The minimum penalty would be revocation, stayed, with two years probation. Other possible penalties might include a five-day suspension and reimbursement of CSLB investigation and enforcement costs. A license may also be required to take the CSLB license law and business exam again unless it was taken within the last five years.", "finished": false}, {"number": 96, "total": 120, "type": "single", "questionId": 43020, "question": "When preparing a cost estimate, which of the following could NOT be determined without visiting the site?", "choices": [{"pos": 0, "letter": "A", "text": "location of the electrical source", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "measurements of the walls and ceiling", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "what materials are needed", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "which subcontractors to use for the job", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A site visit would allow the contractor to determine availability of electrical and water sources, soil type, vehicle access, and other details that are not covered in the plans and specifications.", "finished": false}, {"number": 97, "total": 120, "type": "single", "questionId": 43021, "question": "If a contractor includes a provision for private arbitration in a printed contract, it must be set out in at least:", "choices": [{"pos": 0, "letter": "A", "text": "8-point roman boldface type or in contrasting red print in at least 8-point boldface type.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "8-point roman boldface type in black print.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10-point italic boldface type in red print.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10-point roman boldface type or in contrasting red print in at least 8-point boldface type.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The CONTRACTORS LICENSE LAW states: “If the provision for arbitration is included in a printed contract, it shall be set out in at least 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type.” In the case of a typed contract, it must be typed in capital letters.", "finished": false}, {"number": 98, "total": 120, "type": "single", "questionId": 43022, "question": "According to the federal TRUTH in LENDING ACT, when there is a third-party lender the home improvement contract is unenforceable against the buyer if the:", "choices": [{"pos": 0, "letter": "A", "text": "buyer rescinds the loan within 3 business days.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "funding is provided by a government loan or grant.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "home improvement contract is sold by a salesperson.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "owner decides that a competing contractor will finish the remaining work for less than the amount stated in the contract.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The federal Truth in Lending Act allows buyers to cancel/rescind the loan within three business days if the home improvements are to be financed and involve a security interest in the buyer’s home. California laws offer additional protections to the buyer.", "finished": false}, {"number": 99, "total": 120, "type": "single", "questionId": 43023, "question": "A contractor must pay a dump truck carrier for all transportation charges:", "choices": [{"pos": 0, "letter": "A", "text": "immediately.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "by the 20th day following the last day of the month in which the transportation was performed, if the charges, including all necessary documentation, are submitted by the fifth day following the last day of the calendar month.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "within 30 days following the last day of the month in which the transportation was performed.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "within 10 days after the transportation was performed.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. by the 20th day following the last day of the month in which the transportation was performed, if the charges, including all necessary documentation, are submitted by the fifth day following the last day of the calendar month.\n\nPayment of transportation charges of motor carrier in dump truck equipment by broker of construction transportation services (a) (1) A broker of construction trucking services shall pay all transportation charges submitted by a motor carrier of property in dump truck equipment by the 25th day following the last day of the month in which the transportation was performed.", "finished": false}, {"number": 100, "total": 120, "type": "single", "questionId": 43024, "question": "A completion date for a home improvement contract is enforceable only when it is written:", "choices": [{"pos": 0, "letter": "A", "text": "regardless of labor availability.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "regardless of material availability.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "and is reasonable to all parties to the contract.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "without regard for conditions that might prevail.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A completion date may be approximate and based on an estimate to allow for external factors such as delays due to weather or availability of materials, and it must be reasonable to the parties to the contract.", "finished": false}, {"number": 101, "total": 120, "type": "single", "questionId": 43025, "question": "Prior to signing a home improvement contract, the homeowner must be informed of the:", "choices": [{"pos": 0, "letter": "A", "text": "contractor’s references.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "number of subcontractors on the job.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor’s name, address, and license number.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "amount of money the contractor has allowed for overhead.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Home improvement contracts must include the contractor’s license number and the name and address to which a Notice of Cancellation is to be mailed.", "finished": false}, {"number": 102, "total": 120, "type": "single", "questionId": 43026, "question": "A general contractor who is doing asbestos-related work that involves 100 square feet or more must register with:", "choices": [{"pos": 0, "letter": "A", "text": "DOSH.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "EPA.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Fed/OSHA.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Registrar of Contractors.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Labor Code requires any employer or contractor who engages in asbestos-related work involving 100 square feet of surface area to register with the Division of Occupational Safety (DOSH). Contractors who are performing the work must also be certified b the CSLB. An asbestos certification will not be issued unless the contractor is registered with DOSH.", "finished": false}, {"number": 103, "total": 120, "type": "single", "questionId": 43028, "question": "A contractor who discovers an error after submitting a bid on a public works project should:", "choices": [{"pos": 0, "letter": "A", "text": "do any work not covered in the bid and bill on a time-and-material basis.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "request that the public entity execute a change order after the bid is accepted.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "give the public entity written notice that the bid is withdrawn within ten working days after opening of the bids.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "give the public entity written notice of the mistake within five working days after opening of the bids.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The Public Contract Code requires that the written notice include sufficient facts for the public entity to determine that the error was material and permitted (e.g., a clerical error in filling out the bid). The contractor may file a lawsuit if the public entity refuses to consent to withdrawal of the bid and the bid bond is forfeited.", "finished": false}, {"number": 104, "total": 120, "type": "single", "questionId": 43029, "question": "What information must be included in a Stop Notice?", "choices": [{"pos": 0, "letter": "A", "text": "the kind of labor, services, equipment, or materials furnished or agreed to be furnished.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the construction loan terms, interest rate, and deadline for project completion.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the type of zoning, setback, and lot coverage limitations on the permit.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the type of asbestos, toxic fumes, or hazardous materials found.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. This question is referring to a stop payment notice. A stop payment notice is a written notice to a property owner, lender of funds, or public agency that the person filing the notice has performed work for, or has supplied materials to, the direct contractor on a private or public project but has not been paid. The stop payment notice includes a demand that the recipient set money aside to pay the claimant’s unpaid bills for goods and/or services. The notice must include a description of the work or materials provided and an estimate of the total value.", "finished": false}, {"number": 105, "total": 120, "type": "single", "questionId": 43030, "question": "The costs of running your business, including office expenses, etc. is called:", "choices": [{"pos": 0, "letter": "A", "text": "direct costs.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "overhead.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a liability.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "accrual method.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Overhead refers to the ongoing business expenses not directly attributed to creating a product or service. It is important for budgeting purposes but also for determining how much a company must charge for its products or services to make a profit. In short, overhead is any expense that supports the making or selling of a product or service. Examples of overhead are: Accounting and legal expenses Administrative salaries Depreciation Insurance Licenses and government fees Property taxes Rent Utilities", "finished": false}, {"number": 106, "total": 120, "type": "single", "questionId": 43031, "question": "Which of the following is an asset on a Balance Sheet?", "choices": [{"pos": 0, "letter": "A", "text": "income.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Accounts Receivable.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Accounts Payable.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "equity.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Examples of assets that are likely to be listed on a company’s balance sheet include: cash, temporary investments, accounts receivable, inventory, prepaid expenses, long-term investments, land, buildings, machines, equipment, furniture, fixtures, vehicles", "finished": false}, {"number": 107, "total": 120, "type": "single", "questionId": 43032, "question": "Direct costs consist of:", "choices": [{"pos": 0, "letter": "A", "text": "direct labor, direct labor burden, direct materials and other direct costs.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "profit.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "assets and liabilities.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "labor and labor burden.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A direct cost is a price that can be directly tied to the production of specific goods or services. A direct cost can be traced to the cost object, which can be a service, product, or department. Direct costs examples include direct labor and direct materials", "finished": false}, {"number": 108, "total": 120, "type": "single", "questionId": 43033, "question": "Direct labor burden is comprised of:", "choices": [{"pos": 0, "letter": "A", "text": "cost of payroll taxes, insurance and benefits.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "cost for labor and payroll taxes.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "expenses charged to overhead.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "payroll expenses.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Labor burden is the actual cost of a company to have an employee, aside from the salary the employee earns. Labor burden costs include benefits that a company must, or chooses to, pay for employees included on their payroll. These costs include but are not limited to payroll taxes, pension costs, health insurance, dental insurance, and any other benefits that a company provides an employee.", "finished": false}, {"number": 109, "total": 120, "type": "single", "questionId": 43034, "question": "Good cash flow is achieved when:", "choices": [{"pos": 0, "letter": "A", "text": "current assets equal current liabilities.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "total liabilities are less than total assets.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "current liabilities are less than current assets.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "total income equals total expenses.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Cash flow positive (Good cash flow) means that you have more money going into your business at any given time than you do coming out. Current liabilities are debts that will mature either in the current period or the next 12 months, whichever is sooner. This means that the company will have to come up with this amount of cash in the next year in order to pay back its creditors. Current assets, on the other hand, represent the amount of cash and assets that will likely be converted into cash in the next 12 months. Thus, this includes cash, short-term investments, inventory, and accounts receivable. It’s basically anything that can be sold or traded for cash in the next year.", "finished": false}, {"number": 110, "total": 120, "type": "single", "questionId": 43035, "question": "Equity is:", "choices": [{"pos": 0, "letter": "A", "text": "liabilities plus net worth.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "current assets plus fixed assets.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "fixed assets less current assets.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "total assets less total liabilities.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. In accounting, equity is the difference between the value of the assets and the value of the liabilities of something owned. It is governed by the following equation: For example, if someone owns a car worth $15,000, but owes $5,000 on a loan against that car, the car represents $10,000 of equity.", "finished": false}, {"number": 111, "total": 120, "type": "single", "questionId": 43036, "question": "Unless the project costs are under _______ dollars total. Prevailing wage IN CALIFORNIA must be paid for public works.", "choices": [{"pos": 0, "letter": "A", "text": "1,000", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1,500", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "2,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "500", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Prevailing wages must be paid to all workers employed on a public works project when the public works project is more than $1,000 IN CALIFORNIA. The Davis-Bacon Act applies to contractors and subcontractors performing work on federally funded or assisted contracts in excess of $2,000. However, some states have their own prevailing wage rules. They are often referred to as “Little Davis-Bacon laws.” Some states use the federal guidelines for setting their prevailing wages. Others do not. For example, California’s prevailing wage is $1000. ~", "finished": false}, {"number": 112, "total": 120, "type": "single", "questionId": 43037, "question": "A private contract is still subject to prevailing wage when the following situation applies: When more than _____% assignable square footage is leased by a public entity.", "choices": [{"pos": 0, "letter": "A", "text": "75", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "25", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "50", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "60", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. From the WECA Blueprint to California’s Prevailing Wage Contractor’s Guide. A private contract is still subject to prevailing wage when one of the following situations applies: More than 50% assignable square footage is leased by a public entity.", "finished": false}, {"number": 113, "total": 120, "type": "single", "questionId": 43038, "question": "When in doubt about if you should be paying prevailing wage, ask the _____________________.", "choices": [{"pos": 0, "letter": "A", "text": "Contractors State License Board", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Building Code Offical", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "California Department of Industrial Relations (DIR)", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Occupational Safety and Health Administration (OSHA)", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California Department of Industrial Relations (DIR)", "finished": false}, {"number": 114, "total": 120, "type": "single", "questionId": 43039, "question": "Can private contracts also simply decide to require prevailing wage at their discretion, even if the state does not require they do so?", "choices": [{"pos": 0, "letter": "A", "text": "Yes, private contracts can require prevailing wages.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "No, private contracts cannot require prevailing wages.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Only under rare situations will the State of Califorina allow private contracts to require prevailing wages.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It is illegal for private contracts to require prevailing wage.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Yes, private contracts can require prevailing wages.", "finished": false}, {"number": 115, "total": 120, "type": "single", "questionId": 43040, "question": "All contractors working on a public works project MUST be registered with", "choices": [{"pos": 0, "letter": "A", "text": "County Recorder’s Office", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Department of Consumer Affairs", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Bureau of Security and Investigative Services", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Department of Industrial Relations", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Department of Industrial Relations (DIR)", "finished": false}, {"number": 116, "total": 120, "type": "single", "questionId": 43041, "question": "An individual who meets certain conditions may serve as the qualifier for up to _____ firms in any one-year period.", "choices": [{"pos": 0, "letter": "A", "text": "one", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "two", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "three", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "four", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. In general, a person may serve as the qualifying individual for up to three firms in any oneyear period given certain conditions, such as they own 20 percent of the equity of each firm.", "finished": false}, {"number": 117, "total": 120, "type": "single", "questionId": 43042, "question": "_________ are changes to contract document made during the bidding process period.", "choices": [{"pos": 0, "letter": "A", "text": "Alternatives", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Addenda", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Allowances", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Modifications revisions or additional clarifications for any reason, added to the contract during the bidding period, after the drawings are issued, are addenda. They can only be in writing, and become part of the contract document.", "finished": false}, {"number": 118, "total": 120, "type": "single", "questionId": 43043, "question": "A _____________ is made ready to be issued, for certain items not ready for inclusion in the contract.", "choices": [{"pos": 0, "letter": "A", "text": "cash alternative", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "provision", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "cash allowance", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. As an alternative to leaving the contract item or estimated price out, a fixed lump sum allowance, or unit price, is to be included in contract documents, ready to be issued, for the purchase, delivery and installation of items not yet finalized and not yet ready for inclusion in the contract.", "finished": false}, {"number": 119, "total": 120, "type": "single", "questionId": 43044, "question": "What is the name of the form that notifies people that there is a pending lawsuit?", "choices": [{"pos": 0, "letter": "A", "text": "Lien Foreclosure Action", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Claim of Lien", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Lis Pendens", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Mechanics Lien", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Lis Pendens is a notice that a lawsuit is pending and that the lawsuit affects real property. It warns everyone who might acquire the property that he or she may be bound by an adverse judgement", "finished": false}, {"number": 120, "total": 120, "type": "single", "questionId": 43045, "question": "Within how many days must an “agreement to arbitrate” be returned by the participants after being mailed by CSLB’s Registrar?", "choices": [{"pos": 0, "letter": "A", "text": "Within 7 calendar days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Within 10 calendar days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Within 14 calendar days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Within 30 calendar days", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. An “agreement to arbitrate” must be returned by the participants after being mailed by CSLB’s Registrar within 30 calendar days.", "finished": false}], "law-bus-test-5": [{"number": 1, "total": 120, "type": "single", "questionId": 68748, "question": "The Family and Medical Leave Act (FMLA) requires:", "choices": [{"pos": 0, "letter": "A", "text": "paid leave", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "unpaid leave", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "vacation leave", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "sick leave", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Unpaid leave.  The Family and Medical Leave Act (FMLA) requires that eligible employees of covered employers be allowed up to 12 weeks of unpaid, job-protected leave per year for qualifying family and medical reasons.", "finished": false}, {"number": 2, "total": 120, "type": "single", "questionId": 43049, "question": "When should contractor licensing and lien information be given to a homeowner who contracts for a home improvement project?", "choices": [{"pos": 0, "letter": "A", "text": "once the work has started", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at the end of the project", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "when requested by the homeowner", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "before the contract is signed", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. All home improvement contracts must contain the following statement and heading: Anyone who helps improve your property, but who is not paid, may record what is called a mechanics’ lien on your property. A mechanics’ lien is a claim, like a mortgage or home equity loan, made against your property and recorded with the county recorder. Even if you pay your contractor in full, unpaid subcontractors, suppliers, and laborers who helped to improve your property may record mechanics’ liens and sue you in court to foreclose the lien. If a court finds the lien is valid, you could be forced to pay twice or have a court officer sell your home to pay the lien. Liens can also affect your credit. To preserve their right to record a lien, each subcontractor and material supplier must provide you with a document called a ‘20-day Preliminary Notice.’ This notice is not a lien. The purpose of the notice is to let you know that the person who sends you the notice has the right to record a lien on your property if he or she is not paid.", "finished": false}, {"number": 3, "total": 120, "type": "single", "questionId": 59326, "question": "If a homeowner is 65 years or older how long do they have to cancel a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "3 days", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "5 days", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "7 days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10 days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  Assembly Bill Number 2471 states that any person who is 65 or older will now have five business days to cancel a contract.", "finished": false}, {"number": 4, "total": 120, "type": "single", "questionId": 43050, "question": "Prior to signing a home improvement contract, the homeowners shall be informed of the:", "choices": [{"pos": 0, "letter": "A", "text": "contractor’s references", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "number of subcontractors on the job", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor’s name, address, and license number", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "amount of money the contractor allowed for overhead", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A home improvement contract should contain all project details agreed upon by you and your contractor. Among the details should be a description of the work, price, payment schedule, who will pull necessary building department permits, and when the job will begin and end. The contractor’s name, state license number, address, and phone number(s) also should be listed.", "finished": false}, {"number": 5, "total": 120, "type": "single", "questionId": 43051, "question": "When contracting for a home improvement, the contract is an agreement between the contractor and the:", "choices": [{"pos": 0, "letter": "A", "text": "tenant", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "homeowner", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "salesperson", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "None of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A contract is a legal agreement between two or more people. A written agreement is one of the most important communication tools for both the contractor and consumer. It helps avoid misunderstandings about what a job will include. A thorough contract tells how the work will be done, when it will be done, what materials will be used, and how much it will cost. In California, a written contract is required for all home improvement projects over $500. A home improvement contract and any changes made to that contract must be in writing, legible, easy to understand, and inform the consumer of his/her rights to cancel or rescind the contract.", "finished": false}, {"number": 6, "total": 120, "type": "single", "questionId": 43052, "question": "What is the difference between a balance sheet and an income statement?", "choices": [{"pos": 0, "letter": "A", "text": "A Balance Sheet is a summary at one particular point in time where a income statement is a summary over a period of time.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The Balance Sheet is prepared annually and covers a fiscal year where and Income statements only cover a calendar quarter.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The current ratio of a company requires information from both the Balance sheet and Income statement.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The Income statement is used to determine the owner’s equity.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A balance sheet is a statement of the financial position of a business that lists the assets, liabilities and owner’s equity at a particular point in time. In other words, the balance sheet illustrates your business’s net worth. The income statement presents the financial results of a business for a stated period of time. The statement quantifies the amount of revenue generated and expenses incurred by an organization during a reporting period, as well as any resulting net profit or loss. The difference between the balance sheet and income statement. … The balance sheet reports assets, liabilities, and equity, while the income statement reports revenues and expenses that net to a profit or loss.", "finished": false}, {"number": 7, "total": 120, "type": "single", "questionId": 60064, "question": "A contractor MUST be licensed:", "choices": [{"pos": 0, "letter": "A", "text": "to improve structures on his or her own property", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "when entering into a home improvement contract under $1,000", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "when contracting work for $300 or more, including labor and materials", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "when contracting work for $1,000 or more, including labor and materials", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Contracts where the combined value of labor, materials, and all other items is $1,000 or less fall under the “minor work” exemption.  Starting January 1, 2025, Assembly Bill 2622 increased the minor work license exemption from $500 to $1,000, but there is a catch: the work cannot require a permit, and the unlicensed person cannot employ anyone for the project. In other words, if the minor work is subject to a permit requirement of any kind, or if the unlicensed person hires one or more workers to assist or perform the work, a license is required – even if the project is less than $1,000.", "finished": false}, {"number": 8, "total": 120, "type": "single", "questionId": 43054, "question": "The contractor’s disciplinary disclosure notice must be provided to consumers:", "choices": [{"pos": 0, "letter": "A", "text": "prior to completion of job", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "before the license is suspended", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "prior to entering into a contract", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "after signing a contract and before 3 business days pass", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The following must be either in capital letters in 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type: “State law requires anyone who contracts to do construction work to be licensed by the Contractors State License Board in the license category in which the contractor is going to be working—if the total price of the job is $500 or more (including labor and materials). “Licensed contractors are regulated by laws designed to protect the public. If you contract with someone who does not have a license, the Contractors State License Board may be unable to assist you with a complaint. Your only remedy against an unlicensed contractor may be in civil court, and you may be liable for damages arising out of any injuries to the contractor or his or her employees.“You may contact the Contractors State License Board to find out if this contractor has a valid license. The Board has complete information on the history of licensed contractors, including any possible suspensions, revocations, judgments, and citations. The Board has offices throughout California. Please check the government pages of the White Pages for the office nearest you or call 1-800-321-CSLB for more The following notice, in 18-point boldface type, must accompany any home improvement contract offered by door-to-door sale that contains or is secured by a lien on real property.“Warning to buyer: if you sign the contract which accompanies this notice, you will be putting up your home as security. This means that your home could be sold without your permission and without any court action if you miss any payment required by this contract.” Business and Professions Code 7159.1 & 7159.2 Notice Required To Be Given by Disciplined Contractors A contractor who has had his or her license suspended or revoked due to disciplinary action two or more times within an eight-year period must provide a notice to consumers prior to entering into home improvement contracts for residential property with four or fewer units. This notice is required whether or not the suspension or revocation was stayed. The disclosure must be either in capital letters in 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type. The notice must include information on any citation, license suspension, or license revocation during the last four years resulting from any violation of any provisions of this chapter by the contractor, or any complaint or legal action relating to conduct regulated under this chapter that resulted in an unfavorable judgment against the contractor. Business and Professions Code Section 7030 Statement Regarding Where To File a Complaint The following statement must be included on all written contracts. The statement must be in at least 10-point type: “Contractors are required by law to be licensed and regulated by the Contractors State License Board, which has jurisdiction to investigate complaints against contractors if a complaint regarding a patent act or omission is filed within four years of the date of the alleged violation. A complaint regarding a latent act or omission pertaining to structural defects must be filed within 10 years of the date of the alleged violation. Any questions concerning the contractor may be referred to the Registrar, Contractors State License Board, Post Office Box 26000, Sacramento, California 95826.” Arbitration Notice THIS IS 10-POINT ROMAN BOLDFACE TYPE IN CAPITAL LETTERS. This is 10-point roman boldface type. If a contractor wishes to include a provision for private arbitration in a printed contract, it shall be set out in at least 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type. If the provision is included in a typed contract, it shall be set out in capital letters. If a contractor wishes to include a provision for private arbitration in a printed contract, it shall be set out in at least 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type. If the provision is included in a typed contract, it shall be set out in capital letters. Immediately before the line or space provided for the parties to indicate their assent or non assent to the arbitration provision, the following shall appear: Arbitration Notice THIS IS 10-POINT ROMAN BOLDFACE TYPE IN CAPITAL LETTERS.", "finished": false}, {"number": 9, "total": 120, "type": "single", "questionId": 43055, "question": "For which of the following needs to be a licensed contractor?", "choices": [{"pos": 0, "letter": "A", "text": "landscaping", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "a bathroom remodel", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "extending a driveway", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Answers A, B and C all require a licensed contractor.", "finished": false}, {"number": 10, "total": 120, "type": "single", "questionId": 43056, "question": "The 3-day notice of cancellation is required on the home improvement contract at the:", "choices": [{"pos": 0, "letter": "A", "text": "job walk", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "execution of loan", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "time of the proposal", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "signing of the contract", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Homeowners who enter into contracts with contractors to improve, remodel or repair their homes almost always have a right to cancel the contract, without any penalty or obligation, within three business days after signing the contract. A homeowner may also have a right to cancel a contract after three days in limited, extraordinary, situations.", "finished": false}, {"number": 11, "total": 120, "type": "single", "questionId": 43057, "question": "Who must sign the 3-day notice of cancellation in order to cancel a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "lender", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "homeowner", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "building inspector", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Homeowners who enter into contracts with contractors to improve, remodel or repair their homes almost always have a right to cancel the contract, without any penalty or obligation, within three business days after signing the contract. A homeowner may also have a right to cancel a contract after three days in limited, extraordinary, situations.", "finished": false}, {"number": 12, "total": 120, "type": "single", "questionId": 69042, "question": "The 3-day notice of cancellation for a home improvement contract is also known as an:", "choices": [{"pos": 0, "letter": "A", "text": "stop notice", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "notice to correct", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "right to rescind notice", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "insufficient funds notice", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Homeowners who enter into contracts with contractors to improve, remodel or repair their homes almost always have a right to cancel the contract, without any penalty or obligation, within three business days after signing the contract. A homeowner may also have a right to cancel a contract after three days in limited, extraordinary, situations.", "finished": false}, {"number": 13, "total": 120, "type": "single", "questionId": 43059, "question": "Within how many business days, after the signing of a home improvement contract, is the buyer allowed to cancel?", "choices": [{"pos": 0, "letter": "A", "text": "3 business days", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "7 business days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10 business days", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "15 business days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Homeowners who enter into contracts with contractors to improve, remodel or repair their homes almost always have a right to cancel the contract, without any penalty or obligation, within three business days after signing the contract. A homeowner may also have a right to cancel a contract after three days in limited, extraordinary, situations.", "finished": false}, {"number": 14, "total": 120, "type": "single", "questionId": 68742, "question": "A Mechanics Lien Warning provides information to protect the owner against:", "choices": [{"pos": 0, "letter": "A", "text": "faulty work", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "incomplete work", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "material changes", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Mechanics Liens", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Consumers are required to receive a “Mechanics Lien Warning” about property liens. Anyone who helps improve property, but is not paid, may place what is called a mechanics lien on the property. A Mechanics Lien is a claim made against the property by the person who was not paid, and is recorded with the county. Even if the contractor is paid in full, unpaid subcontractors, suppliers, and laborers involved in the project may record a mechanics lien and sue the property owner in court to foreclose the lien. A property owner could be forced to pay twice or have the court sell the home to pay the lien. Liens also can affect a consumer’s personal credit rating, and affect his or her ability to borrow and refinance. Consumers can protect themselves from liens by getting a list from the contractor of all subcontractors and material suppliers who will work on the project, along with the dates they will start and finish the work. Material suppliers and subcontractors are required to give the property owner a “Preliminary Notice” of their right to file a lien within 20 days of delivering products/materials or 20 days of beginning the work. Have subcontractors sign lien releases when their portion of the work is completed.", "finished": false}, {"number": 15, "total": 120, "type": "single", "questionId": 43061, "question": "The Mechanics Lien Warning gives the owner information for protection from:", "choices": [{"pos": 0, "letter": "A", "text": "fees", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "fines", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "liens", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "additional charges", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "D. Residential homeowners are required to receive a “Mechanics Lien Warning” this warning is about property liens. Anyone who helps improve property, but is not paid, may place what is called a mechanics lien on the property. A mechanics lien is a claim made against the property owner by the person who was not paid, and is recorded with the county. Even if the contractor is paid in full, unpaid subcontractors, suppliers, and laborers involved in the project may record a mechanics lien and sue the property owner in court to foreclose the lien. A property owner could be forced to pay twice or have the court sell the home to pay the lien. Liens also can affect a consumer’s personal credit rating, and affect his or her ability to borrow and refinance. Consumers can protect themselves from liens by getting a list from the contractor of all subcontractors and material suppliers who will work on the project, along with the dates they will start and finish the work. Material suppliers and subcontractors are required to give the property owner a “Preliminary Notice” of their right to file a lien within 20 days of delivering products/materials or 20 days of beginning the work. Have subcontractors sign lien releases when their portion of the work is completed.", "finished": false}, {"number": 16, "total": 120, "type": "single", "questionId": 43062 pos": 0, "letter": "A", "text": "at groundbreaking", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at final inspection", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "after first progress payments", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "prior to entering into the contract", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Consumers are required to receive a “Mechanics Lien Warning” warning about property liens. Anyone who helps improve property, but is not paid, may place what is called a mechanics lien on the property. A mechanics lien is a claim made against the property by the person who was not paid, and is recorded with the county. Even if the contractor is paid in full, unpaid subcontractors, suppliers, and laborers involved in the project may record a mechanics lien and sue the property owner in court to foreclose the lien. A property owner could be forced to pay twice or have the court sell the home to pay the lien. Liens also can affect a consumer’s personal credit rating, and affect his or her ability to borrow and refinance. Consumers can protect themselves from liens by getting a list from the contractor of all subcontractors and material suppliers who will work on the project, along with the dates they will start and finish the work. Material suppliers and subcontractors are required to give the property owner a “Preliminary Notice” of their right to file a lien within 20 days of delivering products/materials or 20 days of beginning the work. Have subcontractors sign lien releases when their portion of the work is completed.", "finished": false}, {"number": 18, "total": 120, "type": "single", "questionId": 43064, "question": "Consent to a home improvement contract must be given by both parties before:", "choices": [{"pos": 0, "letter": "A", "text": "the site is inspected", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "any work is performed", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the contractor buys materials", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "the contractor hires subcontractors", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A copy of the Home Improvement Contract, signed by both the property owner and the contractor, must be delivered to the property owner prior to the commencement of work. The contract must also include the following sentence in at least 12-point bold type: “You are entitled to a completely filled in copy of this agreement, signed by both you and the contractor, before any work may be started.”", "finished": false}, {"number": 19, "total": 120, "type": "single", "questionId": 43065, "question": "Home improvement contracts must be consented to by both parties:", "choices": [{"pos": 0, "letter": "A", "text": "freely", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "under duress", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "after work is started", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "before the price is established", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Home improvement contracts are agreements that are typically formed between homeowners and a construction or home development business. They may cover aspects from small home projects like adding a patio, to larger home makeovers such as building another floor in a home.", "finished": false}, {"number": 20, "total": 120, "type": "single", "questionId": 43066, "question": "A contract can be canceled when there is consent through fraud or duress by:", "choices": [{"pos": 0, "letter": "A", "text": "the other party.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the homeowner only.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the contractor only", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "a government agency.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The California Civil Code requires that the consent of the parties to a contract be free, mutual, and communicated by each to the other. Consent is not free or real when obtained through fraud, duress, menace, undue influence, or mistake.", "finished": false}, {"number": 21, "total": 120, "type": "single", "questionId": 43067, "question": "Contracts should be freely exercised by:", "choices": [{"pos": 0, "letter": "A", "text": "the homeowner only", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "the contractor only", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "either party’s attorney", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "both parties to the contract", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Home improvement contracts are agreements that are typically formed between homeowners and a construction or home development business.", "finished": false}, {"number": 22, "total": 120, "type": "single", "questionId": 43068, "question": "Who should review a home improvement contract with an owner before signing it?", "choices": [{"pos": 0, "letter": "A", "text": "lender", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "prime contractor", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "plan checker", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "city inspector", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The contractor should review a home improvement contract with the owner and answer any questions before it is signed. If a job requires plans and specifications, it is important for the contractor and the owner to review those as well.", "finished": false}, {"number": 23, "total": 120, "type": "single", "questionId": 43069, "question": "A home improvement contract can be canceled when there is consent through fraud by:", "choices": [{"pos": 0, "letter": "A", "text": "the other party", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the homeowner only", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the contractor only", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a government agency", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. A contract cannot be valid or legally binding unless consent is given. Consent, essentially, occurs when two parties mutually agree to form a contract with each other. Consent cannot be given under pressure. If one or both parties provided their consent under duress, the contract will not be legal.", "finished": false}, {"number": 24, "total": 120, "type": "single", "questionId": 60239, "question": "If the “Arbitration of Disputes” clause in Business and Professions Code 7191 is not included and initialed by both parties in a home improvement contract, arbitration may not be enforced against any persons other than the:", "choices": [{"pos": 0, "letter": "A", "text": "licensee", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "homeowner", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "subcontractors", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "material suppliers", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. The CSLB’s arbitration program is mandatory for disputes alleging damages less than $25,000. If an “ARBITRATION OF DISPUTES” clause in a home improvement contract provides for private arbitration but the wording does not comply with the Contractors License Law or it is not initialed by both parties, the licensed contractor may be ordered to participate in the CSLB arbitration program.", "finished": false}, {"number": 25, "total": 120, "type": "single", "questionId": 43071, "question": "When using the Contractor’s State License Board’s voluntary or mandatory arbitration, who pays for the costs?", "choices": [{"pos": 0, "letter": "A", "text": "homeowner", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "homeowner and contractor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Contractor’s State License Board", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The Contractors State License Board (CSLB) offers arbitration to resolve disputes that meet certain criteria. CSLB will pay for the hearing, the arbitrator, and the services of one state-appointed expert witness per complaint. Only contractors in good standing with CSLB qualify to participate in arbitration. Complaints involving deceptive or fraudulent practices will be investigated by CSLB.", "finished": false}, {"number": 26, "total": 120, "type": "single", "questionId": 43072, "question": "The Contractors State License Board’s arbitration program provides an arbitrator and one:", "choices": [{"pos": 0, "letter": "A", "text": "expert witness", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "licensed building inspector", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "expert witness and one attorney", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "licensed “B” contractor and one attorney", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Contractors State License Board (CSLB) offers arbitration to resolve disputes that meet certain criteria. CSLB will pay for the hearing, the arbitrator, and the services of one state-appointed expert witness per complaint.", "finished": false}, {"number": 27, "total": 120, "type": "single", "questionId": 43073, "question": "The Contractors State License Board’s arbitration program provides an arbitrator and one expert witness:", "choices": [{"pos": 0, "letter": "A", "text": "free of charge", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at shared expense", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "at nominal expense", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "and one licensee attorney", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Contractors State License Board (CSLB) offers arbitration to resolve disputes that meet certain criteria. CSLB will pay for the hearing, the arbitrator, and the services of one state-appointed expert witness per complaint.", "finished": false}, {"number": 28, "total": 120, "type": "single", "questionId": 43074, "question": "Under proper circumstances, the Contractors State License Board will arbitrate home improvement contract disputes where the alleged damages are:", "choices": [{"pos": 0, "letter": "A", "text": "less than $50,000", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "over $75,000 only", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "less than $100,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "in any amount.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The CSLB offers two free arbitration programs—mandatory and voluntary. Mandatory means that the CSLB may order the contractor to arbitration if the alleged damages are equal to or less than the amount of the contractor’s license bond. CSLB arbitration programs are limited to complaints where the alleged damages are less than $50,000.", "finished": false}, {"number": 29, "total": 120, "type": "single", "questionId": 43075, "question": "If a customer initials the arbitration clause of a contract, they are indicating they will:", "choices": [{"pos": 0, "letter": "A", "text": "sue in superior court", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "be reimbursed for legal expenses", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "have the district attorney litigate the matter", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "submit a dispute to resolution outside of the court system", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. An arbitration clause is a clause in a contract that requires the parties to resolve their disputes through an arbitration process.", "finished": false}, {"number": 30, "total": 120, "type": "single", "questionId": 43076, "question": "A completion date for a home improvement contract is enforceable only when it is written:", "choices": [{"pos": 0, "letter": "A", "text": "regardless of labor availability", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "regardless of material availability", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "and is reasonable to all parties of the contract.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "without regard for conditions that might prevail", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A completion date may be approximate and based on an estimate to allow for external factors such as delays due to the weather or availability of materials, and it must be reasonable to all parties of the contract.", "finished": false}, {"number": 31, "total": 120, "type": "single", "questionId": 43077, "question": "A notice of completion can be withheld because of a dispute over the finished product with the:", "choices": [{"pos": 0, "letter": "A", "text": "owner", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "engineer", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "inspector", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "architect", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A Notice of Completion in California is a document that the property owner may file at the end of the project. It reduces the time within which a contractor may file a mechanics lien from 90 days to 30 days after a project is substantially complete.", "finished": false}, {"number": 32, "total": 120, "type": "single", "questionId": 43078, "question": "How many days, after the approximate start date stipulated in the contract, must the contractor substantially start work before the contractor is in violation of the law?", "choices": [{"pos": 0, "letter": "A", "text": "10 days", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "15 days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "20 days", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "30 days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A home improvement contract must begin no later than twenty (20) days following the start date listed on the contract.", "finished": false}, {"number": 33, "total": 120, "type": "single", "questionId": 43079, "question": "In a home improvement contract, a contractor must give the owner a schedule of the:", "choices": [{"pos": 0, "letter": "A", "text": "payroll dates", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "material dates", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "anticipated inspection dates", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "approximate starting and completion dates", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. THE WORK TIME FRAME The contract should describe the work schedule in the following form: • A statement that describes what the “start of work” consists of, a heading of “APPROXIMATE START DATE” and the approximate date when the work will start. • Under the heading: “APPROXIMATE COMPLETION DATE”, put in approximate date of completion. Example: START AND COMPLETION OF WORK The work to be performed under this Contract shall be commenced on approximately 2026, as long as any required building permits are received and any agreed upon funds are paid to Contractor. The Project shall be completed by approximately 2026, subject to permissible delays as defned in this contract.", "finished": false}, {"number": 34, "total": 120, "type": "single", "questionId": 43080, "question": "Failure to substantially commence work within 20 days from the approximate starting date specified in the contract, without lawful excuse is a:", "choices": [{"pos": 0, "letter": "A", "text": "Class C misdemeanor", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "violation of the performance bond", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "violation of the Home Solicitation Sales Act", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "violation of the Business and Professions Code", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A failure by the contractor without lawful excuse to substantially commence work within {- twenty (20) -} {+ 20 +} days of the approximate date specified in the contract when work will begin shall postpone the next succeeding payment to the contractor for that period of time equivalent to the time between when substantial commencement was to have occurred and when it did occur.", "finished": false}, {"number": 35, "total": 120, "type": "single", "questionId": 60568, "question": "Which of the following must a home improvement contract contain?", "choices": [{"pos": 0, "letter": "A", "text": "permit number", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "license bond number", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "approximate starting date", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "local building department requirements", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C.  THE WORK TIME FRAME The contract should describe the work schedule in the following form: • A statement that describes what the “start of work” consists of, a heading of “APPROXIMATE START DATE” and the approximate date when the work will start. • Under the heading: “APPROXIMATE COMPLETION DATE”, put in approximate date of completion. Example: START AND COMPLETION OF WORK The work to be performed under this Contract shall be commenced on approximately 2026, as long as any required building permits are received and any agreed upon funds are paid to Contractor. The Project shall be completed by approximately 2026, subject to permissible delays as defned in this contract.", "finished": false}, {"number": 36, "total": 120, "type": "single", "questionId": 43082, "question": "Information on licensing and mechanics’ liens must be in:", "choices": [{"pos": 0, "letter": "A", "text": "10-point italic type", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "10-point roman boldface type", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "12-point roman italic bold type", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "12-point roman boldface red type", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The following statement, printed in at least 10-point boldface type. The letters of the last sentence shall be printed in uppercase type, excepting the Internet Web site address of the Contractors’ State License Board, which shall be printed in lowercase type: “NOTICE OF MECHANICS LIEN ATTENTION! Upon the recording of the enclosed MECHANICS LIEN with the county recorder’s office of the county where the property is located, your property is subject to the filing of a legal action seeking a court-ordered foreclosure sale of the real property on which the lien has been recorded. That legal action must be filed with the court no later than 90 days after the date the mechanics lien is recorded. The party identified in the enclosed mechanics lien may have provided labor or materials for improvements to your property and may not have been paid for these items. You are receiving this notice because it is a required step in filing a mechanics lien foreclosure action against your property. The foreclosure action will seek a sale of your property in order to pay for unpaid labor, materials, or improvements provided to your property. This may affect your ability to borrow against, refinance, or sell the property until the mechanics lien is released.", "finished": false}, {"number": 37, "total": 120, "type": "single", "questionId": 43083, "question": "If a contractor includes a provision for private arbitration in a printed contract, it must be set out in at least:", "choices": [{"pos": 0, "letter": "A", "text": "8-point roman boldface type or in contrasting red print in at least 8-point boldface type.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "8-point roman boldface type in black print.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10-point italic boldface type in red print.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "10-point roman boldface type or in contrasting red print in at least 8-point boldface type.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The Contractors License Law states: “If the provision for arbitration is included in a printed contract, it shall be set out in at least 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type.” In the case of a typed contract, it must be typed in capital letters.", "finished": false}, {"number": 38, "total": 120, "type": "single", "questionId": 43084, "question": "If a contractor includes an arbitration provision on a home improvement contract it must be set in at least:", "choices": [{"pos": 0, "letter": "A", "text": "9-point boldface type print", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "10-point italic boldface type print", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10-point roman boldface type print", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "12-point boldface type print", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The Contractors License Law states: “If the provision for arbitration is included in a printed contract, it shall be set out in at least 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type.” In the case of a typed contract, it must be typed in capital letters.", "finished": false}, {"number": 39, "total": 120, "type": "single", "questionId": 43085, "question": "The contractor’s disciplinary notice must be in all capital letters and in which of the following types?", "choices": [{"pos": 0, "letter": "A", "text": "8-point roman italic type-red print or 8-point roman boldface type-black print", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "8-point roman italic type-black print", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "6-point roman boldface type-red print", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10-point roman boldface type-black print or 8-point roman boldface type-red print", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The Contractors License Law states: “ A contractor, who has his or her license suspended or revoked two or more times within an eight-year period, shall disclose either in capital letters in 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type …”", "finished": false}, {"number": 40, "total": 120, "type": "single", "questionId": 43086, "question": "The contractor’s disciplinary notice must be in all capital letters and in which of the following types?", "choices": [{"pos": 0, "letter": "A", "text": "9-point italic type-red print", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "8-point roman type-black print", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "6-point roman boldface type-red print", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "10-point roman boldface type-black print", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  A contractor, who has his or her license suspended or revoked two or more times within an eight-year period, shall disclose either in capital letters in 10-point roman boldface type or in contrasting red print in at least 8-point roman boldface type, in a document provided prior to entering into a contract to perform work on residential property with four or fewer units, any disciplinary license suspension, or license revocation during the last eight years resulting from any violation of this chapter by the contractor, whether or not the suspension or revocation was stayed.\n\nThe key word in the explanation is “or”. It’s either 10 point black or 8 point red according to B&P 7030.1", "finished": false}, {"number": 41, "total": 120, "type": "single", "questionId": 43087, "question": "Change orders are required when the:", "choices": [{"pos": 0, "letter": "A", "text": "contractor’s personnel are changed", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "material suppliers are changed", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contract start day is changed", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "contract amount is changed", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Change orders are required to perform extra or changed work. Change order forms become a part of the contract once the contractor and the homeowner sign them. The order must describe the scope of the extra work or change, the cost to be added or subtracted from the contract, and the effect the order will have on the schedule of progress payments. Change orders can also be written for the removal of items from the original agreement. All change orders must be in writing.", "finished": false}, {"number": 42, "total": 120, "type": "single", "questionId": 43088, "question": "To be binding, change orders to a home improvement contract must contain which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "date of original contract", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "signatures of both parties", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor’s surety company", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "signature of the homeowner only", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. EXTRA WORK (Additional work requires change orders that must be written and signed by all parties.)", "finished": false}, {"number": 43, "total": 120, "type": "single", "questionId": 43089, "question": "Change orders to a home improvement contract are required to be signed by the:", "choices": [{"pos": 0, "letter": "A", "text": "attorney", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "inspector", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "homeowner and contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "general contractor’s subcontractors", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Change orders are required to perform extra or changed work. Change order forms become a part of the contract once the contractor and the homeowner sign them. The order must describe the scope of the extra work or change, the cost to be added or subtracted from the contract, and the effect the order will have on the schedule of progress payments. Change orders can also be written for the removal of items from the original agreement. All change orders must be in writing.", "finished": false}, {"number": 44, "total": 120, "type": "single", "questionId": 43090, "question": "If a contractor does not carry workers’ compensation insurance, the DIR or CSLB may issue a ______________________.", "choices": [{"pos": 0, "letter": "A", "text": "Cease-and-desist-order", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Stop Notice", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Stop Order", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Notice of Cessation", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "D. A Stop Order is a legal demand to cease all employee labor at a job site due to violation of state law(s). This type of order is issued by government agencies when there are safety concerns or unlawful actions in progress. Effective January 1, 2011, the Contractors State License Board (CSLB) was given authority by Business and Professions (B&P) Code section (§) 7127 to issue Stop Orders where there is no workers’ compensation insurance coverage for employees.", "finished": false}, {"number": 45, "total": 120, "type": "single", "questionId": 43091, "question": "If after starting a home improvement project the contractor discovers that the details and specifications do not correctly show the existing construction, the contractor should:", "choices": [{"pos": 0, "letter": "A", "text": "stop and work on a correction", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "stop work and inform the owner and architect/engineer", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "continue the work if variations are only minor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "stop the job and inform the Building Department", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. If after starting a home improvement project the contractor discovers that the details and specifications do not correctly show the existing construction, the contractor should stop work and inform the owner and architect or engineer.", "finished": false}, {"number": 46, "total": 120, "type": "single", "questionId": 43092, "question": "A swimming pool contract must include which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "contract bond", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "performance bond", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "plan and scale drawings", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "surety company’s name and address", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The contract must include a description of the work and the materials and equipment that will be used. Swimming pool contracts require a plan and scale drawing of the shape, size, and dimensions of the pool, and the construction and equipment specifications.", "finished": false}, {"number": 47, "total": 120, "type": "single", "questionId": 43093,
