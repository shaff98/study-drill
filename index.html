<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Law &amp; Business Mastery</title>
<meta name="theme-color" content="#24589f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1b262c; --muted: #5d6b70;
    --line: #dce1dd; --accent: #24589f; --accent-ink: #ffffff;
    --good: #1d7a4c; --good-bg: #e4f2ea; --bad: #ae3b32; --bad-bg: #f9ebe9;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101619; --card: #1a2328; --ink: #e7edee; --muted: #8fa0a6;
      --line: #2a363c; --accent: #7fb0e8; --accent-ink: #0e1a26;
      --good: #5cc98c; --good-bg: #16302355; --bad: #e88a80; --bad-bg: #3a201d55;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
         -webkit-text-size-adjust: 100%; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg);
         border-bottom: 1px solid var(--line);
         padding: calc(.8rem + env(safe-area-inset-top)) 1rem .65rem; }
  .top-row { display: flex; align-items: baseline; justify-content: space-between;
             gap: .75rem; max-width: 640px; margin: 0 auto; }
  .top h1 { font: 600 .8rem/1 var(--sans); letter-spacing: .09em; text-transform: uppercase;
            margin: 0; color: var(--muted); }
  .tally { font: 600 .8rem/1 var(--sans); color: var(--ink);
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tally b { color: var(--accent); }
  .bar { max-width: 640px; margin: .55rem auto 0; height: 5px; border-radius: 3px;
         background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent);
           border-radius: 3px; transition: width .35s ease; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
  main { max-width: 640px; margin: 0 auto;
         padding: 1.1rem 1rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .meta { display: flex; justify-content: space-between; gap: .75rem; align-items: center;
          margin-bottom: .7rem; font: 500 .78rem/1.2 var(--sans); color: var(--muted);
          font-variant-numeric: tabular-nums; }
  .meta-left { display: flex; flex-direction: column; gap: .25rem; }
  .missed-chip { color: var(--bad); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 1.25rem 1.15rem 1.35rem; box-shadow: 0 1px 6px rgb(0 0 0 / .05); }
  .qtext { font: 400 1.22rem/1.5 var(--serif); margin: 0 0 1.1rem;
           text-wrap: balance; overflow-wrap: break-word; }
  .choices { display: flex; flex-direction: column; gap: .55rem; }
  .choice { display: flex; align-items: flex-start; gap: .7rem; width: 100%; min-height: 48px;
            text-align: left; padding: .7rem .8rem; border-radius: 11px; cursor: pointer;
            border: 1.5px solid var(--line); background: transparent; color: var(--ink);
            font: 400 1rem/1.4 var(--sans); }
  .choice .letter { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%;
                    border: 1.5px solid var(--line); display: grid; place-items: center;
                    font: 600 .8rem/1 var(--sans); color: var(--muted); }
  .choice:not([disabled]):active { border-color: var(--accent); }
  .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice[disabled] { cursor: default; }
  .choice.correct { border-color: var(--good); background: var(--good-bg); font-weight: 600; }
  .choice.correct .letter { border-color: var(--good); color: var(--good); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .choice.wrong .letter { border-color: var(--bad); color: var(--bad); }
  .verdict { margin: 1rem 0 0; font: 700 .82rem/1 var(--sans); letter-spacing: .08em;
             text-transform: uppercase; }
  .verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
  .explanation { margin-top: .7rem; padding: .85rem .95rem; border-radius: 10px;
                 border: 1px solid var(--line); background: var(--bg);
                 font: 400 .98rem/1.55 var(--serif); color: var(--ink); }
  .next { display: block; width: 100%; margin-top: 1rem; min-height: 52px; cursor: pointer;
          border: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
          font: 600 1.05rem/1 var(--sans); }
  .next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .done { text-align: center; padding: 2.5rem 0; }
  .done h2 { font: 400 1.7rem/1.3 var(--serif); margin: 0 0 .5rem; }
  .done p { color: var(--muted); font-size: .95rem; }
  footer { max-width: 640px; margin: 1.6rem auto 0;
           padding: 0 1rem calc(1rem + env(safe-area-inset-bottom));
           display: flex; justify-content: space-between; align-items: center; gap: 1rem;
           color: var(--muted); font: 500 .78rem/1.3 var(--sans); }
  footer button { border: none; background: none; color: var(--muted); cursor: pointer;
                  font: 500 .78rem/1 var(--sans); text-decoration: underline; padding: .6rem 0; }
  footer button.armed { color: var(--bad); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <h1>Law &amp; Business</h1>
    <div class="tally" id="tally"></div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
</div>

<main>
  <div class="meta">
    <div class="meta-left">
      <span id="sessionStat"></span>
      <span id="allTime"></span>
    </div>
    <span class="missed-chip" id="missedChip"></span>
  </div>
  <div class="card" id="card"></div>
</main>

<footer>
  <span id="bankNote"></span>
  <button id="resetBtn">Reset progress</button>
</footer>

<script>
const BANKS = {"law-bus-test-1": [{"number": 1, "total": 120, "type": "single", "questionId": 68913, "question": "The Family and Medical Leave Act (FMLA) guarantees that eligible employees can take up how many weeks of unpaid leave?", "choices": [{"pos": 0, "letter": "A", "text": "4", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "8", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "12", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "16", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. 12.  The Family and Medical Leave Act (FMLA) guarantees eligible employees up to 12 weeks of unpaid, job-protected leave per year for qualifying reasons, such as caring for a newborn or a family member with a serious health condition, or for the employee’s own serious health condition.", "finished": false}, {"number": 2, "total": 120, "type": "single", "questionId": 45805, "question": "A contractor is not required to register with the Department of Industrial Relations (DIR) as a public works contractor if the contract:", "choices": [{"pos": 0, "letter": "A", "text": "is for repairs only and does not exceed $25,000", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "does not exceed $50,000 for new construction", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "does not exceed $35,000 for alterations", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "is for maintenance only and does not exceed $20,000", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Contractors who work exclusively on small projects qualify for the “Small Project Exemption” if the amount of the entire project does not exceed $25,000 for new construction, alteration, installation, demolition or repair, and $15,000 for maintenance.", "finished": false}, {"number": 3, "total": 120, "type": "single", "questionId": 45854, "question": "A contractor must keep change orders on file:", "choices": [{"pos": 0, "letter": "A", "text": "for at least six months.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "for at least five years.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "until the project is completed.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "for tax purposes.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  Contractors License Law, a contractor should “keep records showing all contracts, documents, records, receipts, and disbursements by a licensee of all of his or her\n\ntransactions as a contractor” for at least 5 years.", "finished": false}, {"number": 4, "total": 120, "type": "single", "questionId": 42558, "question": "As required by the Immigration Reform and Control Act, all employees hired on or after November 7, 1986 must complete Form _____ to verify their employment eligibility status.", "choices": [{"pos": 0, "letter": "A", "text": "I-9", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "W-4", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "US-99", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "N-14", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Immigration Reform and Control Act of 1986 (IRCA) legally mandates that U.S. employers verify the employment eligibility status of newly-hired employees. Form I-9 is a three-part document. The law requires that the employee complete Section 1 at the time of hire or when the employee begins work.", "finished": false}, {"number": 5, "total": 120, "type": "single", "questionId": 42560, "question": "Ms. Gomez applies for a job. Of the following, the only reason an employer may lawfully deny her employment is:", "choices": [{"pos": 0, "letter": "A", "text": "she is over 50 years of age", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "she is Hispanic and everyone else is African-American or Caucasian", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "lifting is involved and she is a woman", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "she has no work experience or Social Security number", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Under the laws enforced by EEOC, it is illegal to discriminate against someone (applicant or employee) because of that person’s race, color, religion, sex (including gender identity, sexual orientation, and pregnancy), national origin, age (40 or older), disability or genetic information.", "finished": false}, {"number": 6, "total": 120, "type": "single", "questionId": 58571, "question": "A contractor has had a problem with employees stealing tools and equipment from job sites. When conducting job interviews, may the contractor ask prospective employees about their arrest records?", "choices": [{"pos": 0, "letter": "A", "text": "It is legal to ask prospective employees about arrests not leading to convictions.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "It is not legal to ask prospective employees about arrests not leading to convictions.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "It is illegal for a private employer to ask about arrests not leading to convictions, but it would be legal for city, county and federal agencies to ask about such arrests.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It is legal for a private employer to ask about arrests leading to convictions, but it would not be legal for a federal, state, or local public agency to do so.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California law generally prohibits asking a job applicant or an employee about an arrest that did not lead to a conviction or about a pretrial or post-trial diversion program. This law is found in Labor Code Section 432.7. In general, employers may not ask job applicants about arrests that did not lead to convictions. The law also prohibits employers from asking about referrals to pretrial or post-trial diversion programs or convictions that were dismissed or ordered sealed by a judge.", "finished": false}, {"number": 7, "total": 120, "type": "single", "questionId": 42562, "question": "Who must sign a joint control addendum to a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "contractor only", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "owner and contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "owner, contractor, and Notary Public", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "owner, contractor, and joint control officer", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. (a) Joint Control Addendum is when a third party is involved with the contract; (b) A joint control is a builder’s construction control service, which acts as an escrow holder of a consumer’s money. A joint control company manages the disbursement of funds to prevent the contractor from being paid more than the value of the work already completed. A joint control also safeguards the consumer’s property from mechanics liens by requiring the contractor to supply lien releases as progress payments are made.", "finished": false}, {"number": 8, "total": 120, "type": "single", "questionId": 71824, "question": "A contractor entered into a Home Improvement Contract for more than $1,000 with Mrs. Swenson to remodel her kitchen and bathroom. The contract calls for a down payment before work is to begin. According to the Business and Professions Code, how much may the contractor accept from Mrs. Swenson as down payment for the work?", "choices": [{"pos": 0, "letter": "A", "text": "The contractor may accept as much as Mrs. Swenson agrees to pay.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The down payment is limited to $1000 or 10% of the total price, whichever is less.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor may require enough of a down payment to cover the total cost of materials, but not labor costs.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Nothing: The contractor must wait until the work is completed to accept any payment.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B.  The Contractors License Law limits the down payment for a Home Improvement Contract to $1,000 or 10% of the contract price, whichever is less. For example, if the contract price is $6,000, the maximum down payment allowed would be $600.", "finished": false}, {"number": 9, "total": 120, "type": "single", "questionId": 42564, "question": "When should you let your attorney see a construction contract?", "choices": [{"pos": 0, "letter": "A", "text": "Before you let your client see the contract.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "After the contract is prepared, but before you sign it.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "After the building permit is obtained.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "After the contract is signed by you and your client.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Your attorney must study the entire contract, including any alternative language suggested by your client. The best time for a review would be just before you and your client sign the contract.", "finished": false}, {"number": 10, "total": 120, "type": "single", "questionId": 42565, "question": "If a sales presentation is made in Spanish, the home solicitation contract:", "choices": [{"pos": 0, "letter": "A", "text": "must be in Spanish", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "may be in English if the writing is plain and simple", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "must be co-signed by an English-speaking person if the contract is in English", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "must be translated into English and notarized", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. A home solicitation contract written pursuant to Section 7151.2 of the Business and Professions Code shall be written in the same language as principally used in the oral sales presentation.", "finished": false}, {"number": 11, "total": 120, "type": "single", "questionId": 42566, "question": "A contractor and a homeowner sign a home solicitation contract. If the owner lawfully cancels the contract, how long does the contractor have to pick up unused materials that were delivered to the owner’s property?", "choices": [{"pos": 0, "letter": "A", "text": "within 24 hours after cancellation", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "within 10 days after cancellation", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "within 20 days after cancellation", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It’s too late: If the materials are delivered to the property before a notice of cancellation is received, the materials become the property of the owner.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. If you the prime contractor receive a notice of cancellation, the materials should be picked up as soon as possible. After 20 days the materials become the property of the owner. You must return the down payment within ten-days.", "finished": false}, {"number": 12, "total": 120, "type": "single", "questionId": 42567, "question": "Of the following, which is best for determining the number of hours required for different phases of a project and for making sure the job is on schedule?", "choices": [{"pos": 0, "letter": "A", "text": "bar graph and chart", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "cash analysis chart", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "review plans", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "critical path method", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The critical path method (CPM) is a step-by-step project management technique for process planning that defines critical and non-critical tasks with the goal of preventing time-frame problems and process bottlenecks. The critical path method is one of the most frequently used and effective techniques in project planning. When you’re managing dozens of tasks, dependencies, and people, the critical path method helps you keep your project on track and on budget, providing visibility into your project.", "finished": false}, {"number": 13, "total": 120, "type": "single", "questionId": 55352, "question": "Does an employer need to allow an employee to use/smoke marijuana if it is a medical prescription?", "choices": [{"pos": 0, "letter": "A", "text": "If it is 6 feet from the workplace", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "If it is in a designated area", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Never, because it is prohibited by the supreme court", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "If its once a month", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C.   The California Supreme Court clarified that the Fair Employment and Housing Act (FEHA) does not provide protection for current marijuana use, even if it is taken for medicinal purposes.  Worker’s rights/employer regulations were affirmed by the Supreme Court and Federal case law states that an employer may dictate what happens at their workplace for the safety of all employees.", "finished": false}, {"number": 14, "total": 120, "type": "single", "questionId": 42568, "question": "Who is responsible for checking the site before the building inspector arrives?", "choices": [{"pos": 0, "letter": "A", "text": "contractor", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "owner", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "foreperson", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "architect", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A general contractor, main contractor or prime contractor is responsible for the day-to-day oversight of a construction site, management of vendors and trades, and the communication of information to all involved parties throughout the course of a building project. A general contractor is responsible for providing all of the material, labor, equipment (such as engineering vehicles and tools) and services necessary for the construction of the project. A general contractor often hires specialized subcontractors to perform all or portions of the construction work. When using subcontractors, the general contractor is responsible for the quality of all work performed by any and all of the hires. The general contractor’s number one priority is safety on the job site. A general contractor’s responsibilities may include applying for building permits, advising the person they are hired by, securing the property, providing temporary utilities on site, managing personnel on site, providing site surveying and engineering, disposing or recycling of construction waste, monitoring schedules and cash flows, and maintaining accurate records.[", "finished": false}, {"number": 15, "total": 120, "type": "single", "questionId": 42569, "question": "Who would be held responsible if a contractor completes a project according to plans and later discovers that there is a building code violation?", "choices": [{"pos": 0, "letter": "A", "text": "contractor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "architect", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "both the contractor and the architect", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "owner", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. If a contractor notices a discrepancy between the plans and code, he or she should notify the architect and/or engineer-whomever signed off on the plans as a representative of the owner. If neither noticed the violation and construction proceeds, both the architect and contractor can be held liable. The liability of the architect certainly does not end when the plans are signed, nor is the contractor exempt from liability once the plans are read and construction begins.", "finished": false}, {"number": 16, "total": 120, "type": "single", "questionId": 42570, "question": "After a job is completed, the owner decides to have additional work done. How should the contractor proceed?", "choices": [{"pos": 0, "letter": "A", "text": "Write a new contract and ask the owner to sign it.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Make an oral agreement with the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Do the additional work for free.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Get the owner to sign a change order.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. It is best to collect the balance owed for the original contract because the work has been completed. Then prepare a new contract for the additional new work.", "finished": false}, {"number": 17, "total": 120, "type": "single", "questionId": 42571, "question": "You have been awarded a job. It requires two days for site preparation and one day for clean-up. The contract involves two separate tasks–one lasting seven days and the other 10 days. If the two tasks can be done simultaneously, for how many days should you schedule the job?", "choices": [{"pos": 0, "letter": "A", "text": "7 days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "13 days", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "15 days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "20 days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. 2 (site prep) + 1 (clean-up) + 10 (simultaneous jobs) = 13 days. Be sure to read the question carefully. It is saying that the two tasks can be done simultaneously", "finished": false}, {"number": 18, "total": 120, "type": "single", "questionId": 42572, "question": "For which of the following would you NOT obtain a short-term loan?", "choices": [{"pos": 0, "letter": "A", "text": "wages", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "bid bond", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "job materials", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "office rent", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Office rent is a fixed overhead expense. The others are direct construction costs that may be financed for a particular project.\nShort-term business loans for contractors are a good fit for those who need growth capital and have predictable expenses. This is because term contractor loans give you a lump sum amount and require fixed weekly amortized repayments of principal and interest.\nYou can use short-term contractor loans to make immediate purchases because you’ll receive a lump sum amount and start paying interest. For example, if you want to hire a new employee for an upcoming job and know what his or her salary will be for the life of the contract, you can request a lump sum amount and use it to cover the salary until the job is complete.", "finished": false}, {"number": 19, "total": 120, "type": "single", "questionId": 42573, "question": "As part of the safety training process, contractors’ supervisors are required to conduct “toolbox” or “tailgate” safety meetings. How often must these meetings be held?", "choices": [{"pos": 0, "letter": "A", "text": "daily", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at least once every ten working days", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "at least once a month", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "at least once a quarter", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Required by Title 8, Sections 8406 and 1509 of the California Code of Regulations. Supervisory employees shall conduct “toolbox” or “tailgate” safety meetings, or equivalent, with their crews at least every 10 working days to emphasize safety.", "finished": false}, {"number": 20, "total": 120, "type": "single", "questionId": 42574, "question": "DOSH must investigate a complaint charging a serious violation of health or safety standards within:", "choices": [{"pos": 0, "letter": "A", "text": "one working day", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "two working days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "three working days", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "five calendar days", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The law specifically says that DOSH shall investigate complaints alleging that an employee’s “place of employment is not safe….as soon as possible, but not later than three working days after receipt of a complaint charging a serious violation, and not later than 14 calendar days after receipt of a complaint charging a non-serious violation” (Labor Code §6309)", "finished": false}, {"number": 21, "total": 120, "type": "single", "questionId": 42575, "question": "Every employer of _____ or more full- or part-time employees must keep written health and safety records for _____ years.", "choices": [{"pos": 0, "letter": "A", "text": "1 … 3", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "7 … 4", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10 … 3", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "11 … 5", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Employers with 11 or more employees must keep Cal/OSHA records on a calendar-year basis. The records must be retained for at least five years. 1904.1(a)(1) If your company had ten (10) or fewer employees at all times during the last calendar year, you do not need to keep OSHA injury and illness records unless OSHA or the BLS informs you in writing that you must keep records under § 1904.41 or § 1904.42. 1904.1(a)(2) If your company had more than ten (10) employees at any time during the last calendar year, you must keep OSHA injury and illness records unless your establishment is classified as a partially exempt industry under § 1904.2.", "finished": false}, {"number": 22, "total": 120, "type": "single", "questionId": 42576, "question": "If required safety devices are missing from tools, what should an employee do?", "choices": [{"pos": 0, "letter": "A", "text": "Notify the contractor, who is responsible for safety.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Notify the property owner, who is responsible for safety.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Safety devices are the employee’s responsibility.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Call Cal/OSHA.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The general contractor’s number one priority is safety on the job site.", "finished": false}, {"number": 23, "total": 120, "type": "single", "questionId": 42577, "question": "Which would NOT have to be reported to DOSH immediately or within 24 hours?", "choices": [{"pos": 0, "letter": "A", "text": "death from a three-story fall", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "drunken crane operator hits a high-voltage power line", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "car accident in which an employee steps onto a public road, gets hit by a car, and suffers a concussion", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "employee falls off forklift and suffers a severe back injury", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Deaths and accidents resulting in serious injuries must be reported to DOSH. Accidents involving operation of heavy equipment adjacent to high-voltage wires must also be reported to DOSH. However, you are not required to report accidents occurring on public streets or highways.", "finished": false}, {"number": 24, "total": 120, "type": "single", "questionId": 42578, "question": "When purchasing insurance, what is the best way to choose among different companies?", "choices": [{"pos": 0, "letter": "A", "text": "referral", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "cost and coverage", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "location of the company", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "word-of-mouth", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Cost and coverage are the most important items to consider given the choices here.", "finished": false}, {"number": 25, "total": 120, "type": "single", "questionId": 67509, "question": "Insured employers must report every work-related illness or injury to their workers’ compensation carrier within _____ of the incident.", "choices": [{"pos": 0, "letter": "A", "text": "24 hours", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "2 days", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "5 days", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10 days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California law requires employers to report within five days of knowledge every occupational injury or illness which results in lost time beyond the date of the incident OR requires medical treatment beyond first aid, as per the Labor Code.", "finished": false}, {"number": 26, "total": 120, "type": "single", "questionId": 42580, "question": "Your employee sets a cabinet wrong. The cabinet falls from the wall and damages the client’s counter top. What should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Claim the damage on your general liability insurance policy.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Require the employee to pay for the damage to the counter top.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Tell the client to claim the damaged counter top on his or her homeowner’s insurance policy.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "No action is required: The client must assume the risk of damage.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. California general liability insurance is required by the state for most business owners. GL coverage is designed to protect CA business owners from direct or indirect damages to another party. Your liability insurance helps pay for those damages caused by the actions of your business, or your employees.", "finished": false}, {"number": 27, "total": 120, "type": "single", "questionId": 42581, "question": "A contractor is looking for an insurance policy to cover a high degree of exposure to risk. Of the following, which policy would be best for this purpose?", "choices": [{"pos": 0, "letter": "A", "text": "property", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "general liability", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "builder’s risk", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "umbrella", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Commercial umbrella insurance provides an extra layer of liability protection by covering costs that go beyond your other liability coverage limits. In other words, commercial umbrella insurance complements your other liability coverage by taking over when your other liability coverage limits have been reached. An umbrella policy provides higher liability limits than a standard policy and is recommended if you have substantial assets to protect.", "finished": false}, {"number": 28, "total": 120, "type": "single", "questionId": 42582, "question": "John Meyers, a general contractor, had a contract with Mr. and Mrs. Barnes to construct a gazebo and deck in their back yard. John was behind schedule and hired his 18-year-old son, Bart, to help on a part-time basis. After working on the project for a month, Bart slipped on a plank that John had laid across the deck but did not nail securely. As a result of the fall, Bart broke his leg. John is insured for workers’ compensation, but Bart wants to sue his father for negligence in a civil action. Which of the following statements is CORRECT?", "choices": [{"pos": 0, "letter": "A", "text": "John is not liable for damages in a civil action because the injured employee is his son.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "John is liable for damages in a civil action and must prove that the injury did not result from his negligence.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "In a civil action, John may use the defense that the injury was the result of the contributory negligence of his son.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A civil action is not a possibility when the dispute involves a job-related injury, unless the employer is not insured for workers’ compensation. This case would be handled by the Department of Industrial Relations.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Since John is insured for workers’ compensation, Bart must file a claim with John’s insurance carrier. If John and his carrier dispute the claim, the matter may be referred to the Workers’ Compensation Appeals Board, which is part of the Department of Industrial Relations.", "finished": false}, {"number": 29, "total": 120, "type": "single", "questionId": 42583, "question": "A prime contractor entered into a construction contract with a subcontractor. An employee of the subcontractor was injured, but unfortunately the subcontractor had not secured workers’ compensation coverage. Which of the following statements best describes the situation, except in cases of fraud?", "choices": [{"pos": 0, "letter": "A", "text": "The subcontractor is guilty, but the prime contractor is not responsible.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The prime contractor is guilty, but the subcontractor is not responsible.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Neither the prime contractor nor the subcontractor are responsible.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The subcontractor is guilty, but the prime contractor must take responsibility for the injuries.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. In today’s construction market, more and more general contractors are hiring subcontractors to do specific work. As a general contractor, it is important to make sure your subcontractor has the right insurance or you may be responsible for their worker’s compensation claims.", "finished": false}, {"number": 30, "total": 120, "type": "single", "questionId": 42584, "question": "Your accountant advises you to set up a cost management system. What does this system do?", "choices": [{"pos": 0, "letter": "A", "text": "It gives a cost history to analyze labor and material costs.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "It shows where profits and losses are.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "It shows costs of materials only.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It compares what others are charging for subcontracted work.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Cost management is the process of planning and controlling the budget of a business. Cost management is a form of management accounting that allows a business to predict impending expenditures to help reduce the chance of going over budget.", "finished": false}, {"number": 31, "total": 120, "type": "single", "questionId": 69730, "question": "An employee works 60 hours in one week. If the hourly wage rate is $18.00 per hour, what are the gross wages?", "choices": [{"pos": 0, "letter": "A", "text": "$1,080", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$1,260", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$1,320", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "$1,425", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Gross wages = Regular Time + Overtime Regular Time = 40 hrs x $18/hr = $720. Overtime is paid at time and a half (1.5) which would add up to $27/hr.  20 hrs x $27/hr = $540.\n\nGross Wages = Regular pay $720 + Overtime pay $540 = $1,260.", "finished": false}, {"number": 32, "total": 120, "type": "single", "questionId": 42586, "question": "A(n) _____ represents a company’s financial position on a specified date.", "choices": [{"pos": 0, "letter": "A", "text": "balance sheet", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "income statement", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "cash flow statement", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "profit plan", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A balance sheet is a statement of the financial position of a business that lists the assets, liabilities and owner’s equity at a particular point in time. … The income statement, which shows net income for a specific period of time, such as a month, quarter, or year. The purpose of the balance sheet is to reveal the financial status of a business as of a specific point in time. The statement shows what an entity owns (assets) and how much it owes (liabilities), as well as the amount invested in the business (equity).", "finished": false}, {"number": 33, "total": 120, "type": "single", "questionId": 42587, "question": "A(n) _____ summarizes revenues, cost of sales, and operating expenses over a period of time.", "choices": [{"pos": 0, "letter": "A", "text": "profit plan", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "balance sheet", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "cash flow statement", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "income statement", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The income statement also called a profit and loss statement is a report made by company management that shows the revenue, expenses, and net income or loss for a period. The income statement consists of revenues and expenses, along with the resulting net income or loss over a period of time due to earning activities.", "finished": false}, {"number": 34, "total": 120, "type": "single", "questionId": 42588, "question": "An employer must furnish an employee with a completed IRS Form W-2 (Wage and Tax Statement) by:", "choices": [{"pos": 0, "letter": "A", "text": "1-Jan", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "31-Jan", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "15-Apr", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the final day of employment", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Employers must furnish their employees with a completed IRS Form W-2 (Wage and Tax Statement) for the former year by January 31st of each year.", "finished": false}, {"number": 35, "total": 120, "type": "single", "questionId": 42589, "question": "Which of the following financial ratios is the strictest measure of liquidity?", "choices": [{"pos": 0, "letter": "A", "text": "quick ratio", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "current ratio", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "profitability ratio", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "leverage ratio", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Quick ratio is a type of liquidity ratio which measures the ability of a company to use its near cash or quick assets to extinguish or retire its current liabilities immediately. The quick ratio is calculated by adding cash, cash equivalents, short-term investments, and current receivables together then dividing them by current liabilities. Sometimes company financial statements don’t give a breakdown of quick assets on the balance sheet.", "finished": false}, {"number": 36, "total": 120, "type": "single", "questionId": 42590, "question": "The federal Employer Identification Number (EIN) is issued by the:", "choices": [{"pos": 0, "letter": "A", "text": "Franchise Tax Board", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Board of Equalization", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Internal Revenue Service", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Employment Development Department", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The Employer Identification Number (EIN), also known as the Federal Employer Identification Number or the Federal Tax Identification Number, is a unique nine-digit number assigned by the Internal Revenue Service (IRS) to business entities operating in the United States for the purposes of identification.", "finished": false}, {"number": 37, "total": 120, "type": "single", "questionId": 42591, "question": "An employer remits State disability taxes withheld from an employee’s wages to what agency?", "choices": [{"pos": 0, "letter": "A", "text": "Internal Revenue Service", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Employment Development Department", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Franchise Tax Board", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Board of Equalization", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Employment taxes including state disability for California are paid to EDD. EDD then distributes to other state agencies.", "finished": false}, {"number": 38, "total": 120, "type": "single", "questionId": 42592, "question": "Who pays FICA?", "choices": [{"pos": 0, "letter": "A", "text": "employer", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "employee", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "50% employer and 50% employee", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "90% employer and 10% employee", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. FICA = Federal Insurance Contributions Act (Social Security). The employer and employee contribute equally to FICA. The employee’s share of FICA is deducted from the employee’s wages.", "finished": false}, {"number": 39, "total": 120, "type": "single", "questionId": 42593, "question": "How often are FICA taxes reported and paid?", "choices": [{"pos": 0, "letter": "A", "text": "weekly", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "monthly", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "quarterly", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "yearly", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. FICA taxes are reported and paid quarterly. However, employers with large payrolls are required to make monthly or semiweekly tax deposits.", "finished": false}, {"number": 40, "total": 120, "type": "single", "questionId": 42594, "question": "Who pays FUTA?", "choices": [{"pos": 0, "letter": "A", "text": "employer", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "employee", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "50% employer and 50% employee", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "90% employer and 10% employee", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The Federal Unemployment Tax Act (FUTA) is a payroll tax paid by employers on employee wages. The tax is 6.2% on the first $7,000 an employee earns; any earnings beyond $7,000 are not taxed. In practice, the actual percentage paid is usually 0.8%. Unemployment taxes-whether FUTA (federal unemployment) or State unemployment insurance-must be paid by the employer.", "finished": false}, {"number": 41, "total": 120, "type": "single", "questionId": 42595, "question": "What happens after an employee’s taxable wages exceed $7,000?", "choices": [{"pos": 0, "letter": "A", "text": "After $7,000, the FUTA rate increases.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "After $7,000, the FUTA rate decreases by 50%.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "After $7,000, the employer does not pay FUTA.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Nothing: FUTA is not subject to a wage limit.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. FUTA (FEDERAL UNEMPLOYMENT TAX ACCOUNT) $7,000 IS THE LIMIT THE EMPLOYER HAS TO PAY. Currently, the FUTA tax applies to the first $7,000 in wages paid to an employee during the calendar year.", "finished": false}, {"number": 42, "total": 120, "type": "single", "questionId": 42596, "question": "Which of the following may not be deducted from an employee’s paycheck?", "choices": [{"pos": 0, "letter": "A", "text": "SDI", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "FICA", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Medicare tax", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "workers’ compensation insurance premiums", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Workers’ Compensation (Workers’ Comp) is a form of accident insurance paid by employers. No payroll deductions are taken out of employees’ salaries for this insurance. The Labor Code makes it a misdemeanor for an employer to deduct any amount from an employee’s paycheck for workers’ compensation insurance premiums.", "finished": false}, {"number": 43, "total": 120, "type": "single", "questionId": 42597, "question": "To whom do you report and pay sales tax?", "choices": [{"pos": 0, "letter": "A", "text": "County Tax Collector", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Internal Revenue Service", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "California Department of Tax and Fee Administration", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Franchise Tax Board", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The California Department of Tax and Fee Administration (CDTFA) is the public agency charged with assessing and collecting sales and use taxes, as well as a variety of excise fees and taxes, for the U.S. state of California. The California Department of Tax and Fee Administration, formerly known as Board of Equalization, administers and enforces the California Sales and Use Tax Law.", "finished": false}, {"number": 44, "total": 120, "type": "single", "questionId": 42598, "question": "How often are you required to pay sales tax?", "choices": [{"pos": 0, "letter": "A", "text": "monthly", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "quarterly", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "annually", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It depends on the expected amount of taxable sales.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Sales taxes are reported and paid on a quarterly basis. However, if taxable sales are high, prepayments may be required for the first two months of each quarter.", "finished": false}, {"number": 45, "total": 120, "type": "single", "questionId": 42599, "question": "When balancing the accounts receivable, which of the following would have no effect?", "choices": [{"pos": 0, "letter": "A", "text": "Posting to the wrong accounts-receivable account.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Crediting instead of debiting the accounts-receivable account.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Debiting instead of crediting the accounts-receivable account.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Posting a receivable to an accounts-payable account.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Even if you post to the wrong accounts-receivable account (e.g., Mrs. Jones instead of Mr. Smith), the total accounts receivable will still be the same, as will the general ledger. It is still an error, but it will not affect the total amount.", "finished": false}, {"number": 46, "total": 120, "type": "single", "questionId": 42600, "question": "What kind of discount do lumber yards and other suppliers offer to contractors who pay their bills promptly?", "choices": [{"pos": 0, "letter": "A", "text": "½%- 1%", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1%- 2%", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "4%- 8%", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10%-12%", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B.   Our answer is based on the references listed in the CSLB Study Guide. In practice, the discounts can be higher than 2%.\nGenerally, discounts are up to 2% because that is the cost of money/overhead/keeping inventory savings which is passed on to the buyer who pays promptly. Individual agreements for a higher discount are possible, but not general.", "finished": false}, {"number": 47, "total": 120, "type": "single", "questionId": 42601, "question": "If a newly hired employee does not have an SSN, what should be done?", "choices": [{"pos": 0, "letter": "A", "text": "The employee must apply for an SSN.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The employer must apply on behalf of the employee for an SSN.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "If a W-2 is provided, an SSN is not needed.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Call the police.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Social Security numbers are used to report a person’s wages to the government and to determine a person’s eligibility for Social Security benefits. You need a Social Security number to get a job, collect Social Security benefits, and receive some other government services", "finished": false}, {"number": 48, "total": 120, "type": "single", "questionId": 42602, "question": "Once a budget is finalized, the:", "choices": [{"pos": 0, "letter": "A", "text": "contractor should stick to the budget no matter what happens", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "contractor should do the best possible job of staying within the budget", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "budget should be revised each month", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "budget should be referred to only if the business has cash flow problems", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Once a budget is finalized, the contractor should do the best possible job of staying within the budget.", "finished": false}, {"number": 49, "total": 120, "type": "single", "questionId": 42603, "question": "Which of the following procedures BEST ensures error-free bids?", "choices": [{"pos": 0, "letter": "A", "text": "working with an attorney", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "having another person draft the bid", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "discussing details of the bid with the supplier", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "rechecking the bid before submitting it to the client", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Of the choices here, rechecking the bid before submitting it to the client is the best way to ensure an error-free bid.", "finished": false}, {"number": 50, "total": 120, "type": "single", "questionId": 67969, "question": "Direct costs are $37,000, overhead is 12%, and profit is 5%. What is the selling price?", "choices": [{"pos": 0, "letter": "A", "text": "$39,272.47", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$41,373.45", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$43,383.37", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$44,578.32", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The following solution is based on one of the references listed in the CSLB Study Guide.  The solution may seem unorthodox, but you must follow each step to arrive at the State’s answer.  Sum of overhead and profit percentages = 12% + 5% = 17%.  Percent of selling price that is direct costs = 100% – 17% = 83% = .83.  Selling price = $37,000 ÷ .83 = $44,578.31.  To check these calculations, add the subtotals: Direct costs = $44,578.31 × .83 = $37,000.00.  Overhead = $44,578.31 × .12 = $5,349.40.  Profit = $44,578.31 × .05 = $2,228.92.  $37,000.00 + $5,349.40 + $2,228.92 = $44,578.32.", "finished": false}, {"number": 51, "total": 120, "type": "single", "questionId": 42605, "question": "What is the most likely reason to lose a bid?", "choices": [{"pos": 0, "letter": "A", "text": "10% added to profit", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "vague specifications", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "prices from subs were not exact", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "costs of materials were not obtained", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Specifications that are poorly written usually lead to a wide range of bids.", "finished": false}, {"number": 52, "total": 120, "type": "single", "questionId": 42606, "question": "You are bidding on a job with plans drawn by the owner. You notice a code violation and bring it to the attention of the owner. The owner declines to remedy the code violation and tells you not to worry. What should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Bid on the job as though it were to code.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Bid on the job as though it were to code, but ask the owner to sign a release of your responsibility.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Bid on the job with the corrections in mind, and perform the corrections yourself to bring the work up to code.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Decline to bid on the work.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. A contractor who willfully violates a building code is subject to disciplinary action.", "finished": false}, {"number": 53, "total": 120, "type": "single", "questionId": 42607, "question": "After you have read the plans and specifications, what is the next important step in writing a bid?", "choices": [{"pos": 0, "letter": "A", "text": "Talk to and select subs.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Walk the job.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Call about materials, price, and availability.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Talk to the crew leader about labor.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A pre-bid job walk is an opportunity for all of the prospective bidders to view the project and to ask questions concerning the project. Providing contractors with access to the project can provide better bids, as the contractors who are bidding have greater confidence in the size and scope of the project. The references listed in the CSLB Study Guide recommend that you review the plans and specifications and then do an on-site inspection (“walk the job”). This is especially true for remodeling jobs.", "finished": false}, {"number": 54, "total": 120, "type": "single", "questionId": 42608, "question": "On a time-and-materials job, you should:", "choices": [{"pos": 0, "letter": "A", "text": "not charge for profit and overhead", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "add profit and overhead to labor only", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "add profit and overhead to materials only", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "add profit and overhead to labor and materials", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The references listed in the CSLB Study Guide recommend that you add a percentage of the job total. If your bill lists separate charges for labor, materials, and subcontractors, an alternative would be to mark up each of these charges to cover overhead and profit.", "finished": false}, {"number": 55, "total": 120, "type": "single", "questionId": 42609, "question": "All of the following are causes for disciplinary action except:", "choices": [{"pos": 0, "letter": "A", "text": "allowing your license to be used by an unlicensed contractor", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "entering into a contract with another contractor who is not licensed", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "during bankruptcy, settling obligations incurred as a contractor for less than the full amount owed", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "willful or deliberate failure to pay money when due for materials or services", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. is the only answer that would NOT be cause for disciplinary action. Disciplinary action by the Registrar will NOT be taken against a licensee for avoiding or settling obligations for less than the full amount during bankruptcy.", "finished": false}, {"number": 56, "total": 120, "type": "single", "questionId": 42610, "question": "The qualifying RME for a construction firm must work at least:", "choices": [{"pos": 0, "letter": "A", "text": "32 hr per week or 80% of the work week", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30 hr per week or 70% of the work week", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "24 hr per week or 65% of the work week", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "12 hr per week or 51% of the work week", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The RME (Responsible Managing Employee) must be regularly employed by the construction firm and must be actively involved in the operation of the business at least 32 hours per week or 80% of the business total operating hours per week–whichever is less", "finished": false}, {"number": 57, "total": 120, "type": "single", "questionId": 42611, "question": "If a contractor forgets to renew his or her license on time, the expired license may be renewed any time within _____ after its expiration without reapplying for a license and fulfilling the exam or waiver requirements again.", "choices": [{"pos": 0, "letter": "A", "text": "one year", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "two years", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "four years", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "five years", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. An expired license may be renewed within five years after its expiration. After five years the license becomes void and the contractor must apply for a new license.", "finished": false}, {"number": 58, "total": 120, "type": "single", "questionId": 42612, "question": "Business records must be kept and made available for inspection by the Registrar of Contractors for a period of _____ after completion of a construction project or operation.", "choices": [{"pos": 0, "letter": "A", "text": "one year", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "two years", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "three years", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "five years", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Business records must be kept and made available for inspection by the Registrar of Contractors for a period of 5 years after completion of a construction project or operation.", "finished": false}, {"number": 59, "total": 120, "type": "single", "questionId": 60211, "question": "Construction or alteration of any building, highway, excavation, or other structure in the State of California requires a contractor’s license if the total cost of one or more contracts on the project is:", "choices": [{"pos": 0, "letter": "A", "text": "$150 or more in labor only", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$200 or more in materials only", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "over $1,000 in labor and materials", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "$1500 or more in labor only", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  All businesses or individuals who construct or alter any building, highway, road, parking facility, railroad, excavation, or other structure in California must be licensed by the California Contractors State License Board (CSLB) if the total cost (labor and materials) of one or more contracts on the project is over $1,000.", "finished": false}, {"number": 60, "total": 120, "type": "single", "questionId": 42614, "question": "When should a contractor renew the contractor’s license bond?", "choices": [{"pos": 0, "letter": "A", "text": "the day it expires", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10 days before it expires", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "30 days before it expires", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "within 30 days after it expires", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Tips for Avoiding Bond Suspension: The CSLB’s processing times can vary so plan ahead when purchasing a new bond. Be sure to renew your existing bond promptly. You should receive an invoice/renewal notice from your surety company prior to the bond expiration date. If you do not receive an invoice/renewal notice, contact your surety company or insurance agent. Remember, license renewal dates and bond renewal dates rarely coincide. Be sure to know each renewal date. If you receive a bond suspension notice from the CSLB, resolve the problem immediately. Keep your business address current with the CSLB so you receive notices regarding bond cancellations. Keep accurate records on your agent, surety company, bond numbers, effective dates and terms of the bonds. Remember, it is ultimately the responsibility of the contractor to make sure you are in compliance with the bond requirements.", "finished": false}, {"number": 61, "total": 120, "type": "single", "questionId": 42615, "question": "Equity is:", "choices": [{"pos": 0, "letter": "A", "text": "Liabilities plus Net Worth.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Current Assets plus Fixed Assets.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Fixed Assets less Current Assets.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Total Assets less Total Liabilities.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Equity is the difference between what your business is worth (your assets) minus what you owe on it (your debts and liabilities).", "finished": false}, {"number": 62, "total": 120, "type": "single", "questionId": 42616, "question": "A subcontractor who does not serve a preliminary notice on private works:", "choices": [{"pos": 0, "letter": "A", "text": "may not serve a stop notice but may file a mechanics’ lien", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "may not file a mechanics’ lien but may serve a stop notice", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "loses both stop notice and mechanics’ lien rights", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "loses nothing because subcontractors are not required to serve preliminary notices", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. On private works, the subcontractor must serve a preliminary notice within 20 days from first furnishing labor or materials.", "finished": false}, {"number": 63, "total": 120, "type": "single", "questionId": 42617, "question": "When an owner signs a receipt for a stop notice, it usually means the owner:", "choices": [{"pos": 0, "letter": "A", "text": "owes money to the contractor for labor and materials", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "recognizes that work will stop in 30 days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "owes the sub money", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "recognizes that a lien could be placed on funds", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. A stop notice is a notice given for the purpose of stopping, intercepting, or freezing funds that have not yet been paid on a construction project in an attempt to ensure payment.", "finished": false}, {"number": 64, "total": 120, "type": "single", "questionId": 42618, "question": "What possible reason would an owner have for requiring an unconditional lien release from a subcontractor?", "choices": [{"pos": 0, "letter": "A", "text": "The lien release protects the prime contractor.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A lien release informs the owner of progress on the job.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "A lien release provides for rights of cancellation.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The owner’s property covered by the release may not be liened.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A subcontractor who signs an Unconditional Waiver and Release form acknowledges payment and waives the right to file a lien against the owner’s property. A Unconditional Mechanic’s Lien Release is a legal document that should be considered a satisfied lien inasmuch as this specific type of release places no restrictions upon on the discharge of the owner’s property. Generally, this particular form would indicate that any legal financial instrument that has been used to complete payment for a release has cleared the institution. It may also mean that suitable arrangements have been made to clear the debt owed and that the holder of the lien requires no other steps to be completed, documentation or payment to be received in order for the lien to be considered a cleared lien.", "finished": false}, {"number": 65, "total": 120, "type": "single", "questionId": 71504, "question": "CSLB offers two free arbitration programs – a mandatory program for disputes involving alleged damages of  ____________.", "choices": [{"pos": 0, "letter": "A", "text": "$12,500", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$25,000", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$50,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$15,500", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. CSLB uses the mandatory arbitration process, when appropriate, to resolve complaints where the financial remedy will be $25,000 or less.", "finished": false}, {"number": 66, "total": 120, "type": "single", "questionId": 42620, "question": "A contractor usually will not be held liable for a supplier going on strike, but if your supplier did go on strike what should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Contact the owner immediately.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Contact the architect immediately.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Contact the general building contractor immediately.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Continue work as usual.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. The contractor usually will not be held liable for a supplier or sub going out on strike, but the contractor has an obligation to notify the owner as soon as possible. A strike is generally considered to be an excusable delay if it is unforeseen and beyond the contractor’s control.", "finished": false}, {"number": 67, "total": 120, "type": "single", "questionId": 42621, "question": "If, during excavation, you unearth human remains or burial artifacts at a construction site, what should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Notify the owner of the property.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Stop work and place a warning ribbon three feet from the remains around the perimeter of the site.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Stop work immediately at that site.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Stop work immediately at that site and any other nearby area that may have remains.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The CSLB Contractors License Law and Reference Book states, “Stop work immediately at that site and any nearby area reasonably suspected to have remains, and contact the County Coroner.”", "finished": false}, {"number": 68, "total": 120, "type": "single", "questionId": 42622, "question": "If you are planning to dig, drill, and bore at a job site, you should notify _____ before starting work.", "choices": [{"pos": 0, "letter": "A", "text": "DOSH", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "the Environmental Protection Agency", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the County Engineer", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the regional Underground Service Alert Notification Center", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A regional notification center is an association of owners and operators of subsurface installations (water, gas, electric, telephone, sewer, oil lines, etc.). Damage to underground structures may result in the disruption of essential services and pose a threat to workers, the public, and environmental safety. The purpose of the center is to provide a single telephone number that excavators can use to give the center’s members advance notification of their intent to excavate.", "finished": false}, {"number": 69, "total": 120, "type": "single", "questionId": 42623, "question": "Before beginning work, an employer or contractor must inquire whether asbestos is present in any building constructed prior to:", "choices": [{"pos": 0, "letter": "A", "text": "1975", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "1978", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "1985", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1990", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Although the manufacture and use of many asbestos-containing products was banned in the mid-1970s, some products were not banned until much later. This question is specifically asking about when a contractor is required to inquire if asbestos is present. California Labor Code Section 6501.9 states: “The contractor or employer shall first inquire of the owner if asbestos is present in any building or structure built prior to 1978.”", "finished": false}, {"number": 70, "total": 120, "type": "single", "questionId": 42624, "question": "Where must the supplier’s Safety Data Sheets (SDS) be kept?", "choices": [{"pos": 0, "letter": "A", "text": "at the job site", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at the office", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "they should be discarded", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "in a file cabinet", "isCorrect": false, "
