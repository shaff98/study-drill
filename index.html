wasSelected": true}], "checked": true, "explanation": "A. A Safety Data Sheet “SDS” (formerly Material Safety Data Sheet “MSDS”) provides information on hazardous chemicals.", "finished": false}, {"number": 71, "total": 120, "type": "single", "questionId": 42625, "question": "Is it legal for a contractor to require employees to take lie detector tests?", "choices": [{"pos": 0, "letter": "A", "text": "It is not legal for the contractor to require lie detector tests, but it would be legal for a federal, state, or local public agency to require lie detector tests of their employees.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "It is not legal for any employer to require lie detector tests.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "It is only legal for the contractor to require lie detector tests of employees who have criminal records.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It is legal for the contractor to require lie detector tests, but it would not be legal for a federal, state, or local public agency to do so.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Department of Labor administers and enforces the Employee Polygraph Protection Act of 1988 (the Act) through the Wage and Hour Division of the Employment Standards Administration. The Act generally prevents employers engaged in interstate commerce from using lie detector tests either for pre-employment screening or during the course of employment, with certain exemptions. Exemptions: Federal, state and local governments are excluded. In addition, lie detector tests administered by the Federal Government to employees of Federal contractors engaged in national security intelligence or counterintelligence functions are exempt.", "finished": false}, {"number": 72, "total": 120, "type": "single", "questionId": 42626, "question": "Sometimes contracts prove to be too vague to interpret without disagreement between owner and contractor. Which of the following steps would best prevent such problems?", "choices": [{"pos": 0, "letter": "A", "text": "Walk the job site with the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Review the plans and specifications with the owner.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Show the owner the critical path schedule.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Include a payment schedule in the contract.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. According to the references listed in the CSLB Study Guide, most disputes have to do with the plans and specifications.", "finished": false}, {"number": 73, "total": 120, "type": "single", "questionId": 42627, "question": "Funds withheld to guarantee completion of a project and correction of defects are called a(n):", "choices": [{"pos": 0, "letter": "A", "text": "remainder", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "umbrage", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "retention", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "stipulation", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Retention money is an amount held back from a payment made under a construction contract. … It is generally held to ensure that a contractor performs all of its obligations under the contract, and is then released either on practical completion or after the end of a defects notification period.", "finished": false}, {"number": 74, "total": 120, "type": "single", "questionId": 42628, "question": "Which of the following statements about home- improvement laws is NOT correct?", "choices": [{"pos": 0, "letter": "A", "text": "A subcontractor may give a salesperson a bonus.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A general contractor may give a salesperson a bonus.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "A subcontractor may not give the general contractor a bonus.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The homeowner may give the salesperson a bonus.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A home improvement salesperson may only accept a bonus from the contractor or subcontractor whom he or she represents. Also, contractors and subcontractors may not give one another bonuses for securing home improvement contracts.", "finished": false}, {"number": 75, "total": 120, "type": "single", "questionId": 42629, "question": "When you get an approved set of plans, what should you do first?", "choices": [{"pos": 0, "letter": "A", "text": "Calculate the square footage.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Call a material supplier.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Schedule the job.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Read any notes from the building department.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Once you get an approved set of plans, remember to read any notes from the building department before you move forward.", "finished": false}, {"number": 76, "total": 120, "type": "single", "questionId": 42630, "question": "You are bidding as a prime contractor on a public works project. The work will not involve construction, improvement, or repair of streets, highways, or bridges. You will use subcontractors for part of the work. If you do not name a subcontractor for any part of the work:", "choices": [{"pos": 0, "letter": "A", "text": "the contract is canceled", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "you will do that part of the work yourself", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "you may simply submit a name later", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the awarding authority will choose a subcontractor for you", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. According to the Subletting and Subcontracting Fair Practices Act, a contractor who fails to name a subcontractor for a portion of the work exceeding 1/2 of 1% of the total bid “agrees that the prime contractor is fully qualified to perform that portion themselves, and that the prime contractor shall perform that portion.”", "finished": false}, {"number": 77, "total": 120, "type": "single", "questionId": 42631, "question": "A contractor meets Mr. Jones at his home to discuss remodeling. The contractor and Mr. Jones sign a contract that includes a three-day cancellation form. After the contractor leaves, Mr. Jones decides not to have the work done. Instead of using the cancellation form, Mr. Jones sends the contractor a letter by first-class mail stating that he is canceling the contract. Is Mr. Jones’ cancellation effective?", "choices": [{"pos": 0, "letter": "A", "text": "No. Mr. Jones did not return the contract with the letter.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "No. Mr. Jones did not sign and return the cancellation form.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Yes. Mr. Jones’ letter does cancel the contract because it indicates his intention not to be bound by the contract.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "No. However, the letter would have canceled the contract had it been sent by certified or registered mail.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California is one of the states that gives consumers a “cooling off” period. You may have three to five days in which to cancel a contract by sending written notice to the other party….Typically, you must send a notice via certified mail by the third day.", "finished": false}, {"number": 78, "total": 120, "type": "single", "questionId": 42632, "question": "A general contractor has obtained bids from several subcontractors for a private project. He notices that one bid is substantially lower than the rest. Is it ethical and a good business practice for this contractor to inform the subcontractor that the bid is substantially lower than the bids of the other subcontractors?", "choices": [{"pos": 0, "letter": "A", "text": "No. It would be unethical for the contractor to inform any subcontractor that their bid is substantially lower than the other bids, even if the contractor believes that the subcontractor has made an error.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Yes. If the contractor believes that the subcontractor has made an error in compiling his bid, the contractor should disclose the amounts of the other subcontractors’ bids to the subcontractor.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Yes. If the contractor has reason to believe that the subcontractor has made an error in preparing his bid, the contractor should notify the subcontractor of the apparent error, but the contractor may not disclose the amounts of the other bids.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Is it ethical and a good business practice for this contractor to inform the subcontractor that the bid is substantially lower than the bids of the other subcontractors, especially if the contractor has reason to believe that the subcontractor has made an error in their bid. But the contractor may not disclose the amounts of the other bids.", "finished": false}, {"number": 79, "total": 120, "type": "single", "questionId": 42633, "question": "A contractor, on his own initiative, changed the design of a building and carried out the change. The owner rejected the change and stated that the building has lost market value. If the owner takes the contractor to court and obtains a favorable judgment, the owner is:", "choices": [{"pos": 0, "letter": "A", "text": "due the cost of repairs or the loss of market value", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "due any loss of profits", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "entitled to a new building", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "due only the loss of market value", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. In most cases, the courts will award the owner either the cost of repairs or the loss of market value, whichever is less.", "finished": false}, {"number": 80, "total": 120, "type": "single", "questionId": 42634, "question": "Of the following, which document is usually delivered first in a transaction involving a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "three-day notice of right to cancel", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "the contract", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Mechanics Lien Warning", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "20-day preliminary notice", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The “Mechanics Lien Warning” notice is required to be given to the client “prior to entering into a contract with an owner for work specified as home improvement or swimming pool construction.” NOTE: Not all Home Improvement contracts come with the “Mechanic Lien Warning” notice, as part of the Home Improvement contract package. Mechanic Lien Warnings can be purchased separately and also “The Three Day Right To Cancel” / “Three Day Right To Resend”. Always verify your Home Improvement Contracts have the Mechanic Lien Warning and The Day Right To Cancel legal forms as a complete package or separately combined to make a complete package.", "finished": false}, {"number": 81, "total": 120, "type": "single", "questionId": 42635, "question": "An applicant for a contractor’s license receives a notice from the Contractors’ State License Board, dated October 1, that the applicant passed the written exams. To receive an active license, the applicant must file a license bond and fee no later than:", "choices": [{"pos": 0, "letter": "A", "text": "31-Oct", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "29-Oct", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "30-Dec", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1-Jan", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. An applicant has 90 days from the date of the notice to file a license bond and fee. Remember that there are 31 days in October and 30 days in November. Count October 2 as Day 1.", "finished": false}, {"number": 82, "total": 120, "type": "single", "questionId": 42636, "question": "How many days does a contractor have to notify CSLB after being issued a workers’ compensation insurance policy?", "choices": [{"pos": 0, "letter": "A", "text": "5 days", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10 days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "30 days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "90 days", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Every licensed contractor must report, in writing, the name and address of the insurer carrying workers’ compensation on his or her employees to CSLB within 90 days after the issuance of any policy.", "finished": false}, {"number": 83, "total": 120, "type": "single", "questionId": 57622, "question": "How many times may you take the contractor’s license exam before your original application is voided?", "choices": [{"pos": 0, "letter": "A", "text": "as many times as necessary within 18 months", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "three times if you conform to scheduling", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "five times", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "an unlimited number of times", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  You have 18 months in which to pass your law and/or trade exam after your license application is accepted by the CSLB. After 18 months your application is considered void and a new application will have to be filed.\n\nFrom the CSLB: Re-Examination If you are required to take an examination, subject to some limitations, you have 18 months after the approval of your application in which to achieve a passing score on the exam(s). During that time, you may take the exam(s) as many times as needed within retesting guidelines. A $100 fee is required each time you reschedule an exam. (See BPC section 7074 for more detailed information on re-examinations.)", "finished": false}, {"number": 84, "total": 120, "type": "single", "questionId": 42638, "question": "You are the qualifier for an active contractor’s license. How do you inactivate the license?", "choices": [{"pos": 0, "letter": "A", "text": "Complete an Application to Inactivate Contractor’s License with CSLB.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Wait to receive the license renewal application and then do not pay the renewal fee.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Cancel the contractor’s license bond.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Nothing: The license will automatically become inactive when the license term expires.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Complete an application to Inactivate Contractor’s License. If you are unable to download and print the form, you can call and request that the form be mailed to you.", "finished": false}, {"number": 85, "total": 120, "type": "single", "questionId": 42639, "question": "The purpose of a “Preliminary 20-day Notice” for private work is to:", "choices": [{"pos": 0, "letter": "A", "text": "notify the owner that a lien has been placed on the property", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "notify the owner that the subcontractor/supplier making improvements to their property has the right to file a mechanic’s lien if not paid.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "make the owner aware of the provisions of the mechanics’ lien laws", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "waive the contractor’s or subcontractor’s lien rights", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. It should be noted the 2017 edition of the tests simply calls this the “Preliminary Notice” or Preliminary 20-Day Notice.” The old language was “20-Day Preliminary Notice.” Please see the below explanation. The purpose of the Preliminary Notice is to inform the property owner that the sender will begin improving the owner’s property by providing labor, services, equipment, and/or materials and has the right to record a mechanics lien if they are not paid. It should not be confused with the “Mechanics Lien Warning” that explains the mechanics lien laws.", "finished": false}, {"number": 86, "total": 120, "type": "single", "questionId": 62801, "question": "A Notice of Completion must be recorded (by the owner) within:", "choices": [{"pos": 0, "letter": "A", "text": "10 days after work is completed.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "20 days after work has ceased", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "30 days after work is completed", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "60 days after work has ceased", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": ".  Based on the 2023 CCLRB, Answer “A” is correct.\nThe 2023 Version of the California Contractors Law and Reference Book from the CSLB. On page 113 it states “The notice of completion must be recorded in the Office of the County Recorder of the county in which the site is located within 10 days after completion of the project.”\nThis is a point of contention though due to the 2024 CCLRB which was streamlined and has this portion missing and only alludes to prime contractors…”within 15 days after completion, you may record a Notice of Completion”….Section 3, page 53.\nWe are in the process of a complete update of Law and Business which will modify the question and answer to reflect 15 days as this is in the latest CCLRB update.\nPlease keep in mind that the Board is slow to make changes on the exams.", "finished": false}, {"number": 87, "total": 120, "type": "single", "questionId": 42641, "question": "A mechanics’ lien is a written document that must be signed and verified by the claimant. The first and third steps a contractor should take in filing a lien are listed below. Step 1: Obtain the exact legal description of the property. Step 2:_________? Step 3: Find out if the person requesting the work of improvement is the owner. What is Step 2?", "choices": [{"pos": 0, "letter": "A", "text": "Determine the amount of the lien claim.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Find out the name of the legal owner of the property as well as the percent of ownership.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "List the attorney representing the contractor.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "List the attorney representing the owner.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. According to the CSLB Contractors License Law and Reference Book, the second step is: “Determine the name of the owner and the extent of the owner’s interest in the property.”\n\nVerifying that the legal owner and the person actually requesting the work are the same person and have legal authority to authorize the work is an important step.\n\nThey are very similar, but differ in that the contractor must verify the person requesting the work also has the legal standing to authorize the work requested.", "finished": false}, {"number": 88, "total": 120, "type": "single", "questionId": 42642, "question": "When a notice of completion has been filed, the original contractor has _____ days to record a lien.", "choices": [{"pos": 0, "letter": "A", "text": "20", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "60", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "90", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Ordinarily, the original (prime) contractor has 90 days from completion of work to file a lien. However, if the owner files a Notice of Completion, the original contractor has only 60 days from recording of the notice to file a lien.", "finished": false}, {"number": 89, "total": 120, "type": "single", "questionId": 42643, "question": "A subcontractor or material supplier has _____ days to file a lien once a notice of completion has been recorded.", "choices": [{"pos": 0, "letter": "A", "text": "10", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "60", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "90", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. This notice reduces the amount of time a contractor has to record a mechanics lien from 90 to 60 days, and reduces the time a subcontractor or materials supplier has to record a mechanics lien from 90 days to 30 days.", "finished": false}, {"number": 90, "total": 120, "type": "single", "questionId": 42644, "question": "What does it mean when a subcontractor signs a waiver and release form on a public works project?", "choices": [{"pos": 0, "letter": "A", "text": "The subcontractor gives up the right to lien the real property.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The subcontractor gives up the right to lien the construction funds.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The subcontractor waives the right to lien the real property or the construction funds.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The subcontractor is no longer responsible for correcting defective work.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A stop notice is a lien on construction funds on a public works project. Public property is not subject to mechanics liens. Stop notices are available on California public works and private projects, making particularly useful since mechanics liens cannot be placed on public projects. A preliminary notice is a prerequisite. Failure to abide by all rules and steps could result in the stop notice being invalid.", "finished": false}, {"number": 91, "total": 120, "type": "single", "questionId": 42645, "question": "Is it legal for a contractor to hire professional strikebreakers to replace striking employees?", "choices": [{"pos": 0, "letter": "A", "text": "Yes. It is legal to hire professional strikebreakers.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "No. The contractor is subject to a maximum fine of $500 and/or a maximum jail sentence of 30 days.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "No. The contractor is subject to a maximum fine of $1,000 and/or a maximum jail sentence of 90 days.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The contractor has not committed a crime but may be subject to legal action.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Replacing employees with professional strikebreakers is a misdemeanor punishable by a fine of up to $1,000 and/or a jail sentence for up to 90 days.", "finished": false}, {"number": 92, "total": 120, "type": "single", "questionId": 42646, "question": "Is it legal for a contractor to pay employees in cash?", "choices": [{"pos": 0, "letter": "A", "text": "Yes, if the contractor provides each employee with a wage deduction statement semimonthly or at the time of each wage payment.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Yes, if the contractor provides each employee with Form W-2 at the end of the year.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "No, because an employee’s wages must be paid by a check with a wage deduction statement attached.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "No, unless the contractor obtains a receipt from each employee showing the amount of gross wages received.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. You are required to report all wages to the IRS, including those that are paid in cash. If you pay a worker in cash, you are still required to pay payroll taxes. Not doing so means you are paying the person “under the table,” which is illegal.", "finished": false}, {"number": 93, "total": 120, "type": "single", "questionId": 42647, "question": "A contractor hires a subcontractor to demolish a concrete wall. Who is responsible for supplying safety goggles?", "choices": [{"pos": 0, "letter": "A", "text": "Cal/OSHA", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "subcontractor", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "property owner", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The Labor Code distinguishes between employees and independent contractors. Assuming the subcontractor is properly licensed and insured and otherwise meets the legal criteria for status as an independent contractor, it would be the subcontractor’s responsibility to supply goggles.", "finished": false}, {"number": 94, "total": 120, "type": "single", "questionId": 42648, "question": "Some counties have an additional sales tax added to the base rate. Which of the following is a correct statement regarding this additional tax?", "choices": [{"pos": 0, "letter": "A", "text": "This additional tax does not apply to contractors.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "You do not have to pay this additional tax if your home office is in another county.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "You may pay the additional tax charged in your county if the rate is lower than the county where the materials were purchased.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "You must pay the additional tax in the county where the materials were purchased.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. As it applies to contractors, the Sales and Use Tax Law can be very confusing. Before starting your business, obtain a copy of Publication 9, “Construction and Building Contractors,” from the Board of Equalization.", "finished": false}, {"number": 95, "total": 120, "type": "single", "questionId": 42649, "question": "Where is the “Notice of Right to Cancel” found on a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "at the top of the page", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "near the client signature", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "in the middle of the page", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "on the back", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. On a home improvement contract, The Notice of Right to Cancel is located just above the signature section.", "finished": false}, {"number": 96, "total": 120, "type": "single", "questionId": 42650, "question": "How long does a client have to cancel a contract for repairs that are the result of an event for which a State of Emergency was declared?", "choices": [{"pos": 0, "letter": "A", "text": "5 business days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "5 calendar days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "7 business days", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "7 calendar days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "“C” is correct as per B&P 7159.10. Do not confuse with “State of Emergency” with an emergency situation such as a flooding pipe in a residence or light fixture shooting sparks in a living room. In that case a buyer can waive the 3 day period so that the contractor can correct the emergency situation.", "finished": false}, {"number": 97, "total": 120, "type": "single", "questionId": 42651, "question": "Which of the following is considered a direct cost?", "choices": [{"pos": 0, "letter": "A", "text": "office personnel", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "monthly rent for construction office", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "insurance policies", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "field superintendent", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. A direct cost is an expense that can be billed to a specific job like materials (e.g., wood, cement, sand) and wages for construction workers and superintendents supervising work.\n\nAn office building and office personnel are indirect costs that would be listed under overhead. A field superintendent supervises a specific job site and is considered a direct cost.\n\nThe time of a field superintendent can be accurately identified amongst the work projects that they monitor and is directly accounted for in direct expenses.", "finished": false}, {"number": 98, "total": 120, "type": "single", "questionId": 42652, "question": "Which act establishes the rights of workers to organize into unions and negotiate contracts?", "choices": [{"pos": 0, "letter": "A", "text": "Civil Rights Act of 1964", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Civil Rights Act of 1972", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Civil Rights Act of 1984", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "National Labor Relations Act of 1935", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The National Labor Relations Act of 1935 (also known as the Wagner Act) is a foundational statute of United States labor law which guarantees the right of private sector employees to organize into trade unions, engage in collective bargaining, and take collective action such as strikes.", "finished": false}, {"number": 99, "total": 120, "type": "single", "questionId": 42653, "question": "When is the last day a customer can cancel a Home-Improvement Contract that was signed on Friday, December 21st?", "choices": [{"pos": 0, "letter": "A", "text": "the following Friday", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the following Tuesday", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the following Wednesday", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the following Thursday", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C.  A customer has 3 business days to cancel a Home-Improvement Contract. A business day is any calendar day except Sundays and holidays. In this instance, the first business day is Saturday, December 22nd, and the second business day is Monday, December 24th. Tuesday, December 25th, is a holiday (Christmas), so the third business day is Wednesday, December 26th.\n\nNOTE: Sunday and Tuesday were not business days since Tuesday was a holiday. Correct answer is Wednesday midnight. You do not count the day the contract was signed.", "finished": false}, {"number": 100, "total": 120, "type": "single", "questionId": 42654, "question": "What is the maximum allowed travel distance from any point of a work area to a fire extinguisher?", "choices": [{"pos": 0, "letter": "A", "text": "25 feet", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "50 feet", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "75 feet", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "150 feet", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Portable fire extinguishers must be placed within 75 feet of work areas and be inspected monthly and serviced yearly. The maximum allowed distance between a fire extinguisher and a hot kettle is 50 feet. A kettle is classified as a Class B fire hazard. The maximum travel distance between fire extinguisher and a Class B fire hazard Is 50 feet.", "finished": false}, {"number": 101, "total": 120, "type": "single", "questionId": 42655, "question": "Why would a contractor have a case in the Unlimited Jurisdiction Superior Court?", "choices": [{"pos": 0, "letter": "A", "text": "if it is transferred from a Small Claims Court", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "if it is transferred from a Municipal Court", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "if it is a dispute of more than $25,000", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "if two or more parties are involved in the case", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Civil Court cases are divided into sections, depending on how much they’re worth. If your case is worth: More than $25,000, you can file in a court called an “Unlimited Jurisdiction Superior Court. $25,000 or less, you can file it in a court called a “Limited Jurisdiction Superior Court”. $10,000 or less (if you are filing as an individual) you can file your lawsuit in Small Claims Court. $5,000 or less (if you are filing as a business), you can file your lawsuit in Small Claims Court.", "finished": false}, {"number": 102, "total": 120, "type": "single", "questionId": 42656, "question": "When a subcontractor does work on a public works contract, the public agency considers the subcontractor to be:", "choices": [{"pos": 0, "letter": "A", "text": "an employee of the agency", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "a subcontractor of the agency", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "an employee of the prime contractor", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "a subcontractor of the prime contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. According to the Greenbook: Standard Specifications for Public Works Construction, subcontractors are considered employees of the prime contractor who is responsible for their work.", "finished": false}, {"number": 103, "total": 120, "type": "single", "questionId": 42657, "question": "Which building code should a contractor follow?", "choices": [{"pos": 0, "letter": "A", "text": "the most stringent code", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "national code", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "state code", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "local code", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Contractors should follow the building code applicable to the jurisdiction in which they plan to build. If in doubt, ask the building department", "finished": false}, {"number": 104, "total": 120, "type": "single", "questionId": 42658, "question": "What will happen if a contractor who is awarded the bid on a public works project pays less than the prevailing wage?", "choices": [{"pos": 0, "letter": "A", "text": "CSLB will permanently revoke the contractor’s license.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "CSLB will require arbitration.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor will be required to lower the bid within 24-hours.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The contractor will be required to pay back-wages to the employees.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Failure to pay the prevailing wages is grounds for assessment of back-wages and civil penalties.", "finished": false}, {"number": 105, "total": 120, "type": "single", "questionId": 42659, "question": "Who is ultimately responsible for seeing that safety equipment is actually put to use on the jobsite?", "choices": [{"pos": 0, "letter": "A", "text": "foreperson", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "lead person", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a specially designated employee", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The employer is responsible for making sure safety equipment is used and correcting any safety violations.", "finished": false}, {"number": 106, "total": 120, "type": "single", "questionId": 71938, "question": "Which of the following IS REQUIRED to be registered as a Home Improvement Salesperson?", "choices": [{"pos": 0, "letter": "A", "text": "Salesperson working in a shopping mall.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Salesperson who makes presentations at clients’ homes.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Salesperson working at the contractor’s office or showroom.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B.  Salesperson who makes presentations at clients’ homes.  An officer of a licensed corporation or LLC or a general partner of a licensed partnership need not be registered.  A salesperson whose negotiations are initiated by the buyer at a business that operates from a fixed location where goods and services are offered for sale is not required to be registered. Shopping malls and showrooms are fixed locations.  It should be noted that registration is not required for individuals who call prospective buyers for the exclusive purpose of scheduling appointments for registered salespersons.", "finished": false}, {"number": 107, "total": 120, "type": "single", "questionId": 42661, "question": "CSLB offers two free arbitration programs – a voluntary program for disputes involving alleged damages of between ________ and _________.", "choices": [{"pos": 0, "letter": "A", "text": "$12,000 and $50,000.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "$10,000 and $15,000.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$25,000 and $50,000", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$7,500 and $50,000", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Voluntary program is for disputes between $25,000 and $50,000. The Mandatory program is for disputes less than $25,000.", "finished": false}, {"number": 108, "total": 120, "type": "single", "questionId": 42662, "question": "Which of the following are the most effective when used together on a private works project?", "choices": [{"pos": 0, "letter": "A", "text": "stop payment notice and mechanics lien", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "notice of cessation and mechanics lien", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "preliminary notice and stop payment notice", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "notice of non-responsibility and mechanics lien", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Mechanics liens and stop payment notices may be used on private works. The mechanics lien is a lien on the property, and the stop payment notice is a lien on funds. A mechanics lien alone may not be sufficient. A lender’s deed of trust recorded prior to commencement of work would have priority over a mechanics lien or the owner’s equity in the property may be less than the amount stated in the lien. Note that the Prime Contractor may serve a stop payment notice only on the construction lender, not the property owner.", "finished": false}, {"number": 109, "total": 120, "type": "single", "questionId": 42663, "question": "What sort of notes are you looking for when you get a set of as-built plans?", "choices": [{"pos": 0, "letter": "A", "text": "abbreviations", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "changes", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "subdivisions", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "engineering", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Building departments require multiple copies of the plans be submitted for review. They also require that one set of the plans be kept on site to record the changes made during the construction process. These plans become the “as-built plans” and show the actual installed dimensions and locations of piping, ductwork, electrical wiring, ect..", "finished": false}, {"number": 110, "total": 120, "type": "single", "questionId": 42664, "question": "How must a client submit a claim for service or repair of a defect on fit and finish items after a remodel?", "choices": [{"pos": 0, "letter": "A", "text": "by certified mail", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "by overnight mail", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "by personal delivery", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "any of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A client may use the normal customer-service procedures agreed to between the client and the contractor, but the client must notify the contractor of the defect in writing by certified mail, overnight mail, or personal delivery before the client may file an action in court.", "finished": false}, {"number": 111, "total": 120, "type": "single", "questionId": 68994, "question": "When can a material supplier perfect a Mechanics Lien?", "choices": [{"pos": 0, "letter": "A", "text": "After the Prime Contractor accepts the material supplier’s bid.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "After the goods have been installed in the structure.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "After the goods have been delivered to the job site.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "A material supplier is not entitled to a lien.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The materials/goods must have been installed before a lien is perfected (lien foreclosure lawsuit). NOTE: “Perfect” in legal terms means to complete all necessary steps.", "finished": false}, {"number": 112, "total": 120, "type": "single", "questionId": 42666, "question": "When bidding on work, which of the following would you NOT include in the price of your bid?", "choices": [{"pos": 0, "letter": "A", "text": "overhead", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "worker’s compensation insurance premium", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "profit", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Worker’s compensation premiums are not figured as a separate item in a bid. However, the figure for labor should be based on an hourly rate that reflects the cost of worker’s compensation coverage, health insurance or retirement benefits, and other “hidden” labor costs.", "finished": false}, {"number": 113, "total": 120, "type": "single", "questionId": 42667, "question": "An owner should request waiver of lien rights for work on residential property after paying the full contract amount:", "choices": [{"pos": 0, "letter": "A", "text": "only if a lender is involved.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "to activate the home warranty.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "so the prime contractor will not file a lien.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "so the prime contractor, subcontractors, and other claimants will not file liens.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D.  Owners are advised to request a full and unconditional release from all claimants. CSLB notes on its website: “Be careful: paying your contractor (and / or getting a release from your contractor) does not guarantee that other claimants, like subcontractors and suppliers, are paid.\n\nCalifornia is a very litigious state and it’s good practice to get everything in writing.", "finished": false}, {"number": 114, "total": 120, "type": "single", "questionId": 42668, "question": "If a worker’s wages are garnished and the labor contract provides less protection than the State’s guidelines, what does the law require?", "choices": [{"pos": 0, "letter": "A", "text": "The worker must follow the terms of the labor contract.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "It depends on whether the employer has more than 20 employees.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The entire labor contract is void because it offers less protection than State guidelines.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The section of the contract providing less protection is void.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The provision of the contract that provides the employee with less protection is against public policy and is void, but it does not void the entire contract.", "finished": false}, {"number": 115, "total": 120, "type": "single", "questionId": 42669, "question": "If it is discovered that the construction materials in an area contain more than 0.1% asbestos:", "choices": [{"pos": 0, "letter": "A", "text": "the crew should try not to disturb the area but keep working.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the contractor should contact DOSH immediately.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the workers should stop and remove the materials wearing masks and gloves.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the crew should wet down the area with water and continue working.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Any manufactured material containing more than one-tenth of one percent (0.1%) asbestos by weight meets the definition of “asbestos-containing material”.” Even if the surface area of these materials is less than 100 square feet, the contractor must file a report with the Occupational Carcinogen Control Unit of DOSH.", "finished": false}, {"number": 116, "total": 120, "type": "single", "questionId": 42670, "question": "Which of the following provisions may not be included in a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "Owner must pay for materials after they are delivered.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Owner must pay for materials before they are delivered.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor may require a downpayment.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Owner may make progress payments.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The CONTRACTORS LICENSE LAW states: It is against the law for a contractor to collect payment for work not yet completed, or for materials not yet delivered. However, a contractor may require a downpayment.", "finished": false}, {"number": 117, "total": 120, "type": "single", "questionId": 72339, "question": "A public agency awards multiple small purchase orders to the same maintenance vendor throughout the fiscal year. Each individual purchase order is under $1,000, but the total combined cost for the year will exceed $1,000. Which of the following statements is true regarding California public works requirements?", "choices": [{"pos": 0, "letter": "A", "text": "You will not be subject to the prevailing wage law because each one is under $1000.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "You will be subject to the prevailing wage law only for the purchase order amounting to the most money.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "All individual purchase orders will likely be grouped together by the state and you will be subject to the prevailing wage law.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The district will evaluate each purchase order based on individual issuance dates.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. All individual purchase orders will likely be grouped together by the state and you will be subject to the prevailing wage law.  You must pay prevailing wages if those individual purchase orders (POs) are part of a continuous, single scope of work that collectively exceeds $1,000", "finished": false}, {"number": 118, "total": 120, "type": "single", "questionId": 42672, "question": "When there is a discrepancy between various parts of the contract documents, legal precedence establishes the _____________ as the governing document.", "choices": [{"pos": 0, "letter": "A", "text": "Specifications", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Agreement", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Plan Drawings", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Addenda", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. General Conditions within the contract cite the specific order so a dispute may be settled with the need for interpretation or arbitration. However, the legal precedent dictates that the Contract Agreement has priority, followed by the Specifications and Plan Drawings.", "finished": false}, {"number": 119, "total": 120, "type": "single", "questionId": 67653, "question": "The only means of determining how long the project will last and what the time-sensitive expenses will be is the _______________.", "choices": [{"pos": 0, "letter": "A", "text": "project meeting", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "project closeout", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "project submittal", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "project schedule", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The project schedule outlines the timeline of tasks and milestones, helping you determine both how long the project will last and when costs or resources will be needed.", "finished": false}, {"number": 120, "total": 120, "type": "single", "questionId": 42674, "question": "The employer is required to provide employee information, training, and certification as per T8 CCR. As required by T8 CCR, the employer shall ensure that all employees and supervisors that perform any lead-related construction work are trained by an accredited training provider and are then certified by the______________________.", "choices": [{"pos": 0, "letter": "A", "text": "Environmental Protection Agency (EPA)", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "California Department of Health Services", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "DOSH", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "CSLB", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. If you wish to become certified to do lead-related construction work in California, you must take training from one of the Department of Public Health’s (CDPH) accredited training providers. The Childhood Lead Poisoning Prevention Branch (CLPPB) staff manages a program to ensure that construction activities involving lead are performed in a manner to eliminate existing lead hazards, and to avoid creating new lead poisoning hazards for children and other occupants, as well as the workers themselves. The primary activities include: Evaluating and accrediting training providers who teach lead specialists how to find and abate lead hazards. Evaluating the qualifications of applicants for lead certification, and granting certification to those qualified to perform lead-related construction work in an effective and lead-safe manner.", "finished": false}], "law-bus-test-2": [{"number": 1, "total": 120, "type": "single", "questionId": 68744, "question": "In most public construction contracts, the retention may be held for up to ____ days as a guarantee that the prime pays the subcontractors and suppliers.", "choices": [{"pos": 0, "letter": "A", "text": "10", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "45", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "60", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "Answer “D” is correct according to CA Public Contract Code 7107 & 7201", "finished": false}, {"number": 2, "total": 120, "type": "single", "questionId": 42680, "question": "Who must pay for a pre-employment physical?", "choices": [{"pos": 0, "letter": "A", "text": "employer", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "employee", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "employer and employee", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "workers’ compensation insurer", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. ARTICLE 1. General Occupations [200 – 244]( Article 1 enacted by Stats. 1937, Ch. 90. ) 222.5. No person shall withhold or deduct from the compensation of any employee, or require any prospective employee or applicant for employment to pay, any fee for, or cost of, any pre-employment medical or physical examination taken as a condition of employment, nor shall any person withhold or deduct from the compensation of any employee, or require any employee to pay any fee for, or costs of, medical or physical examinations required by any law or regulation of federal, state or local governments or agencies thereof.", "finished": false}, {"number": 3, "total": 120, "type": "single", "questionId": 45806, "question": "Disregard or violation of statutes of the Business and Professions Code has increased from $5,000 to:", "choices": [{"pos": 0, "letter": "A", "text": "$5,500 to $15,000", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$6,000 to $15,500", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "$7,000 to $25,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$8,000 to $30,000", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Contractors: Disciplinary Action\n§7099.2 Regulations for assessment of civil penalties; Factors; Maximum amount; Letter of admonishment and §7110.\nExisting law provides for the licensure and regulation of contractors by the Contractors State License Board. Under existing law, willful or deliberate disregard by a licensed contractor of various state building, labor, and safety laws constitutes a cause for disciplinary action by the board. Existing law provides for related disciplinary proceedings, requires the board to promulgate regulations covering the assessment of civil penalties under those disciplinary provisions, and authorizes a civil penalty not to exceed $30,000 for specified violations.\nThis bill would provide that the list of violations that constitute cause for a disciplinary action by the board includes a willful or deliberate disregard of any state or local law relating to the issuance of building permits, and would authorize a civil penalty not to exceed $30,000 for any violation included on that above-specified list.", "finished": false}, {"number": 4, "total": 120, "type": "single", "questionId": 55285, "question": "Does an employer need to allow an employee to use/smoke marijuana?", "choices": [{"pos": 0, "letter": "A", "text": "if they’re sick", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "in a private place", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "if they use it outside", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "never", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Even though marijuana is legal in California, employers are allowed to have a drug-free workplace and to enforce zero-tolerance policies.", "finished": false}, {"number": 5, "total": 120, "type": "single", "questionId": 42681, "question": "In the absence of a collective bargaining agreement, two employees filed a written complaint with DOSH because of unsafe working conditions. The contractor discovered who the employees were and fired them because of the complaint. What would probably happen if the employees appealed the termination?", "choices": [{"pos": 0, "letter": "A", "text": "Nothing: A contractor may fire any employee for any reason.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Nothing: There is no appeals board for such cases.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor must reinstate the employees and reimburse them for lost wages and benefits.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The contractor must reinstate the employees but is not required to reimburse them for lost wages and benefits.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Under California law, workplace retaliation is unlawful if your employer punishes you for protected activities which include: reporting illegal conduct, refusing to engage in illegal conduct, reporting fraud, filing a wage claim with the California Labor Commissioner, unsafe working conditions, filing discrimination lawsuits, complaining of workplace discrimination or harassment and assisting other employees in filing a lawsuit or complaint of illegal activity in the workplace.", "finished": false}, {"number": 6, "total": 120, "type": "single", "questionId": 42559, "question": "By law, a “hard laborer” may not be younger than _____ years old.", "choices": [{"pos": 0, "letter": "A", "text": "14", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "15", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "16", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "17", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The Labor Code prohibits the employment of minors under 16 years of age for heavy work (hard labor) in the building trades. Minors are also prohibited from working in tunnels and excavations or on scaffolding.", "finished": false}, {"number": 7, "total": 120, "type": "single", "questionId": 61202, "question": "An owner of a building contracts with a licensed contractor to do a $900 improvement. When applying for a building permit, the contractor checks the owner-builder box on the declaration\nform. Which of the following statements is correct?", "choices": [{"pos": 0, "letter": "A", "text": "The contractor may check the box to avoid insurance charges.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The contractor should check the box so that the owner-builder verification will be mailed to the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor may check the box because the contractor is the owner’s employee.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The contractor may not check the owner-builder box because the owner contracted for the improvement.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Unless the contractor owns the property, the contractor is not an owner-builder. In this case the contractor agreed to do a $900 improvement. The only time the owner-builder box is checked is if the property owner intends to personally do the work or directly hire employees to do the work.", "finished": false}, {"number": 8, "total": 120, "type": "single", "questionId": 42683, "question": "A consumer may cancel a home solicitation contract at any time prior to midnight of the _____ after the date of the transaction.", "choices": [{"pos": 0, "letter": "A", "text": "2nd business day", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "3rd business day", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "5th business day", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "7th calendar day", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The contractor must provide you with information on your three-day right to cancel under the “Home Solicitation Sales Act” with your contract. This notice requires a seller of home goods or services to give the buyer three days to think about whether to buy the offered goods or services.", "finished": false}, {"number": 9, "total": 120, "type": "single", "questionId": 42684, "question": "After a home improvement contract is signed, the contractor must substantially begin work within _____ days of the date specified in the contract.", "choices": [{"pos": 0, "letter": "A", "text": "5", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "15", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "20", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. After a home improvement contract is signed, the contractor must substantially begin work within 20 days of the date specified in the contract.", "finished": false}, {"number": 10, "total": 120, "type": "single", "questionId": 42685, "question": "Where must a contractor include the “Mechanics Lien Warning?”", "choices": [{"pos": 0, "letter": "A", "text": "home improvement and service and repair contracts", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "home improvement contracts, including swimming pool contracts", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "home improvement, swimming pool, and service and repair contracts", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "public works contracts", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The Mechanics Lien Warning must be a part of a home improvement contract, including a swimming pool contract. The Mechanics Lien Warning is not required for service and repair contracts.", "finished": false}, {"number": 11, "total": 120, "type": "single", "questionId": 42686, "question": "When a joint control addendum is used, which of the following does not have to be included in a home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "owner’s signature", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "schedule of payments", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Notice to Owner", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "license number of the contractor", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. A payment schedule is not needed because the control agent disburses funds as each phase of the project is completed", "finished": false}, {"number": 12, "total": 120, "type": "single", "questionId": 42687, "question": "According to CA Construction Safety Orders how many toilet facilities must be provided for every 20 employees?", "choices": [{"pos": 0, "letter": "A", "text": "1 minimum", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "2 minimum", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "3 minimum", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "5 minimum", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. §1526. Toilets at Construction Jobsites. (a) A minimum of one separate toilet facility shall be provided for each 20 employees or fraction thereof of each sex. Such facilities may include both toilets and urinals provided that the number of toilets shall not be less than one half of the minimum required number of facilities.", "finished": false}, {"number": 13, "total": 120, "type": "single", "questionId": 68741, "question": "The “Mechanics Lien Warning” is given to:", "choices": [{"pos": 0, "letter": "A", "text": "inform the owner when work will begin and end", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "inform the owner that you are going to improve the property", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "let the owner know the property can be liened", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "let the owner know a mechanics’ lien has been filed against the property", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Consumers are required to receive a “Mechanics Lien Warning” about property liens. Anyone who helps improve property, but is not paid, may place what is called a Mechanics Lien on the property. A Mechanics Lien is a claim made against the property by the person who was not paid, and is recorded with the county.", "finished": false}, {"number": 14, "total": 120, "type": "single", "questionId": 42689, "question": "A contractor buys a construction firm from a person who is retiring. There is an existing collective bargaining agreement with a successor clause that is good for three years. As the new owner, is the contractor bound by the collective bargaining agreement?", "choices": [{"pos": 0, "letter": "A", "text": "No. The contractor never personally consented to the collective bargaining agreement.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "No. A successor clause in a collective bargaining agreement is not binding on a successor for more than a year.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "No. Successor clauses in collective bargaining agreements are illegal.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Yes. A successor clause in a collective bargaining agreement is binding on a successor for up to three years.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Collective bargaining agreements often include clauses extending their terms to successors (e.g., a person who buys the business after the collective bargaining agreement is signed by the original owner). However, the Labor Code limits successor clauses to three years.", "finished": false}, {"number": 15, "total": 120, "type": "single", "questionId": 42690, "question": "After the building plans are approved, what is the next step?", "choices": [{"pos": 0, "letter": "A", "text": "review the plans and estimate", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "hire employees", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "schedule the job", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "order materials", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The plans and estimate should always be reviewed before the job is scheduled, materials are ordered, etc. Pay particular attention to any notes made by the building department.", "finished": false}, {"number": 16, "total": 120, "type": "single", "questionId": 42691, "question": "Who is responsible for keeping track of change orders?", "choices": [{"pos": 0, "letter": "A", "text": "owner", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "foreperson", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "supervisor", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The contractor is responsible for keeping track of change orders. Change orders are required to perform extra or changed work. Change order forms become a part of the contract once the contractor and the homeowner sign them. The order must describe the scope of the extra work or change, the cost to be added or subtracted from the contract, and the effect the order will have on the schedule of progress payments. Change orders can also be written for the removal of items from the original agreement. All change orders must be in writing.", "finished": false}, {"number": 17, "total": 120, "type": "single", "questionId": 42692, "question": "How often should a job supervisor or responsible managing employee visit the job site?", "choices": [{"pos": 0, "letter": "A", "text": "once a day", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "once a week", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "once a month", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "whenever he is near the job site", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The job supervisor or responsible managing employee should visit the job site at least once a day.", "finished": false}, {"number": 18, "total": 120, "type": "single", "questionId": 42693, "question": "If you find that work done by a previous contractor is in violation of the local building code, what should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Repair the violation immediately.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Report the violation to the owner with an estimate for the needed repairs.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Report the violation directly to the building department.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The contractor may ignore the violation.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Any work found done by a previous contractor that is in violation of the local building code should be reported to the owner along with an estimate for the needed repairs.", "finished": false}, {"number": 19, "total": 120, "type": "single", "questionId": 42694, "question": "A contractor finds a 6″ discrepancy on a set of plans. The contractor should:", "choices": [{"pos": 0, "letter": "A", "text": "make the correction", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contact the owner", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "ignore the discrepancy because it is minor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "contact the architect or the building designer", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The contractor should first contact the person who prepared the plans. The architect or building designer would be the person who created the plans.", "finished": false}, {"number": 20, "total": 120, "type": "single", "questionId": 42695, "question": "As part of the safety training process, contractors’ supervisors are required to meet with management how often?", "choices": [{"pos": 0, "letter": "A", "text": "Meetings must be held weekly.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "They are required to meet monthly", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "When there is an accident at the job site.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "When a change order is executed and an accident happens.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. It is recommended that supervisors and management hold safety meetings at least once a month.", "finished": false}, {"number": 21, "total": 120, "type": "single", "questionId": 42697, "question": "The required Injury and Illness Prevention Program (IIPP) takes the form of:", "choices": [{"pos": 0, "letter": "A", "text": "a written plan", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "oral safety talks supplemented by a written plan", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "an oral or written plan approved by the contractor and an employee representative", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a written plan that includes procedures and that is put into practice and documented", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Employers in California are required to have an effective written Injury and Illness Prevention Program (IIPP). The benefits of an effective IIPP include improved workplace safety and health, better morale, increased productivity, and reduced costs of doing business.", "finished": false}, {"number": 22, "total": 120, "type": "single", "questionId": 42698, "question": "There is a near-miss safety situation on a job. What steps should the employer take?", "choices": [{"pos": 0, "letter": "A", "text": "Report the near-miss to DOSH.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Report the near-miss to the workers’ compensation insurance carrier.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The unsafe situation must be investigated, and the investigation must include a written report.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The unsafe situation must be investigated, but a written report is not required.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A Near Miss is an unplanned event that did not result in an injury or property damage, but had the potential to do so. … Near-miss reporting is vitally important in preventing serious incidents that are less frequent but more harmful than near-misses.", "finished": false}, {"number": 23, "total": 120, "type": "single", "questionId": 42699, "question": "How should the prime contractor determine whether a subcontractor has workers’ compensation insurance?", "choices": [{"pos": 0, "letter": "A", "text": "Subcontractors do not need workers’ compensation insurance.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The prime contractor should ask to see the expiration date on the sub’s certificate of insurance.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The prime contractor should periodically call the sub’s insurance agent to check on the sub’s policies.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The prime contractor should check with the Registrar’s office to see if the sub is insured.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The prime must determine, with “due diligence,” when the sub’s policy is in force by inspecting the sub’s certificate of insurance. The prime must check the expiration date of the policy as well as the date the certificate was issued. (An old certificate may no longer be valid: The policy may have lapsed.)", "finished": false}, {"number": 24, "total": 120, "type": "single", "questionId": 42700, "question": "An employer who receives a citation for a serious violation of Cal/OSHA regulations can be assessed a penalty of up to _____ for each violation.", "choices": [{"pos": 0, "letter": "A", "text": "$1,000", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$5,000", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$10,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$25,000", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. A serious violation carries a maximum fine of $25,000; PER CAL/OSHA", "finished": false}, {"number": 25, "total": 120, "type": "single", "questionId": 42701, "question": "Which of the following is not covered by standard contractor’s insurance policies?", "choices": [{"pos": 0, "letter": "A", "text": "employees’ tools", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor’s tools", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "damage from fire, storm, theft, and vandalism", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "job materials", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. An employees’ tools are not covered by a standard contractor’s insurance policy.", "finished": false}, {"number": 26, "total": 120, "type": "single", "questionId": 42702, "que
