 "question": "To clearly describe the contracted home improvement work, the contract should include the:", "choices": [{"pos": 0, "letter": "A", "text": "owners photographs", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "pictures of neighboring buildings", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "plans, specifications and materials to be used", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "history of similar projects completed by the contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The contract should describe, in detail, the products to be used and how the work will be performed, i.e., size, color, who will be doing what work, amounts of materials provided, manufacturer model number, etc.", "finished": false}, {"number": 48, "total": 120, "type": "single", "questionId": 43094, "question": "The plans and specifications of a home improvement project usually describe which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "layout sizes", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "liquidated damages", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "consent to arbitrate", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "neighborhood regulations", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Plans and specifications describe layouts, materials, etc.", "finished": false}, {"number": 49, "total": 120, "type": "single", "questionId": 43095, "question": "To ensure a clear understanding of the contractual parties’ commitments prior to signing the contract, both parties should critically review the:", "choices": [{"pos": 0, "letter": "A", "text": "suppliers list", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "building permits", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "requests for variance", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "plans and specifications", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Plans/Specifications should be as complete as possible, to avoid extra work claims, disputes.", "finished": false}, {"number": 50, "total": 120, "type": "single", "questionId": 43096, "question": "Including specific layouts, sizes, locations and materials on plans ensures a clear understanding of the contracted work to be done for the agreement of the:", "choices": [{"pos": 0, "letter": "A", "text": "contractor and owner", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor and lender", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "building inspector and lender", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "architect and building inspector", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The best way to avoid disputes over what is or isn’t expected from a home improvement job is to write out the details in a contract. The contract should be as specific as possible regarding all materials to be used, such as the quality, quantity, weight, color, size, or brand name as it may apply", "finished": false}, {"number": 51, "total": 120, "type": "single", "questionId": 43097, "question": "At what point in time should a home improvement contractor specifically explain the plans and specifications to the homeowner?", "choices": [{"pos": 0, "letter": "A", "text": "after starting the job", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "before the first pay draw", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "after signing the contract", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "before signing the contract", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A home improvement contractor must specifically explain the plans and specifications to the homeowner before either party signs the contract.", "finished": false}, {"number": 52, "total": 120, "type": "single", "questionId": 43098, "question": "Who should review the home improvement contract with the owner before signing a contract?", "choices": [{"pos": 0, "letter": "A", "text": "lender", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "contractor", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "plan checker", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "city inspector", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A contract should contain everything agreed upon by the consumer and contractor. Some of the provisions that your Home Improvement Contract must include are: The name, business address and license number of the contractor. The date the buyer signed the contract. A thorough description of the work to be done, including starting date and estimated completion date.", "finished": false}, {"number": 53, "total": 120, "type": "single", "questionId": 43099, "question": "Prior to signing a home improvement contract, a critical review of the plans and specifications is required by the:", "choices": [{"pos": 0, "letter": "A", "text": "homeowner and lender", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor and lender", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "homeowner and contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "building inspector and contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Prior to signing a home improvement contract, a critical review of the plans and specifications is required by the homeowner and contractor.", "finished": false}, {"number": 54, "total": 120, "type": "single", "questionId": 43100, "question": "Plans and specifications require critical review by the:", "choices": [{"pos": 0, "letter": "A", "text": "owner to check all the subcontractors", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "owner to check all the material suppliers", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor and owner to establish all the payment schedules", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "contractor and owner to establish an agreement on the work descriptions", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The best way to avoid disputes over what is or isn’t expected from a home improvement job is to write out the details in a contract. The contract should be as specific as possible regarding all materials to be used, such as the quality, quantity, weight, color, size, or brand name as it may apply", "finished": false}, {"number": 55, "total": 120, "type": "single", "questionId": 43101, "question": "After you have read the plans and specifications, what is the next important step in writing a bid?", "choices": [{"pos": 0, "letter": "A", "text": "Talk to and select subcontractors.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Walk the job site.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Call about materials, price, and availability.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Talk to the crew leader about labor.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The references listed in the CSLB Study Guide recommend that you review the plans and specifications and then do an on-site inspection (“walk the job site”). This is especially true for remodeling jobs.", "finished": false}, {"number": 56, "total": 120, "type": "single", "questionId": 43102, "question": "Which of the following should appear on the final construction plans and specifications?", "choices": [{"pos": 0, "letter": "A", "text": "supplier’s approval", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "subcontractor’s approval", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "approval of the city", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "property owner’s approval and signature", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. According to the California Building Standards Code, no building or structure may be erected, constructed, enlarged, altered, repaired, moved, improved, removed, converted or demolished unless a separate permit for each building or structure has first been obtained from the building official. Code requirements vary in different cities and counties around the state. Check with your local building department to find out what’s needed in your area. You may want to check city, county and/or town if necessary.", "finished": false}, {"number": 57, "total": 120, "type": "single", "questionId": 43103, "question": "A licensed contractor signs a home improvement contract for $9,500. What is the maximum down payment the contractor may receive?", "choices": [{"pos": 0, "letter": "A", "text": "$475", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "$500", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$950", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$1,200", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The down payment may not exceed $1,000 or 10% of the contract price, whichever is the least amount.", "finished": false}, {"number": 58, "total": 120, "type": "single", "questionId": 43104, "question": "Contractors must comply with the “Hazardous Waste Operations and Emergency Response Standards” These require:", "choices": [{"pos": 0, "letter": "A", "text": "The certification of employees and supervisors involved in hazardous substance removal work.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A qualified person who shall be responsible for scheduling any air sampling, laboratory calibration of sampling equipment evaluation of contaminated materials sampling results.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Holding a safety and health meetings for all hazardous substance removal jobs before the start of actual work.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Under the OSHA law, each employer is responsible for the safety and health of its workers and for providing a safe and healthful workplace. Employers must protect workers from anticipated hazards associated with participation in response and recovery operations for hazardous substances. Answers A, B and C would all be required under Hazardous Waste Operations and Emergency Response Standards", "finished": false}, {"number": 59, "total": 120, "type": "single", "questionId": 43105, "question": "A licensed contractor signs a home improvement contract for $19,800. What is the maximum down payment the contractor may receive?", "choices": [{"pos": 0, "letter": "A", "text": "$1,000", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$1,500", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$1,980", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$2,000", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. The down payment may not exceed $1,000 or 10% of the contract price, whichever is less.", "finished": false}, {"number": 60, "total": 120, "type": "single", "questionId": 43106, "question": "A down payment for a home improvement contract can be accepted by the contractor up to:", "choices": [{"pos": 0, "letter": "A", "text": "20% of the contract, if it is over $25,000", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30% of the contract, if there are special orders", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "any amount the owner and the contractor agree upon", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$1000 or 10% of the contract amount, whichever is less", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The down payment required by a Home Improvement Contract cannot be more than $1,000 or 10% of the contract amount, whichever is less.", "finished": false}, {"number": 61, "total": 120, "type": "single", "questionId": 43107, "question": "A joint control is a:", "choices": [{"pos": 0, "letter": "A", "text": "financial advisor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "joint personnel advisor", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "building inspection control service", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "builder’s construction control service", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A joint control is a builder’s construction control service, which acts as an escrow holder of a consumer’s money. A joint control company manages the disbursement of funds to prevent the contractor from being paid more than the value of the work already completed. A joint control also safeguards the consumer’s property from mechanics liens by requiring the contractor to supply lien releases as progress payments are made.", "finished": false}, {"number": 62, "total": 120, "type": "single", "questionId": 43108, "question": "A joint control allows the homeowner of a home improvement contract to control with a third party:", "choices": [{"pos": 0, "letter": "A", "text": "job inspections", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "construction funds", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "construction time lines", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "materials, shapes and sizes", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Joint control is the contractually agreed sharing of control of an arrangement, which exists only when decisions about the relevant activities require the unanimous consent of the parties sharing control.", "finished": false}, {"number": 63, "total": 120, "type": "single", "questionId": 43109, "question": "A joint control company is:", "choices": [{"pos": 0, "letter": "A", "text": "the primary construction lender", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "owned by the general contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the mortgage company for the homeowner", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a service which acts as an escrow holder for construction funds", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Control of the items that make up an estate by a bonding company, also known as a surety, and an administrative party, such as an executor, known as the fiduciary. Any funds are put in joint accounts and dispensed only with the consent of both the surety and the fiduciary.", "finished": false}, {"number": 64, "total": 120, "type": "single", "questionId": 43110, "question": "A builder’s construction control service primarily acts as an:", "choices": [{"pos": 0, "letter": "A", "text": "payroll service", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "independent cost analyst", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "architect reference service", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "escrow holder of a consumer’s contract money", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A joint control is a builder’s construction control service, which acts as an escrow holder of a consumer’s money. A joint control company manages the disbursement of funds to prevent the contractor from being paid more than the value of the work already completed. A joint control also safeguards the consumer’s property from mechanics liens by requiring the contractor to supply lien releases as progress payments are made.", "finished": false}, {"number": 65, "total": 120, "type": "single", "questionId": 43111, "question": "A joint control company manages the:", "choices": [{"pos": 0, "letter": "A", "text": "time and materials costs", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "home improvement contract writing", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "disbursement of construction funds", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "contractor’s personal business also", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Control of the items that make up an estate by a bonding company, also known as a surety, and an administrative party, such as an executor, known as the fiduciary. Any funds are put in joint accounts and dispensed only with the consent of both the surety and the fiduciary.", "finished": false}, {"number": 66, "total": 120, "type": "single", "questionId": 43112, "question": "The Truth in Lending Act applies to home improvements when:", "choices": [{"pos": 0, "letter": "A", "text": "the dwelling is a rental", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "the dwelling is over 10 years old", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the contracted project is over $10,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a security interest in the home applies", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The federal Truth in Lending Act provides a three-day rescission (cancellation) period for home improvements that are to be financed and involve a security interest in the buyer’s home.", "finished": false}, {"number": 67, "total": 120, "type": "single", "questionId": 43113, "question": "Contract bonds guarantee", "choices": [{"pos": 0, "letter": "A", "text": "the projects completion.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "assure the property owner that no liens for labor and material will be filed against the property.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "guarantee both job completion and payment of all labor and materials.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "to cover any project the contractor agrees to perform.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. A contract bond is a type of surety bond that guarantees that a contract will be fulfilled. The CSLB’s definition includes a bond that guarantees job completion and payment of all labor and material bills. Here’s a quick list of the different job related bonds. There are four major types of surety bonds: 1. Bid Bond: Guarantees that the bidder on a contract will enter into the contract and furnish the required payment and performance bonds if awarded the contract. 2. Contract Bond: Guarantees both job completion and payment of all labor and materials. 3. Payment Bond: Guarantees that suppliers and subcontractors will be paid for work performed under the contract. 4. Performance Bond: Guarantees that the contractor will perform the contract in accordance with its terms and conditions.", "finished": false}, {"number": 68, "total": 120, "type": "single", "questionId": 43114, "question": "Truth in Lending Act rescission rights apply when:", "choices": [{"pos": 0, "letter": "A", "text": "any loan is signed for any home improvement work", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "the dollar amount of the contract exceeds $20,000", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a home improvement salesperson procured the contract", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a nonpurchase lien or security interest is taken in the consumer’s principal dwelling", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. TILA Violations Allowing Rescission The more significant TILA violation for borrowers, especially those facing foreclosure, is the right of rescission. “Rescinding” the loan means the borrower can void the loan as if it was never made. A borrower’s right to rescind applies to consumer credit transactions in which a non-purchase money lien or security interest exists on the consumer’s principal dwelling. (15 U.S.C. § 1635[a]). In order for the right to rescind to apply in any given situation, the lien must be on a borrower’s primary residence and the transaction must involve a non-purchase money loan. The most common kinds of rescindable loans are home equity mortgages and refinances.", "finished": false}, {"number": 69, "total": 120, "type": "single", "questionId": 43115, "question": "Waiver to the Business and Professions Code Section 7163 Truth in Lending Act rescission is permitted if the:", "choices": [{"pos": 0, "letter": "A", "text": "weather prohibits starting on time", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contract work is extended for additions", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor does not agree with the buyer on workmanship", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "waiver is written and signed by the owner of the property and the work is for emergency repairs", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The right of rescission is a right, set forth by the Truth in Lending Act (TILA) under U.S. federal law, of a borrower to cancel a home equity loan or line of credit with a new lender, or to cancel a refinance transaction done with another lender other than the current mortgagee, within three days of closing. The right is provided on a no-questions-asked basis, and the lender must give up its claim to the property and refund all fees within 20 days of exercising the right of rescission.", "finished": false}, {"number": 70, "total": 120, "type": "single", "questionId": 43116, "question": "For which of the following types of construction contracts does the Business and Professions Code Section 7165 allow substitute provisions, if the job is to be financed by a third party lender?", "choices": [{"pos": 0, "letter": "A", "text": "roofing job", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "landscaping job", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "swimming pool job", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "heating and air conditioning job", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The requirements of this section may be substituted for the requirements of paragraphs (1), (2), and (3) of subdivision (a) of Section 7163 if a swimming pool contract is to be financed by a third-party lender and if all the following conditions are met: (a)The lender has agreed, in writing, to provide financing to the buyer for the maximum estimated construction cost of the swimming pool. (b)The lender has provided the buyer a written copy of the terms and conditions of the loan for the maximum estimated construction cost of the swimming pool, including the following terms disclosed in the manner required by the federal Truth in Lending Act and Regulation Z: the annual percentage rate, the finance charge, the amount financed, the total number of payments, the payment schedule, and a description of the security interest to be taken by the lender. (c)The lender has agreed in writing to the following: (1)To offer to loan the maximum estimated construction cost on the terms and conditions disclosed pursuant to subdivision (b). (2)If the construction cost of the swimming pool is determined after the completion of excavation to be less than the maximum estimated construction cost, to offer to loan the lesser amount needed to complete the construction of the swimming pool on the same security as, and at an annual percentage rate and monthly payment amount not to exceed, that disclosed in subdivision (b). The lender’s written agreement shall state the duration of the offer, which shall not be less than 15 days following the completion of the excavation of the swimming pool.", "finished": false}, {"number": 71, "total": 120, "type": "single", "questionId": 43117, "question": "When there is a third party lender, a contractor may enforce the home improvement contract after three business days from the:", "choices": [{"pos": 0, "letter": "A", "text": "salesperson turning in a signed contract.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor and buyer signing the contract.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "buyer submitting the loan package to the lender.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "date the loan and the contract are completed and accepted by the buyer.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The contractor may not deliver materials or perform services until three business days from the date the contract and loan are completed and accepted by the buyer. When there is a third party lender, a contractor can enforce the home improvement contract after 3 business days from the date the loan and the contract are completed and accepted by the buyer.", "finished": false}, {"number": 72, "total": 120, "type": "single", "questionId": 43118, "question": "When there is a third party lender, once the transaction is completed and accepted by the homeowner, the homeowner may cancel:", "choices": [{"pos": 0, "letter": "A", "text": "until the first draw", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "within 3 business days", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "within 5 business days", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "until the job is started", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Unless the contract is negotiated at the contractor’s place of business, and/or the contract price is under $25, the buyer qualifies for a three-day right to cancel. The contractor must provide information of three-day right to cancel under the “Home Solicitation Sales Act” with a contract.", "finished": false}, {"number": 73, "total": 120, "type": "single", "questionId": 43120, "question": "When there is a third party lender, the contract is unenforceable against the buyer per the Business and Professions Code 7163 Truth in Lending Act, if the:", "choices": [{"pos": 0, "letter": "A", "text": "buyer rescinds the loan within 3 business days", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "funding is provided by a government loan or grant", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "home improvement contract is sold by a salesperson", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "owner decides that a competing contractor will finish the remaining work for less than the amount stated in the contract", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. California’s Business and Professions Code section 7163 – adds to the federal Truth in Lending Act’s consumer protections during the three-business-day cancellation period, and in situations where the contract is not enforceable.", "finished": false}, {"number": 74, "total": 120, "type": "single", "questionId": 43121, "question": "When there is a third party lender, the rescission provisions of Business and Professions Code 7163 Truth in Lending Act apply, if the:", "choices": [{"pos": 0, "letter": "A", "text": "improvement contract is sold by a salesperson", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "funds are to be provided by any government agency", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "value of the home improvement contract exceeds $10,000", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "obtainment of a loan is a condition precedent to the home improvement contract", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. No contract for home improvement shall be enforceable against the buyer if the obtaining of a loan for all or a portion of the contract price is a condition precedent to the contract or if the contractor provides financing, or in any manner assists the buyer to obtain a loan or refers the buyer to any person who may loan or arrange a loan for all or a portion of the contract price unless all of the following requirements are satisfied:", "finished": false}, {"number": 75, "total": 120, "type": "single", "questionId": 43122, "question": "All salespersons who solicit home improvements must be:", "choices": [{"pos": 0, "letter": "A", "text": "insured with a surety company", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "licensed by a general contractor", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "certified by the Contractors State License Board", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "registered with the Contractors State License Board", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A “home improvement salesperson” (HIS) is defined in Business and Professions Code (BPC) section 7152 as a person who is employed by a licensed contractor to solicit, sell, negotiate or execute contracts for which home improvements may be performed, a swimming pool, hot tub or spa constructed, or home improvement goods or services installed or furnished. You must register with CSLB if you solicit, sell, negotiate or execute home improvement contracts for a licensed contractor (regardless of the dollar amount of those contracts), with limited exceptions.", "finished": false}, {"number": 76, "total": 120, "type": "single", "questionId": 43123, "question": "A home improvement salesperson must put his or her:", "choices": [{"pos": 0, "letter": "A", "text": "name on the loan papers", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "name on the city inspection card", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "registration number on the contract", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "registration number on the completion notice", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A Home Improvement Construction Contract must contain the name and registration number of the home improvement salesperson that solicited or negotiated the contract if applicable.", "finished": false}, {"number": 77, "total": 120, "type": "single", "questionId": 43124, "question": "If a home improvement salesperson’s commission was 10%, what would the commission be on a $10,000 job with a $1000 deposit?", "choices": [{"pos": 0, "letter": "A", "text": "$10", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "$100", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$500", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$1,000", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "If a home improvement salesperson’s commission was 10%, what would the commission be on a $10,000 job with a $1000 deposit would be $1,000.", "finished": false}, {"number": 78, "total": 120, "type": "single", "questionId": 43125, "question": "A home improvement salesperson who sells a home improvement project must include what information on the contract?", "choices": [{"pos": 0, "letter": "A", "text": "material suppliers’ names", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "salesperson’s insurance company name", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "salesperson’s name and registration number", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "salesperson’s name and certification number", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The contract must contain the name, business address and license number of the contractor and if a salesperson was involved, their name and registration number.", "finished": false}, {"number": 79, "total": 120, "type": "single", "questionId": 43126, "question": "Following the completion of a home improvement project of a major phase of construction and upon payment, who is responsible for signing a labor lien release?", "choices": [{"pos": 0, "letter": "A", "text": "homeowner", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "each worker", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "subcontractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The reverse side of many Waiver and Release forms will include a statement like, “The Undersigned have performed labor for wages on the project described on face of form and have been paid in full to date.” There are lines below the statement for individual workers to sign and date the form.", "finished": false}, {"number": 80, "total": 120, "type": "single", "questionId": 43127, "question": "What type of lien release is required upon completion of a home improvement contract and payment?", "choices": [{"pos": 0, "letter": "A", "text": "temporary waiver", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "conditional release", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "preliminary waiver and release", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "unconditional waiver and release", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Unconditional Waiver and Release: This document waives and releases lien, stop payment notice, and payment bond rights the claimant has for all labor and service provided, and equipment and material delivered, to the customer on this job. Rights based upon labor or service provided, or equipment or material delivered, pursuant to a written change order that has been fully executed by the parties prior to the date that this document is signed by the claimant, are waived and released by this document, unless listed as an Exception below. The claimant has been paid in full.", "finished": false}, {"number": 81, "total": 120, "type": "single", "questionId": 43128, "question": "A subcontractor for a home improvement project decides to file a mechanics’ lien after failing to receive payment for work performed. With which of the following is this mechanics’ lien filed?", "choices": [{"pos": 0, "letter": "A", "text": "Department of Labor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "County Recorders Office", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Contractors State License Board", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "City Planning and Building Department", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A lien is an encumbrance that makes property security for the payment of a debt or discharge of an obligation. The Registrar-Recorder/County Clerk (RR/CC) serves notification by mail to debtors when an involuntary lien is recorded against them. An involuntary lien is a lien that a property owner did not sign.", "finished": false}, {"number": 82, "total": 120, "type": "single", "questionId": 43129, "question": "A Preliminary 20-Day Notice” for a home improvement project is used to:", "choices": [{"pos": 0, "letter": "A", "text": "obtain a building permit", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "obtain financing for the project", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "protect the contractor against financial loss", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "alert the homeowner that the sub-contractor or supplier are preserving their lawful rights potentially to take certain legal actions to recover debts if they go unpaid.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A subcontractor or material supplier has 20 days after beginning work or delivering materials to serve you a Preliminary Notice. If the notice is late, the claimant loses lien rights for work done or materials delivered more than 20 days before the notice. The claim against your property is only valid for work done or supplies delivered 20 days before notice was given and anytime thereafter.", "finished": false}, {"number": 83, "total": 120, "type": "single", "questionId": 43130, "question": "Who of the following may require the contractor to obtain a performance and payment bond?", "choices": [{"pos": 0, "letter": "A", "text": "liability insurer", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "tenant", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "subcontractor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Contractors State License Board", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A tenant who has a direct contract for tenant improvements for which the landlord will not be responsible may require a performance and payment bond. Tenant improvements (“TI’s”) are common in commercial leases.", "finished": false}, {"number": 84, "total": 120, "type": "single", "questionId": 43131, "question": "Payment and performance bond information is contained within the:", "choices": [{"pos": 0, "letter": "A", "text": "loan documents", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Mechanics Lien Warning", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "warranty information", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Home Improvement contract", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Performance bond definition: A type of contract surety bond which guarantees that a principal will fulfill their contractual obligations under a project. Payment bond definition: A type of contract surety bond which guarantees that a contractor or subcontractor will pay their subcontractors, material suppliers or laborers for the work and materials provided.", "finished": false}, {"number": 85, "total": 120, "type": "single", "questionId": 43132, "question": "When a homeowner requests that the contractor obtain a payment and performance bond, the owner is wanting coverage for:", "choices": [{"pos": 0, "letter": "A", "text": "materials, labor and supplies", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "equipment, tools and supplies", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "personal injury, overhead and equipment", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "property damage, personal injury and acts of God", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. In the construction industry, the payment bond is usually issued along with the performance bond. The payment bond forms a three-way contract between the owner, the contractor and the surety, to make sure that all subcontractors, laborers, and material suppliers will be paid leaving the project lien free.", "finished": false}, {"number": 86, "total": 120, "type": "single", "questionId": 43133, "question": "When a licensed contractor obtains a payment and performance bond, which of the following would be one of the things the contractor has covered?", "choices": [{"pos": 0, "letter": "A", "text": "permits", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "rentals", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "overhead", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "materials", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Performance bond definition: A type of contract surety bond which guarantees that a principal will fulfill their contractual obligations under a project. Payment bond definition: A type of contract surety bond which guarantees that a contractor or subcontractor will pay their subcontractors, material suppliers or laborers for the work and materials provided.", "finished": false}, {"number": 87, "total": 120, "type": "single", "questionId": 43134, "question": "When a contractor furnishes a performance and payment bond for a home improvement project, it is not necessary for a contractor to provide which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "lien notices", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "agreed contract price", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "arbitration clause notice", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "schedule of payments and specifications", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. In the construction industry, the payment bond is usually issued along with the performance bond. The payment bond forms a three-way contract between the owner, the contractor and the surety, to make sure that all subcontractors, laborers, and material suppliers will be paid leaving the project lien free.", "finished": false}, {"number": 88, "total": 120, "type": "single", "questionId": 43135, "question": "When a licensed contractor obtains a payment and performance bond, which of the following would be one of the things the contractor has covered?", "choices": [{"pos": 0, "letter": "A", "text": "labor", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "equipment", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "personal injury", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "property damage", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. In the construction industry, the payment bond is usually issued along with the performance bond. The payment bond forms a three-way contract between the owner, the contractor and the surety, to make sure that all subcontractors, laborers, and material suppliers will be paid leaving the project lien free.", "finished": false}, {"number": 89, "total": 120, "type": "single", "questionId": 43136, "question": "Latent defects are:", "choices": [{"pos": 0, "letter": "A", "text": "illegal contracts", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "the owner’s responsibility", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the lender’s responsibility", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Hidden defects that may take much time to discover and can be costly.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A latent defect exists at the time of construction but is undetected until after (sometimes years after) construction is completed and the structure and its systems are in use. An example would be a structural beam that meets the specified size, color and grade requirements, but is understrength.", "finished": false}, {"number": 90, "total": 120, "type": "single", "questionId": 43137, "question": "What is the statute of limitations for a consumer’s complaint on latent defects?", "choices": [{"pos": 0, "letter": "A", "text": "2 years", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "4 years", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "5 years", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10 years", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. If the defect causes injury or property damage in the fourth year, the action can be brought on that defect for one year from the date of injury. Section 337.15 requires an action based on a “latent defect” be brought within ten years of substantial completion.", "finished": false}, {"number": 91, "total": 120, "type": "single", "questionId": 43138, "question": "How long can a licensed contractor be liable for latent defects?", "choices": [{"pos": 0, "letter": "A", "text": "2 years", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "4 years", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "5 years", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "10 years", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. If the defect causes injury or property damage in the fourth year, the action can be brought on that defect for one year from the date of injury. Section 337.15 requires an action based on a “latent defect” be brought within ten years of substantial completion.", "finished": false}, {"number": 92, "total": 120, "type": "single", "questionId": 43139, "question": "When asbestos is found in a home improvement project, who is responsible for the abatement?", "choices": [{"pos": 0, "letter": "A", "text": "homeowner", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "city inspector", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Department of Building Safety", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Anyone with responsibility for a building containing asbestos has a ‘duty to manage’ the asbestos, under the Control of Asbestos Regulations (CAR) 2012.", "finished": false}, {"number": 93, "total": 120, "type": "single", "questionId": 43140, "question": "“Asbestos-containing construction material” means any manufactured construction material which contains more than ______________ asbestos by weight?", "choices": [{"pos": 0, "letter": "A", "text": "1/2 of one percent", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1/3 of one percent", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "1/100 of one percent", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "one-tenth of one percent", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. “Asbestos containing construction materials” means any manufactured construction material which contains more than 1/10th of 1% asbestos by weight.", "finished": false}, {"number": 94, "total": 120, "type": "single", "questionId": 43141, "question": "A contractor discovers the presence of hazardous material during construction and immediately notifies the homeowner and stops work. After the hazardous materials are properly abated the:", "choices": [{"pos": 0, "letter": "A", "text": "lender should be notified.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "building inspector should be notified.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor should be notified by the homeowner in writing.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Environmental Protection Agency should be notified by the contractor.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The homeowner is responsible for ensuring that hazardous materials abatement is completed and for notifying the contractor in writing.", "finished": false}, {"number": 95, "total": 120, "type": "single", "questionId": 43142, "question": "When a job requires the contractor to pressure wash paint from an older home, it is best for the contractor to inform the homeowner about the possible existence of lead paint material issues:", "choices": [{"pos": 0, "letter": "A", "text": "at their first meeting", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "only if lead is discovered", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "at the completion of the job", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "at the signing of the contract", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. A contractor should always inform the home owner of any hazardous materials at their first meeting.", "finished": false}, {"number": 96, "total": 120, "type": "single", "questionId": 43143, "question": "When remodeling an older home it is best for the contractor to inform the homeowner about the possible existence of asbestos materials:", "choices": [{"pos": 0, "letter": "A", "text": "at their first meeting", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "as the job progresses", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "when the contract is signed", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "at the completion of the job", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A contractor should always inform the home owner of any hazardous materials at their first meeting.", "finished": false}, {"number": 97, "total": 120, "type": "single", "questionId": 43144, "question": "When lead paint is found in a home improvement project, who is responsible for the abatement?", "choices": [{"pos": 0, "letter": "A", "text": "homeowner", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "city inspector", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Department of Building Safety", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. When lead paint is found in a home improvement project, the homeowner is responsible for the abatement.\n\nIt is up to the homeowner to do their due diligence in selecting a contractor that will have the experience and knowledge to properly address any lead paint issues, so it falls back on the homeowner as far as general responsibility.", "finished": false}, {"number": 98, "total": 120, "type": "single", "questionId": 43145, "question": "The Contractors State License Board has authority to enforce the:", "choices": [{"pos": 0, "letter": "A", "text": "contractor’s warranties", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "manufacturer’s warranties", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "lender’s rates of interest", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "consumer’s change of plans", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. In California, there is a “one year expressed limited warranty” provided under California Civil Code 900. This is a one year implied warranty for both new construction and remodeling projects.", "finished": false}, {"number": 99, "total": 120, "type": "single", "questionId": 43146, "question": "Net working capital is:", "choices": [{"pos": 0, "letter": "A", "text": "your total investment in the business.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the difference between current assets and current liabilities.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the difference between total assets and total liabilities.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "the difference between profit and loss.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Net working capital (NWC) is the difference between a company’s current assets and current liabilities. A positive net working capital indicates a company has sufficient funds to meet its current financial obligations and invest in other activities.", "finished": false}, {"number": 100, "total": 120, "type": "single", "questionId": 43147, "question": "Unresolved conflicts will result in extra costs and lost time for which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "The client.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The contractor.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The state.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Unresolved conflicts will result in extra costs and lost time for everyone involved.", "finished": false}, {"number": 101, "total": 120, "type": "single", "questionId": 43148, "question": "If you are working on a DIFFICULT phase of a project and the owner comes to you with a complaint about the windows you have installed, what do you do?", "choices": [{"pos": 0, "letter": "A", "text": "Acknowledge the complaint and tell the owner you will be right with him as soon as possible.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Stop what you are doing and deal with the owner’s complaint.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Have your foreman handle the complaint.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Turn the complaint over to the Contractor’s Board.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Please read the question carefully. There is one question that is asking about a DIFFICULT point in a project. The other question asking about a CRITICAL point in a project. Difficult: not easy to do. You can stop and answer to the owner’s question. Critical: very important; very serious or dangerous. You cannot answer at this very moment due to a serious or dangerous point in the project. You should always try to respond the owner as quickly as possible.", "finished": false}, {"number": 102, "total": 120, "type": "single", "questionId": 43149, "question": "Subcontractors are selected on the basis of ________________.", "choices": [{"pos": 0, "letter": "A", "text": "their references.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the lowest bid.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "their ability to perform the job well, on time and their cost.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "availability.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Selection of the best sub-contractor is a vital process in construction projects. There are many factors that must be taken into consideration when selecting sub-contractors. Improper selection of sub-contractors might lead to many problems during work progress. These include bad quality of work, and delay in project duration. Get referrals. You can find a subcontractor by asking people who have had work done if they would recommend the person who did it. For example, someone in your neighborhood might have had electrical work performed or had a new roof installed. Ask for the name of the person who did the work. Avoid choosing only based on price. Your first instinct might be to pick the person who offered the lowest bid. There is no reason to follow this strategy. In fact, picking the person with the lowest bid could work against you. Check the subcontractor’s experience. You want the sub to provide sufficient information about their volume of work and average job size. You are looking for a “good fit,” i.e., someone who handles projects similar in size and scope as yours.", "finished": false}, {"number": 103, "total": 120, "type": "single", "questionId": 43150, "question": "Which of the following BEST helps a contractor to bring together materials and labor at the proper time?", "choices": [{"pos": 0, "letter": "A", "text": "Bar chart.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Critical path method.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Accrual method.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The punch card.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The critical path method (CPM) is a step-by-step project management technique for process planning that defines critical and non-critical tasks with the goal of preventing time-frame problems and process bottlenecks. … Determine the expected completion or execution time for each task. The critical path method (CPM) is a popular scheduling technique in the construction industry due to its simplicity and effectiveness. It generates a graphical view of a project and calculates how much time and resources are required to complete each activity.", "finished": false}, {"number": 104, "total": 120, "type": "single", "questionId": 43151, "question": "On a public works project if the subcontractor’s percentage of the total bid exceeds ______ the prime contractor must include the subcontractor’s name and address in the bid.", "choices": [{"pos": 0, "letter": "A", "text": "0.50%", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "2%", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "5%", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "10%", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A subcontractor performing work greater than one-half of one percent (0.5 percent) of the prime contractor’s total bid.", "finished": false}, {"number": 105, "total": 120, "type": "single", "questionId": 43152, "question": "Which of the following may NOT file a stop payment notice on public works?", "choices": [{"pos": 0, "letter": "A", "text": "The direct contractor.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "A subcontractor.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Material supplier.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Surveyor.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. A stop payment notice (commonly referred to as a “stop notice”) is a claimant’s written demand to the party holding construction funds (usually the owner or construction lender) to withhold a specified amount from the moneys otherwise due to the general contractor on a construction project.", "finished": false}, {"number": 106, "total": 120, "type": "single", "questionId": 43153, "question": "IRS Form 941 for the second calendar quarter must be filed by:", "choices": [{"pos": 0, "letter": "A", "text": "April 30.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "June 30.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "July 31.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "October 31.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. 1st Quarter filed by April 30. 2nd Quarter filed by July 31. 3rd. Quarter filed by October 31. 4th. Quarter filed by January 31.", "finished": false}, {"number": 107, "total": 120, "type": "single", "questionId": 43154, "question": "Which of the following payroll taxes is withheld from employee wages?", "choices": [{"pos": 0, "letter": "A", "text": "Federal Unemployment Tax (FUTA)", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "State Employment Training Tax (ETT)", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "State Unemployment Insurance (UI)", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "State Disability Insurance (SDI)", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The Unemployment Insurance (UI) and the Employment Training Tax (ETT) are paid by the employers. The State Disability Insurance (SDI) and the California Personal Income Tax (PIT) are withheld from employee wages.", "finished": false}, {"number": 108, "total": 120, "type": "single", "questionId": 43155, "question": "The Underground Service Alert color code for a sewer line is:", "choices": [{"pos": 0, "letter": "A", "text": "green.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "blue.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "purple.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "orange.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Underground Utility Color Codes: Red – Electric power lines, conduit and cables. Orange – Telecommunication, alarm or signal lines. Yellow – Gas, oil, steam, petroleum, or other flammable material. Green – Sewage and drain lines. Blue – Drinking water. Purple – Reclaimed water, irrigation, and slurry lines. Pink – Temporary survey markings, unknown/unidentified facilities. White – Proposed excavation limits or route.", "finished": false}, {"number": 109, "total": 120, "type": "single", "questionId": 43156, "question": "Which fees are NOT paid for by the Registrar in a CSLB arbitration?", "choices": [{"pos": 0, "letter": "A", "text": "Arbitrator’s fee", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Administrative fees", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Expert witness fees", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Attorney’s fees", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The CSLB provides and pays for the arbitrator and one expert witness (an experienced member of the trade) free of charge and will also pay all administrative fees. Any further witnesses are to be paid by the disputing parties. An attorney may represent one or both parties at their own expense.", "finished": false}, {"number": 110, "total": 120, "type": "single", "questionId": 43157, "question": "A joint control is primarily a third party management of:", "choices": [{"pos": 0, "letter": "A", "text": "safety equipment and procedures.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "job scheduling.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "inspections by a building official.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "construction funds.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Joint control is defined as the contractually agreed sharing of control and exists only when decisions about the relevant activities require the unanimous consent of the parties sharing control.", "finished": false}, {"number": 111, "total": 120, "type": "single", "questionId": 43158, "question": "All contractors working on a public works project MUST employ apprentices on the project in each classification the contractor uses. What percentage of every contractor’s man hours come from apprentices?", "choices": [{"pos": 0, "letter": "A", "text": "30%", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "25%", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "20%", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "15%", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. At the end of the project, your straight time apprentice hours must equal a total of 1 hour for every 5 straight time journeyman hours for each separate craft. For example, if you have a total of 100 journeyman hours at the end of the project, you would need 20 apprentice hours in that same craft.", "finished": false}, {"number": 112, "total": 120, "type": "single", "questionId": 43159, "question": "A contractor provides for 90% payment by the time construction is complete and for the final 10% after the lien period expires. This 10% retention:", "choices": [{"pos": 0, "letter": "A", "text": "is not important because profits are usually greater than retentions", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "is important because retentions are usually greater than profit and are therefore a claim on working capital", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "is listed on the balance sheet as current liability", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "is illegal because retentions must be held until 90 days after the lien period expires", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Retention: A specified amount, usually 10 percent, withheld from progress payments to the contractor pending satisfactory completion and final acceptance of the project. This amount you have already earned even though you have not yet been paid. Retention usually exceeds profits and therefore represents a claim on working capital. The problem is even greater for the subcontractor who completes his or her phase early in the project and must contend with a long waiting period.", "finished": false}, {"number": 113, "total": 120, "type": "single", "questionId": 43160, "question": "Plans submitted for simple residential building permits must include ___________________.", "choices": [{"pos": 0, "letter": "A", "text": "Acoustics plan", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "site plan", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "an interior décor plan", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Simple residential building plans require a plot or site plan indicating the proposed building vicinity, lot and building dimensions, existing and proposed buildings, etc. Other plans included in the building plans are the floor plan, exterior elevations, cut-away plan, construction details, material lists and specifications, and specialty items.", "finished": false}, {"number": 114, "total": 120, "type": "single", "questionId": 70283, "question": "Each month $68.50 is taken out of Lydia’s paycheck for taxes, social security, and other government deductions. How much money per year is being sent to the government?", "choices": [{"pos": 0, "letter": "A", "text": "$822.00", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$685.00", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "$753.00", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$787.00", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. There are 12 months in a year and $68.50 is held each month for the government. To find the total for the year, multiply the cost each month by 12 to represent an entire year, 12 x $68.50 = $822.", "finished": false}, {"number": 115, "total": 120, "type": "single", "questionId": 43162, "question": "An employee works 8 hours per day Monday through Thursday, is off on Friday for a holiday, then works 8 hours on Saturday and 8 hours on Sunday. At what rate is the employee paid for working on Sunday?", "choices": [{"pos": 0, "letter": "A", "text": "the regular rate", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "2-1/2 times the regular rate", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "twice the regular rate", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1-1/2 times the regular rate", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The employee must be paid 1-1/2 times the regular rate of pay for any hours worked in excess of 8 hours in a day or 40 hours in a week. The first 8 hours worked on the 7th day of a work week are also paid at 1-1/2 times the regular rate. Overtime is calculated based on hours actually worked. A paid holiday does not count toward hours subject to overtime.", "finished": false}, {"number": 116, "total": 120, "type": "single", "questionId": 43163, "question": "The purpose of contract specifications is to ______________.", "choices": [{"pos": 0, "letter": "A", "text": "complete the contract", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "help prevent disputes", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "aid in estimating labor and materials", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Specifications provide qualitative information, complete the contract and provide a legal document with directions for bidding, insurance, bond forms and owner-contractor agreements. They help prevent owner-contractor or contractor-designer/architect disputes. Materials and labor are detailed, and together, with working drawings, they complete the contract. Specifications explain required quality and type of materials, colors, finishes and workmanship.", "finished": false}, {"number": 117, "total": 120, "type": "single", "questionId": 43164, "question": "If a contractor fails to report a construction-related civil court judgement to CSLB within _____ days, CSLB will automatically suspend his or her contractor license when it is reported.", "choices": [{"pos": 0, "letter": "A", "text": "15", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "30", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "90", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "120", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Section 7071.17 of the Business and Professions Code requires contractors notify the Contractors State License Board (CSLB) of any unsatisfied “construction related” civil court judgment within 90 days of the judgment date. The same law applies to arbitration awards unless the arbitration was provided by the CSLB. If the CSLB is notified of the judgment in a timely manner, the contractor is given another 90 days to resolve the judgment. If the judgment is not resolved within that 90 days, the license is suspended until the judgment is resolved. If the contractor fails to notify the CSLB of the judgment within the required 90 days then the contractor’s license is suspended upon notification. Any party to the judgment can notify the CSLB of the judgment.", "finished": false}, {"number": 118, "total": 120, "type": "single", "questionId": 55183, "question": "An employee may be terminated for missing work due to illness after using how many hours of sick time?", "choices": [{"pos": 0, "letter": "A", "text": "8 hours", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "16 hours", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "40 hours", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "48 hours", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C.  The correct answer is 5 days or 40 hours.", "finished": false}, {"number": 119, "total": 120, "type": "single", "questionId": 55614, "question": "Employers are required to provide at least ____________ of sick leave each year to most workers.", "choices": [{"pos": 0, "letter": "A", "text": "40 hours", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "48 hours", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "8 hours", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "16 hours", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C.  Starting on January 1, 2024, the law requires employers to provide and allow employees to use at least 40 hours or five days of paid sick leave per year. Before January 1, 2024, an employer could limit an employee’s use to 24 hours or three days during a yea", "finished": false}, {"number": 120, "total": 120, "type": "single", "questionId": 43167, "question": "If a construction company buys a new car for general use by the sales staff, to which of the following accounts would the depreciation of the car be charged?", "choices": [{"pos": 0, "letter": "A", "text": "Project management expenses", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "General and administrative costs", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Direct job costs", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Company profits", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. General and administrative costs.", "finished": false}], "law-bus-test-6": [{"number": 1, "total": 120, "type": "single", "questionId": 68749, "question": "The Family and Medical Leave Act (FMLA) is governed by?", "choices": [{"pos": 0, "letter": "A", "text": "state law", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "county law", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "federal law", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "interstate law", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Federal law.  The Family and Medical Leave Act (FMLA) is a federal law enforced by the U.S. Department of Labor that provides eligible employees with up to 12 weeks of unpaid, job-protected leave for specific family and medical reasons, such as caring for a newborn or seriously ill family member.", "finished": false}]};
const KEY = "lawbus-mastery-v1";

// Flatten all banks, dedupe by questionId.
const seen = new Set();
const QUESTIONS = [];
for (const name of Object.keys(BANKS)) {
  for (const q of BANKS[name]) {
    if (seen.has(q.questionId)) continue;
    seen.add(q.questionId);
    QUESTIONS.push(q);
  }
}

let state = { mastered: {}, missed: {} };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) { /* storage unavailable — session-only mode */ }
if (typeof state.wrong !== "number" || typeof state.tries !== "number") {
  // Migrate pre-counter progress: every miss and every mastery was one try.
  state.wrong = Object.values(state.missed).reduce((a, b) => a + b, 0);
  state.tries = state.wrong + Object.keys(state.mastered).length;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let sessionRight = 0, sessionTotal = 0, current = null, lastId = null;

const $ = id => document.getElementById(id);
$("bankNote").textContent =
  QUESTIONS.length + " questions from " + Object.keys(BANKS).length + " test(s) · progress saves on this device";

function pool() { return QUESTIONS.filter(q => !state.mastered[q.questionId]); }

function updateHeader() {
  const total = QUESTIONS.length;
  const done = total - pool().length;
  $("tally").innerHTML = "<b>" + done + "</b> / " + total + " mastered";
  $("barFill").style.width = total ? (100 * done / total) + "%" : "0";
  $("sessionStat").textContent = sessionTotal
    ? "This session: " + sessionRight + " of " + sessionTotal + " correct" : "";
  $("allTime").textContent = state.tries
    ? "Overall: " + state.wrong + " misses / " + state.tries + " tries" : "";
}

function draw() {
  const p = pool();
  updateHeader();
  if (!p.length) return renderDone();
  let pick;
  do { pick = p[Math.floor(Math.random() * p.length)]; }
  while (p.length > 1 && pick.questionId === lastId);
  current = pick;
  lastId = pick.questionId;
  renderQuestion(pick);
}

function renderQuestion(q) {
  const misses = state.missed[q.questionId] || 0;
  $("missedChip").textContent = misses ? "missed " + misses + "\u00d7" : "";
  const card = $("card");
  card.innerHTML = "";
  const qt = document.createElement("p");
  qt.className = "qtext"; qt.textContent = q.question;
  card.appendChild(qt);
  const wrap = document.createElement("div");
  wrap.className = "choices";
  q.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = "<span class='letter'>" + c.letter + "</span><span></span>";
    b.lastChild.textContent = c.text;
    b.onclick = () => answer(b, c, q);
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
}

function answer(btn, choice, q) {
  const buttons = [...$("card").querySelectorAll(".choice")];
  if (buttons[0].disabled) return;
  sessionTotal++;
  state.tries++;
  if (!choice.isCorrect) state.wrong++;
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (q.choices[i].isCorrect) b.classList.add("correct");
  });
  const verdict = document.createElement("p");
  verdict.className = "verdict";
  if (choice.isCorrect) {
    sessionRight++;
    state.mastered[q.questionId] = true;
    verdict.classList.add("good");
    verdict.textContent = "Correct — out of the pool";
  } else {
    btn.classList.add("wrong");
    state.missed[q.questionId] = (state.missed[q.questionId] || 0) + 1;
    verdict.classList.add("bad");
    verdict.textContent = "Wrong — stays in the pool";
  }
  save();
  const card = $("card");
  card.appendChild(verdict);
  if (q.explanation) {
    const ex = document.createElement("div");
    ex.className = "explanation";
    ex.textContent = q.explanation;
    card.appendChild(ex);
  }
  const next = document.createElement("button");
  next.className = "next"; next.textContent = "Next question";
  next.onclick = draw;
  card.appendChild(next);
  next.focus({ preventScroll: true });
  updateHeader();
}

function renderDone() {
  const totalMisses = Object.values(state.missed).reduce((a, b) => a + b, 0);
  $("missedChip").textContent = "";
  $("card").innerHTML =
    "<div class='done'><h2>Pool cleared.</h2>" +
    "<p>All " + QUESTIONS.length + " questions mastered · " + totalMisses +
    " total misses along the way.</p>" +
    "<button class='next' id='againBtn'>Start over</button></div>";
  $("againBtn").onclick = resetAll;
}

function resetAll() {
  state = { mastered: {}, missed: {}, wrong: 0, tries: 0 };
  save();
  sessionRight = 0; sessionTotal = 0; lastId = null;
  draw();
}

// Two-tap reset: arm on first tap, wipe on second within 4 s.
let resetTimer = null;
const resetBtn = $("resetBtn");
function disarmReset() {
  clearTimeout(resetTimer);
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "Reset progress";
}
resetBtn.onclick = () => {
  if (resetBtn.classList.contains("armed")) {
    disarmReset();
    resetAll();
  } else {
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Tap again to wipe all progress";
    resetTimer = setTimeout(disarmReset, 4000);
  }
};

// Ask the browser to protect this origin's storage from eviction.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

draw();
</script>
</body>
</html>
