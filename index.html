ob site", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "posted in an administrative office that is available to employees", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The OSHA Job Safety and Health: It’s the Law poster, available for free from OSHA, informs workers of their rights under the Occupational Safety and Health Act. All covered employers are required to display the poster in their workplace. Employers do not need to replace previous versions of the poster. Employers must display the poster in a conspicuous place where workers can see it. con·spic·u·ous /k?n’spikyo?o?s/ adjective 1. standing out so as to be clearly visible.", "finished": false}, {"number": 61, "total": 120, "type": "single", "questionId": 42860, "question": "When a contract includes a “complete agreement” clause:", "choices": [{"pos": 0, "letter": "A", "text": "the contractor and owner are bound by the exact words of the contract", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the work must be completed by a certain date or the contractor must pay liquidated damages", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the contractor must supply a completion bond", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "the owner agrees to pay for the completion bond", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A complete agreement clause declares that the contract represents the complete and final agreement, thereby protecting the contracting parties. … Basic business contracts where complete agreement clauses can be found include: Employment contracts.", "finished": false}, {"number": 62, "total": 120, "type": "single", "questionId": 42861, "question": "Of the following, which may not be determined from a completed job application?", "choices": [{"pos": 0, "letter": "A", "text": "applicant’s former employers", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "applicant’s work experience", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "applicant’s honesty and integrity", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "applicant’s schooling", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Honesty and integrity are virtues that can not known with the information on an application. Through the process of elimination “C” is the BEST answer.", "finished": false}, {"number": 63, "total": 120, "type": "single", "questionId": 42862, "question": "What is the BEST way to make sure your bond and insurance are up to date?", "choices": [{"pos": 0, "letter": "A", "text": "Choose insurance companies that will notify you by mail when your bond or insurance policy is due to expire.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Review your bond and insurance policies every two months.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Purchase only short-term bonds and insurance.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Review your bond and insurance policies before each bid is prepared.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. If a bid is accepted, a contractor must start the job. The status of any bonds or insurance policy should be double checked before submitting a bid. Do not rely solely on your insurance agent or insurer. Renewal notices are often mailed months in advance and are sometimes misplaced.", "finished": false}, {"number": 64, "total": 120, "type": "single", "questionId": 42863, "question": "Where should the following statement be placed in a written contract? “THE CONTRACTOR IS NOT RESPONSIBLE FOR DELAYS CAUSED BY WEATHER, EARTHQUAKES, FLOODS, OR OTHER ACTS OF GOD.”", "choices": [{"pos": 0, "letter": "A", "text": "before the job description", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "after the signatures", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "after the change order clause", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "after the approximate work period", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The “ACTS OF GOD” statement is usually located on a contract after the approximate work period dates.", "finished": false}, {"number": 65, "total": 120, "type": "single", "questionId": 42864, "question": "When does a prime contractor pay a subcontractor in full?", "choices": [{"pos": 0, "letter": "A", "text": "every two weeks until the sub is completely finished with the project", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "when the sub is done with their portion of the work, and the work has been inspected", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "when the entire project is completed", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "when the contractor receives final payment from the owner", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A prime contractor pays the subcontractor when the sub is done with their portion of the work, and the work has been inspected.", "finished": false}, {"number": 66, "total": 120, "type": "single", "questionId": 42865, "question": "If an employee works 30 hours one week and 30 hours the second week at a wage of $12/hr, what will be the gross wages for the two-week period?", "choices": [{"pos": 0, "letter": "A", "text": "$720", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$740", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "$760", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$805", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. 30 + 30 = 60 hrs 60 x $12 = $720", "finished": false}, {"number": 67, "total": 120, "type": "single", "questionId": 42866, "question": "If a contract provides for a retention of 5% of a $135,000 total job price, how much may the owner withhold?", "choices": [{"pos": 0, "letter": "A", "text": "$6,500", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$6,675", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "$6,700", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$6,750", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. $135,000 x 0.05 = $6,750", "finished": false}, {"number": 68, "total": 120, "type": "single", "questionId": 70155, "question": "Which of the following statements about advertising is correct?", "choices": [{"pos": 0, "letter": "A", "text": "All advertisements must include the contractor’s name, address, and telephone number.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The address of the CSLB must be on all advertising.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "A contractor must have a license number to advertise.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A contractor’s license number must be on all forms of advertising.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Advertisements must include the contractor’s license number but not the contractor’s name, address, and telephone number or the CSLB’s address. Answer C is not correct because unlicensed contractors may advertise if the contract price of labor and materials is less than $1,000 and the ad mentions that the contractor is not licensed.", "finished": false}, {"number": 69, "total": 120, "type": "single", "questionId": 42868, "question": "Who is responsible for establishing that a subcontractor is duly licensed?", "choices": [{"pos": 0, "letter": "A", "text": "A subcontractor is not required to prove that he or she is licensed.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The prime contractor is responsible.", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "A subcontractor may work up to 10 days consecutively without being licensed.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The owner is responsible.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. It is the prime contractor’s responsibility to establish that the subcontractor is duly licensed. The prime is required to ask the sub to show proof of licensure. The CSLB interprets this responsibility in a strict sense. In their own words: “When working with a contractor you don’t know, ask to see his or her current license renewal card. Also make sure the subcontractor includes his or her license number on the subcontract or bid form.” You can also check to see if the sub’s license has been suspended or revoked by visiting the CSLB website. A prime contractor is usually considered to be the employer of any unlicensed subcontractor and is therefore liable for payroll taxes. A prime who enters into a contract with an unlicensed subcontractor is also subject to disciplinary action.", "finished": false}, {"number": 70, "total": 120, "type": "single", "questionId": 42869, "question": "Which of the following statements about fixed expenses is most correct?", "choices": [{"pos": 0, "letter": "A", "text": "Overhead is generally considered a fixed expense.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Fixed expenses vary over time.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Direct labor is generally considered a fixed expense.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Fixed expenses usually amount to less than 10% of total expenses.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Overhead is the indirect costs or fixed expenses of operating a business (that is, the costs not directly related to the manufacture of a product or delivery of a service) that range from rent to administrative costs to marketing costs. Overhead refers to all non-labor expenses required to operate your business", "finished": false}, {"number": 71, "total": 120, "type": "single", "questionId": 42870, "question": "A contractor’s license should be renewed:", "choices": [{"pos": 0, "letter": "A", "text": "30 days before expiration", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "on the day of expiration", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "within the grace period of 30 days after the license expires", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "within three years after expiration", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Approximately 60 days before your license is due to expire, CSLB will send you a renewal application. To ensure timely receipt of all license maintenance information, be sure to notify the Board of any change to the address maintained on Board records.", "finished": false}, {"number": 72, "total": 120, "type": "single", "questionId": 42871, "question": "If it is discovered that the construction materials in an area contain more than 0.1% asbestos:", "choices": [{"pos": 0, "letter": "A", "text": "the crew should try not to disturb the area but keep working", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the contractor should contact DOSH immediately", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the workers should stop and remove the materials wearing masks and gloves", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the crew should wet down the area with water and continue working", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Levels of Exposure While there is no “safe” level of exposure to asbestos, to help protect workers handling asbestos-containing materials, the federal Occupational Safety & Health Administration (OSHA) established two levels of exposure: permissible exposure limit (PEL) and the excursion limit. Permissible exposure limit (PEL) – defined as exposure to an airborne concentration of asbestos not to exceed 0.1 fibers per cubic centimeter of air (0.1 f/cc) averaged over an eigh thour work day. Excursion limit – defined as exposure to an airborne concentration of asbestos not to exceed 1.0 fibers per cubic centimeter of air (1.0 f/cc) averaged over a sampling period of 30 minutes. Asbestos Certification, C-22 Asbestos Abatement License, and Cal/OSHA (DOSH) Registration For any work that involves 100 square feet or more surface area of asbestos-containing construction material a contractor must be asbestos certified or licensed and also registered with Cal/OSHA (DOSH). This means that contractors must pass either an Asbestos Certification examination or a C-22 Asbestos Abatement Licensure examination administered by CSLB. In addition, the contractor must be registered with the Asbestos Contractor’s Registration Unit of Cal/OSHA’s Division of Occupational Safety and Health (DOSH).", "finished": false}, {"number": 73, "total": 120, "type": "single", "questionId": 42872, "question": "Which of the following statements is used to determine the “acid test”?", "choices": [{"pos": 0, "letter": "A", "text": "income statement", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "cash-flow statement", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "balance sheet", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "annual income tax return", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The acid-test ratio involves assessing a company’s balance sheet to see whether it has enough funding on hand to cover its current debt. … In the best-case scenario, a company should have a ratio of 1 or more, suggesting the company has enough cash to pay its bills. The “acid test” refers to the quick ratio, which is the ratio of quick assets (current assets minus inventories) to current liabilities. Despite the funny name, the acid-test ratio is a strong measure of a company’s ability to pay its bills… Also known as the quick ratio, the acid-test ratio is a liquidity ratio that measures a company’s ability to pay its current liabilities with it quick or current assets", "finished": false}, {"number": 74, "total": 120, "type": "single", "questionId": 70134, "question": "DOSH has the power to stop work on a job due to unsafe conditions:", "choices": [{"pos": 0, "letter": "A", "text": "for up to 8 hours.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "for up to 24 hours.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "for up to 72 hours.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "until the hazard is resolved.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Cal/OSHA (Division of Occupational Safety and Health – DOSH) has the authority to prohibit entry or stop work immediately on a job site due to imminent hazard or unsafe conditions, often issuing an “Order to Take Special Action” or a “Tag-Out” order that remains in effect until the hazard is corrected", "finished": false}, {"number": 75, "total": 120, "type": "single", "questionId": 42874, "question": "An “aging” report is:", "choices": [{"pos": 0, "letter": "A", "text": "used to determine interest on a loan", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "a method of tracking inventory", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a type of depreciation schedule", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a way of keeping track of overdue accounts", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The report lists the age of each client’s account in days (0-30 days, 31-60 days, 61-90 days, etc.).", "finished": false}, {"number": 76, "total": 120, "type": "single", "questionId": 42875, "question": "Which type of job-related injury requires the employer to make a written report?", "choices": [{"pos": 0, "letter": "A", "text": "an injury requiring just first aid", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "an injury requiring medical attention beyond first aid", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "if the employee is required to return to work after the injury", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A report should be written for any injury requiring medical attention beyond first aid.", "finished": false}, {"number": 77, "total": 120, "type": "single", "questionId": 42876, "question": "What percentage of the normal wage must you pay a minor?", "choices": [{"pos": 0, "letter": "A", "text": "80%", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "90%", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "100%", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "110%", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Although there are some exceptions, almost all employees in California must be paid the minimum wage as required by state law.", "finished": false}, {"number": 78, "total": 120, "type": "single", "questionId": 42877, "question": "A time card includes:", "choices": [{"pos": 0, "letter": "A", "text": "how much a person earns per hour", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "where the job site is located", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the days and hours the person worked", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the employee’s birth date and social security number", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A time card, also called a timesheet, is a method for recording and tracking the amount of an employee’s time spent on each job.", "finished": false}, {"number": 79, "total": 120, "type": "single", "questionId": 42879, "question": "A stop notice on a public works project is used to:", "choices": [{"pos": 0, "letter": "A", "text": "stop all payments to the prime contractor until the subcontractors are paid", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "lien the property", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "withhold sufficient money from the prime contractor to pay the subcontractors who file stop notices", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "stop all construction activity on a particular job", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. A stop notice is a notice given for the purpose of stopping, intercepting, or freezing funds that have not yet been paid on a construction project in an attempt to ensure payment.", "finished": false}, {"number": 80, "total": 120, "type": "single", "questionId": 42880, "question": "What is the relationship between a prime contractor and a subcontractor?", "choices": [{"pos": 0, "letter": "A", "text": "employer-employee", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "parallel", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractual", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "no relationship", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The relationship between a prime contractor and a subcontractor is contractual. A prime contractor hires a subcontractor to do a job, but there is no supervisor-subordinate relationship between them. Both are hired to do a certain job; the subcontractor’s job is simply more specific.", "finished": false}, {"number": 81, "total": 120, "type": "single", "questionId": 42881, "question": "Which is the most correct statement as to what must be included in every home improvement contract?", "choices": [{"pos": 0, "letter": "A", "text": "Three-Day-Right to Cancel Notice", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "contractor’s license number", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Truth in Lending Notice", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "name of the project", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The contractor’s license number is required on all home improvement contracts. A Three-Day Right to Cancel Notice is not required if the contract was negotiated at the contractor’s place of business or is subject to the Seven-Day Right to Cancel Notice required for contracts written for repairs or restoration of residences damaged by a sudden or catastrophic event (state of emergency).", "finished": false}, {"number": 82, "total": 120, "type": "single", "questionId": 42882, "question": "A contractor’s California personal income tax return should be sent to which office?", "choices": [{"pos": 0, "letter": "A", "text": "Franchise Tax Board", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "EDD", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "IRS", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Board of Equalization", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. A contractor’s personal income tax return, Form 540, is sent directly to the Franchise Tax Board.", "finished": false}, {"number": 83, "total": 120, "type": "single", "questionId": 42883, "question": "What is the purpose of the Cal/OSHA Consultation Service?", "choices": [{"pos": 0, "letter": "A", "text": "Adopts safety and health laws and standards.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Helps employers voluntarily follow safety and health laws and standards.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Makes decisions on appeals of citations for safety and health violations.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Issues permits and registers contractors who do asbestos-related work.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The Cal/OSHA Consultation Service provides safety and health assistance to employers through its free onsite consultation and a variety of other services. They also help companies prevent occupational injuries and illnesses.", "finished": false}, {"number": 84, "total": 120, "type": "single", "questionId": 42884, "question": "Without reducing risk, what is the best way to reduce insurance costs?", "choices": [{"pos": 0, "letter": "A", "text": "Compare premiums and coverage yearly.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Decrease the coverage.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Increase the deductible.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Get a policy for overlapping coverage.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The CSLB Contractors License Law and Reference Book states: “Insurance costs can be minimized by obtaining a number of quotes for new and renewal policies or by enrolling in special plans offered by trade associations.”", "finished": false}, {"number": 85, "total": 120, "type": "single", "questionId": 42885, "question": "The most economical way to obtain insurance is to:", "choices": [{"pos": 0, "letter": "A", "text": "choose one agent who handles all lines of insurance", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "price-shop with several agents", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "deal with only one insurance company", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "change insurance companies frequently", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The most economical way to obtain insurance is to shop around for the best prices.", "finished": false}, {"number": 86, "total": 120, "type": "single", "questionId": 42886, "question": "An employer would issue a 1099 to:", "choices": [{"pos": 0, "letter": "A", "text": "an employee who is currently working for the employer", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "an employee who is not currently working", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "a nonemployee who was paid at least $600 for services during the year", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "any nonemployee regardless of the amount paid for services", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Independent Contractor Reporting Businesses and government entities (defined as a “service-recipient”) are required to report specified information to the Employment Development Department (EDD) on independent contractors (defined as a “service-provider”). You are required to report independent contractor information if you hire an independent contractor and the following statements all apply: You are required to file a Form 1099-MISC for the services performed by the independent contractor. You pay the independent contractor $600 or more or enter into a contract for $600 or more. The independent contractor is an individual or sole proprietorship.", "finished": false}, {"number": 87, "total": 120, "type": "single", "questionId": 42887, "question": "The license shall be displayed (not pocket card), in the licensee’s _________________________.", "choices": [{"pos": 0, "letter": "A", "text": "main office", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "chief place of business", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "display of license is not necessary", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A & B", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A & B. Also, satisfactory evidence of the possession of a license and current renewal therefore shall be provided by the licensee up-on demand", "finished": false}, {"number": 88, "total": 120, "type": "single", "questionId": 42888, "question": "An employee has a deep gushing wound on the forearm. What should you do to control bleeding?", "choices": [{"pos": 0, "letter": "A", "text": "Apply a tourniquet.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Apply direct pressure to the wound.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Apply pressure to the brachial artery.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Apply pressure 6″ below the wound or joint.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The American Red Cross recommends that you elevate the arm and apply direct pressure over a dressing to the wound. If this does not stop the bleeding, apply pressure to the brachial artery, forcing it against the arm bone. Tourniquets are dangerous and should only be used for severe, life-threatening hemorrhages that cannot be controlled by any other means.", "finished": false}, {"number": 89, "total": 120, "type": "single", "questionId": 42889, "question": "Which of the following statements about mechanics’ liens is correct?", "choices": [{"pos": 0, "letter": "A", "text": "A supplier must deliver material to the job site in order for a mechanics’ lien to be valid.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The prime contractor is responsible for the debt stated in the lien.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The owner is responsible for the debt stated in the lien.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A supplier does not have a right to a mechanics’ lien.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. A mechanics lien is a “hold” against your property, filed by an unpaid contractor, subcontractor, laborer, or material supplier, and is recorded with the county recorder’s office. … Legally, the homeowner is ultimately responsible for payment — even if they already have paid the direct contractor.", "finished": false}, {"number": 90, "total": 120, "type": "single", "questionId": 42890, "question": "Of the following, which is the best way to determine if more materials must be ordered?", "choices": [{"pos": 0, "letter": "A", "text": "Compare the present inventory to the inventory for last year.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Walk the job.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Ask a supervisor.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Compare material lists for similar jobs.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Site visits are important in both mitigating risk and controlling costs for installers, manufacturers and end clients.", "finished": false}, {"number": 91, "total": 120, "type": "single", "questionId": 42891, "question": "If a client continues to request change orders, you should:", "choices": [{"pos": 0, "letter": "A", "text": "charge administrative fees", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "collect change order costs as you go", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "not proceed until your client has signed each change order", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. Change orders are required to perform extra or changed work. Change order forms become a part of the contract once the contractor and the homeowner sign them. The order must describe the scope of the extra work or change, the cost to be added or subtracted from the contract, and the effect the order will have on the schedule of progress payments. Change orders can also be written for the removal of items from the original agreement. All change orders must be in writing.", "finished": false}, {"number": 92, "total": 120, "type": "single", "questionId": 42892, "question": "What is the purpose of the following statement in a contract? “THE AGENT IS LIABLE FOR FINAL PAYMENT.”", "choices": [{"pos": 0, "letter": "A", "text": "The agent is responsible for final payment.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The owner is responsible for final payment.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "The owner and the agent are responsible for final payment.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. One of the references listed in the CSLB Study Guide recommends a personal guarantee or similar clause in contracts with renters, lessees, or others who request work but do not own the property. Do not assume the owner will also be liable. For example, the owner can post and record a Notice of Nonresponsibility.", "finished": false}, {"number": 93, "total": 120, "type": "single", "questionId": 55593, "question": "Of the following, which is the best example of a vague statement in a contract?", "choices": [{"pos": 0, "letter": "A", "text": "The second payment is due when 60% of the work is done.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The contractor warranties all work for one year.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Rehang the front door so that it closes and locks properly.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Fill in and smooth the dog scratches as much as possible and paint the door.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "Answer “D” is given as an example in one of the CSLB Study Guide references. Among other things, the type of paint for prime and finish coats should be specified. If the scratches are deep, the contract should also mention that, because of the difficulty of bonding a thick base of putty to the door, slight ripples may remain.\n\nAnswers “A” and “C” may also lead to misunderstandings.\n\nThe second payment in “A” should be referenced to a specific stage of the project. “C” should include a disclaimer in case the foundation is shifting.", "finished": false}, {"number": 94, "total": 120, "type": "single", "questionId": 42894, "question": "Of the following, which is the most reasonable method of preventing disputes about change orders?", "choices": [{"pos": 0, "letter": "A", "text": "Explain the change order procedure at the time you request payment for the extra work.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Wait until a change is necessary before discussing change orders with the owner.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Include the change order procedure in the original contract.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Negotiate a price for change orders after all work has been completed.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. If the contract price or scope of work needs to be changed, it MUST be done with a written “Change Order,” signed by the customer and contractor prior to the change, which then becomes a part of the contract.", "finished": false}, {"number": 95, "total": 120, "type": "single", "questionId": 42895, "question": "Which type of bond guarantees job completion?", "choices": [{"pos": 0, "letter": "A", "text": "payment bond", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "performance bond", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "bid bond", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "labor and materials bond", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A performance bond, also known as a contract bond, is a surety bond issued by an insurance company or a bank to guarantee satisfactory completion of a project by a contractor.", "finished": false}, {"number": 96, "total": 120, "type": "single", "questionId": 42896, "question": "When is an employer not required to keep records of work-related injuries or illnesses on Cal/ OSHA Form 300?", "choices": [{"pos": 0, "letter": "A", "text": "10 employees or less", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "20 employees or less", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "30 employees or less", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "when the business is family operated", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Cal/OSHA Form 300 is the “Log of Work-Related Injuries and Illnesses.” This requirement does not apply to employers who had no more than 10 employees for all shifts combined during any 24-hour period in the previous calendar year.", "finished": false}, {"number": 97, "total": 120, "type": "single", "questionId": 60497, "question": "If a contractor enters into a contract with an unlicensed person, who is in violation of the law?", "choices": [{"pos": 0, "letter": "A", "text": "the contractor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "both the contractor and the unlicensed person", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the unlicensed person", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "only the unlicensed person if he didn’t notify the contractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B.  It is illegal for an unlicensed person to perform contracting work on any project valued at more than $1,000 in combined labor and material costs. Besides being illegal, unlicensed contractors lack accountability and have a high rate of involvement in construction scams. They also are unfair competition for licensed contractors who operate with bonds, insurance, and other responsible business practices. The contractor is in violation for not making sure the person is licensed.  The unlicensed person is in violation for deception even though the contractor is required to verify the license status.  Being ignorant of the law does not preclude it’s penalties.", "finished": false}, {"number": 98, "total": 120, "type": "single", "questionId": 42898, "question": "How long after an employee’s termination should a company maintain the employee’s time card?", "choices": [{"pos": 0, "letter": "A", "text": "one year", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "two years", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "three years", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "four years", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. As of January 1, 2022, employers are be required to retain personnel records for applicants and employees for a minimum of four years (up from the previous requirement of three years).", "finished": false}, {"number": 99, "total": 120, "type": "single", "questionId": 42899, "question": "Which of the following is not by itself an acceptable form of documentation for filling out an I-9 form?", "choices": [{"pos": 0, "letter": "A", "text": "Social Security card", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "green card", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "U.S. passport", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "certificate of United States citizenship", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A Social Security card is a List C document that only shows employment authorization. The other choices are List A documents that establish both identity and employment authorization.", "finished": false}, {"number": 100, "total": 120, "type": "single", "questionId": 42900, "question": "Truth in Lending Act rescission rights apply when:", "choices": [{"pos": 0, "letter": "A", "text": "any loan is signed for any home improvement work.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the dollar amount of the contract exceeds $20,000.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "a home improvement salesperson procured the contract.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "a non-purchase lien or security interest is taken in the consumer’s principle dwelling.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The federal Truth in Lending Act provides a three-day rescission (cancellation) period for home improvements that are to to be financed and involve a security interest in the buyer’s home.", "finished": false}, {"number": 101, "total": 120, "type": "single", "questionId": 42901, "question": "A licensed contractor wants to do construction projects with an unlicensed individual. Of the following, which is a legal alternative?", "choices": [{"pos": 0, "letter": "A", "text": "They may be partners if the licensed contractor signs all of the contracts.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "They may form a corporation and obtain a corporate license.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "They may obtain a joint venture license.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "The licensed contractor may subcontract work to the unlicensed individual.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The unlicensed person could be an officer of the corporate license. Working as partners requires a partnership license. A joint venture license is issued to licensees.", "finished": false}, {"number": 102, "total": 120, "type": "single", "questionId": 42902, "question": "When should ear protection be worn?", "choices": [{"pos": 0, "letter": "A", "text": "50 dB", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "90 dB", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "100 dB", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "over 140 dB", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Noise levels above 90 dB for a duration of eight hours are not permitted. An employer must begin to monitor noise when exposure is 85 dB or more.", "finished": false}, {"number": 103, "total": 120, "type": "single", "questionId": 42903, "question": "Which of the following components of a bid would be considered non-productive?", "choices": [{"pos": 0, "letter": "A", "text": "equipment purchased for job", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "surface preparation for painting", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "equipment rental", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "travel time", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Time is considered non-productive if it is paid but does not contribute to the production of work. Examples are travel time and safety meetings.", "finished": false}, {"number": 104, "total": 120, "type": "single", "questionId": 57465, "question": "If the “ARBITRATION OF DISPUTES” clause is not included and initialed by both parties in a home improvement contract, arbitration may not be enforced against any person other than the:", "choices": [{"pos": 0, "letter": "A", "text": "licensee.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "homeowner.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "subcontractor.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "material suppliers.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The CSLB’s arbitration program is mandatory for disputes alleging damages less than $25,000. If an “ARBITRATION OF DISPUTES” clause in a home improvement contract provides for private arbitration but the wording does not comply with the Contractors License Law or it is not initialed by both parties, the licensed contractor may be ordered to participate in the CSLB arbitration program.", "finished": false}, {"number": 105, "total": 120, "type": "single", "questionId": 42905, "question": "A homeowner has not been paying the contractor, and all work has stopped for 60 days. What is the contractor’s next step?", "choices": [{"pos": 0, "letter": "A", "text": "Wait for the homeowner to record a Notice of Cessation or Notice of Completion.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Send the homeowner a Notice of Mechanics Lien form with an unfiled copy of the lien claim.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Continue working if the project is not complete.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "File a lawsuit to foreclose on the lien.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. If all work on a job stops for a continuous period of 60 days, the contractor may file a mechanic lien. However, the contractor must send the homeowner a Notice of Mechanics Lien and unfiled copy of the lien claim before recording a lien.", "finished": false}, {"number": 106, "total": 120, "type": "single", "questionId": 42906, "question": "When does it make the most sense for a contractor to finance a job?", "choices": [{"pos": 0, "letter": "A", "text": "When the contractor will not get the job otherwise.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "When the owner will go to a competitor otherwise.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "When it is an emergency situation, and the owner cannot get the money soon enough.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "When the owner has previous bankruptcies and cannot get credit.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Contractor financing should only be offered when there is a legally binding contract, the owner has a good credit rating, and the debt is secured.", "finished": false}, {"number": 107, "total": 120, "type": "single", "questionId": 42907, "question": "When is eye protection required?", "choices": [{"pos": 0, "letter": "A", "text": "When using a pneumatic hammer.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "When nailing overhead.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "When supervisor says it is.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "When the employer thinks there is a risk of eye injuries.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The employer must provide and ensure that employees use eye protection when working in locations where there is a risk of receiving eye injuries.", "finished": false}, {"number": 108, "total": 120, "type": "single", "questionId": 42908, "question": "A new contractor who has not established a credit account with a supplier can expect to pay for delivered materials:", "choices": [{"pos": 0, "letter": "A", "text": "30 to 60 days after delivery.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "C.O.D.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "before delivery.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "after the materials are installed.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Most suppliers will ask a new contractor without an account to pay for materials before delivery. C.O.D. (Cash on Delivery) was once the norm but is now the least preferred payment method for many suppliers.", "finished": false}, {"number": 109, "total": 120, "type": "single", "questionId": 42909, "question": "A general contractor is hiring an electrician to install receptacles. The general contractor has never worked with this particular electrician before. What should the general contractor do?", "choices": [{"pos": 0, "letter": "A", "text": "Hire the electrician right away based on his assurance that he is able to do good work.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Watch the electrician install a receptacle.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Have the building inspector watch the electrician install a receptacle.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Have the ohmmeter turned off.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The best way to find out if a job applicant knows how to perform a task is to watch the applicant do the work.", "finished": false}, {"number": 110, "total": 120, "type": "single", "questionId": 42910, "question": "A contractor discovers the presence of hazardous material during construction and immediately notifies the homeowner and stops work. After the hazardous materials are properly abated the:", "choices": [{"pos": 0, "letter": "A", "text": "lender should be notified.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "building inspector should be notified.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor should be notified by the homeowner in writing.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Environmental Protection Agency (EPA), should be notified by the contractor.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The homeowner is responsible for ensuring that hazardous materials abatement is completed and for notifying the contractor. Although it was the contractor who discovered the hazard it is the homeowners responsibility to ensure that the hazardous materials abatement is completed. So the homeowner would need to notify the contractor when the abatement has been completed.", "finished": false}, {"number": 111, "total": 120, "type": "single", "questionId": 42911, "question": "The Registrar may waive the examination requirement for a contractor’s license if:", "choices": [{"pos": 0, "letter": "A", "text": "the applicant is the qualifier for a license in the same trade classification.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the applicant has a college degree in business. construction management, or engineering.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the applicant has passed the law and business and trade examinations for the same classification within the past 10 years.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Registrar may waive the examination if the applicant is currently the qualifying individual (qualifier) for a license in good standing and in the same trade classification. The examination requirement may also be waived if the applicant has passed the law and business and trade examinations for the same trade classification within the past five years. College degree may be substituted for up to three years of the practical trade requirement.", "finished": false}, {"number": 112, "total": 120, "type": "single", "questionId": 42912, "question": "When should a contractor’s licensing information be given to a homeowner for a home improvement project?", "choices": [{"pos": 0, "letter": "A", "text": "once the work has started", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "at the end of the project", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "when requested by the homeowner", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "before the contract is signed", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. One reason the contractors are required to include their license numbers on business cards and other forms of advertising is so that consumers can confirm that the license is active and in good standing, and that a license bond and worker’s compensation insurance policy, if required, are in force before signing a contract.", "finished": false}, {"number": 113, "total": 120, "type": "single", "questionId": 42913, "question": "To be binding, change orders to a home improvement contract must contain which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "date of original contract", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "signatures of both parties", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor’s surety company", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "signature of the homeowner only", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A change order must be signed by both parties before the work covered in the new order is begun.", "finished": false}, {"number": 114, "total": 120, "type": "single", "questionId": 42914, "question": "The plans and specifications for a home improvement project usually describes which of the following?", "choices": [{"pos": 0, "letter": "A", "text": "layout sizes", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "liquidated damages", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "consent to arbitrate", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "neighborhood regulations", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Plans and specifications describe layouts, materials, etc. Liquidated damages or consent to arbitrate would be included in the contract. Neighborhood regulations, if any, would be found in the covenants, conditions, and restrictions (CC&Rs) or other agreements among residents of a particular neighborhood.", "finished": false}, {"number": 115, "total": 120, "type": "single", "questionId": 42915, "question": "In which situation is a private contract subject to prevailing wage law?", "choices": [{"pos": 0, "letter": "A", "text": "When the work is not specifically considered a public works project but at least two public entities’ approvals are required before work can begin.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "When the private contract is partly funded by public entities.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "When more than 50% of assignable square footage is leased by a public entity.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Both “A” and “B”, but not “C”.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. California’s prevailing wage laws ensure that the ability to get a public works contract is not based on paying lower wage rates than a competitor. All bidders are required to use the same wage rates when bidding on a public works project. California law requires that not less than the general prevailing rate of per diem wages be paid to all workers employed on a public works project.", "finished": false}, {"number": 116, "total": 120, "type": "single", "questionId": 42916, "question": "Upon the issuance of a license, a plasticized pocket card shall be issued to each licensee or to the __________________________ of licenses licensed as other than individuals.", "choices": [{"pos": 0, "letter": "A", "text": "Partners, Corporate Officers", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Manager", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Responsible Managing Officer", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Chapter 12. Section 7072.5 Issuance of a pocket card.\n\n7072.5.(a) Upon the issuance of a license, a plasticized pocket card of a size, design, and content as may be determined by the registrar shall be issued at no cost to each licensee, or to the partners, managers, officers, responsible managing officer of licensees licensed as other than individuals, which card shall be evidence that the licensee is duly licensed pursuant.", "finished": false}, {"number": 117, "total": 120, "type": "single", "questionId": 42917, "question": "Bid bonds, Performance bonds and Payment bonds are included in the _____________ section of the contract specifications.", "choices": [{"pos": 0, "letter": "A", "text": "Bid Analysis", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Contract Forms", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Insurance Forms", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "General Conditions", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Public and private bid forms must address the specific project and be in accordance with the Contract Documents. All information applicable to the bidder’s company must be included, such as subcontractors, cost breakdowns, and any special authorized forms and bond information.", "finished": false}, {"number": 118, "total": 120, "type": "single", "questionId": 42918, "question": "A typical set of house plans includes a ____________,", "choices": [{"pos": 0, "letter": "A", "text": "contractor list", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "plot plan", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "landscape planting list", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "timeline", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Included in the set of house plans are: the plot plan, floor plan, foundation or basement plan, elevation drawings showing front, rear and side views of the building, electrical, plumbing, heating, and AC layouts. A plot plan is an architecture, engineering, and/or landscape architecture plan drawing—diagram which shows the buildings, utility runs, and equipment layout, the position of roads, and other constructions of an existing or proposed project site at a defined scale.", "finished": false}, {"number": 119, "total": 120, "type": "single", "questionId": 68198, "question": "A contractor is working on a public works project. The entire project is over $30,000, the contractor must employ one (1) hour of apprentice work for every ______ hour(s) performed by a journeyman for each separate craft at the end of a project.", "choices": [{"pos": 0, "letter": "A", "text": "one (1)", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "two (2)", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "five (5)", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "ten (10)", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. 230.1. Employment of Apprentices on Public Works. (a) Contractors, as defined in Section 228 to include general, prime, specialty or subcontractor, shall employ registered apprentice(s), as defined by Labor Code Section 3077, during the performance of a public work project in accordance with the required one hour of work performed by an apprentice for every five hours of labor performed by a journeyman, unless covered by one of the exemptions enumerated in Labor Code Section 1777.5", "finished": false}, {"number": 120, "total": 120, "type": "single", "questionId": 42920, "question": "What legal remedy can be pursued for nonpayment of funds owed to a contractor from a private job?", "choices": [{"pos": 0, "letter": "A", "text": "Notify the city building official.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "File preliminary lien notice.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Perfect the claim of the lien.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "File a Stop Notice.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Mechanic’s liens are legally perfected through what California calls a Complaint to Foreclose a Mechanic’s Lien. Once a mechanic’s lien foreclosure complaint is filed, it’s perfected, placed on a property’s title and can then be legally foreclosed. A perfected lien is a lien that has been filed with the appropriate filing agent in order to make the securing interest in an asset binding. … A perfected lien provides legal documentation to prove that a creditor has a legal right to seize property in place of payments for which they are owed.", "finished": false}], "law-bus-test-4": [{"number": 1, "total": 120, "type": "single", "questionId": 68746, "question": "The Family and Medical Leave Act permits an employee to elect, or the employer to require the employee to use:", "choices": [{"pos": 0, "letter": "A", "text": "accrued vacation leave", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "paid sick leave", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "family sick leave", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. All of the above.  The Family and Medical Leave Act (FMLA) allows an employer to require, or an employee to elect, to use accrued paid vacation leave, paid sick leave, or paid family leave to cover some or all of their FMLA-protected leave. When paid leave is used for an FMLA-qualifying reason, that time also counts as FMLA-protected leave. Employees must still follow their employer’s normal policies for using paid leave when they substitute it for FMLA leave.", "finished": false}, {"number": 2, "total": 120, "type": "single", "questionId": 42926, "question": "A contractor sues an owner for refusing to make final payment after the job was completed. The owner is demanding changes. What could the contractor have done to prevent the lawsuit?", "choices": [{"pos": 0, "letter": "A", "text": "The contractor could have asked the workers to testify.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The contractor could have walked the job with the owner and had the owner sign a job completion form.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The contractor could have just walked the job with the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. If you’re a construction contractor, you can use a Certificate of Final Completion to certify that a project you are responsible for has been finished. This document states that you have concluded work on a specific construction contract, so that you are no longer responsible for last-minute changes or attempted negotiations. A Certificate of Final Completion provides you with a paper trail for your own records. A Certificate of Final Completion specifies the main parties of the construction project (such as the owner of the building, contractor, and architectural/engineering firm), and states when construction began, the final date that major work on the project was completed, and the final construction cost paid and owed to the contractor.", "finished": false}, {"number": 3, "total": 120, "type": "single", "questionId": 42927, "question": "When can a contractor accept a Home Improvement job where the owner does not have a pre-approved loan?", "choices": [{"pos": 0, "letter": "A", "text": "When there is an emergency situation and the owner has a high income and good credit.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "When the owner has bad credit.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "When the owner has an amount in the bank equal to the contract cost.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "When the owner seems kind and has an honest reputation.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Contractor financing should only be offered when there is a legally binding contract, the owner has a good credit rating, and the debt is secured.", "finished": false}, {"number": 4, "total": 120, "type": "single", "questionId": 42928, "question": "When should an employer provide information on safety procedures?", "choices": [{"pos": 0, "letter": "A", "text": "When a new employee is hired.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Within 30 days of hiring.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "If safety procedures are not covered in Cal/OSHA publications.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Every 30 days at meetings conducted by supervisors.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. When a new employee is hired. New employees must be given instructions regarding job hazards, safety precautions, and the employer’s Code of Safe Practices. Supervisors must conduct safety (toolbox or tailgate) meetings with their crews every 10 working days.", "finished": false}, {"number": 5, "total": 120, "type": "single", "questionId": 42929, "question": "Why would there be a difference between the actual inventory and the inventory shown on paper?", "choices": [{"pos": 0, "letter": "A", "text": "It is a common occurrence because of factors such as theft, natural loss, and mistakes.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "You always underestimate what you have in inventory.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "You calculated what you have in inventory by subtracting only what goes into the finished product.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "There never is a substantial difference.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. It’s not uncommon for there to be a discrepancy between the actual inventory and what’s on paper due to factors such as theft, natural loss, and mistakes.", "finished": false}, {"number": 6, "total": 120, "type": "single", "questionId": 42930, "question": "Why should a contractor visit the work site frequently?", "choices": [{"pos": 0, "letter": "A", "text": "To know when to schedule final payment.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "To keep the subcontractors informed of the job’s progress and to check on what materials must be ordered for the next phase of construction.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "To know when to schedule float time.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "To know the approximate final cost.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. A contractor should visit the work site frequently to keep the subcontractors informed of the job’s progress, and to check on what materials must be ordered for the next phase of construction.", "finished": false}, {"number": 7, "total": 120, "type": "single", "questionId": 42931, "question": "When is a worker considered an employee rather than an independent contractor?", "choices": [{"pos": 0, "letter": "A", "text": "When the employer has the right to tell the worker to do certain work.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "When the employer has direct control over the work being performed.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "When the worker can make a profit or loss on the work.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "When the worker doesn’t set his own hours.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. The IRS uses 20 different criteria to determine if a worker is an employee or independent contractor-including degree of supervision, whether employees have their own tools, etc. The more the direction, the greater the chance of being ruled an employee. In fact, the IRS usually assumes that the worker is an employee, and that assumption must be disproved to establish status as an independent contractor.", "finished": false}, {"number": 8, "total": 120, "type": "single", "questionId": 42932, "question": "How can a new employee learn about the safety record of a company?", "choices": [{"pos": 0, "letter": "A", "text": "The employer must post a summary record of job-related injuries and illnesses once a year.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "View a Cal/OSHA safety video tape.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Call the Cal/OSHA consultant services.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. This answer assumes that the employer has 11 or more employees. Current and former employees and their representatives must be given access to Cal/OHSA Form 300 (“Log of Work-Related Injuries and Illnesses”). Summary of Work-Related Injuries and Illnesses At the end of the year, all establishments covered in 29 CFR Part 1904 must complete OSHA’s Form 300A, the “Summary of Work-Related Injuries and Illnesses”, even if no work-related injuries or illnesses occurred during the year. After careful review of the “Log of Work-Related Injuries and Illnesses” to verify that entries are complete and accurate, the total number of incidents in each category listed on OSHA’s Form 300 must be transferred to the Form 300A. California law requires employers to post the “Summary” page from February 1 to April 30 of the year following the year covered by the “Summary”. It must be displayed in a conspicuous location where notices to employees are customarily posted. A copy of the “Summary” must also be made available to employees who move from worksite to worksite and employees who do not report to any fixed establishment on a regular basis. At the end of the three-month period, the “Summary” should be taken down and kept on file for a period of five years following the year to which it pertains.", "finished": false}, {"number": 9, "total": 120, "type": "single", "questionId": 42933, "question": "What is the biggest problem facing new contractors when trying to obtain a “Performance” or “Bid” bond", "choices": [{"pos": 0, "letter": "A", "text": "they don’t have a broker", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "no prior track record", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "poor credit", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "none of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Having no prior track record would be the biggest problem facing new contractors when trying to obtain a “Performance” or “Bid” bond", "finished": false}, {"number": 10, "total": 120, "type": "single", "questionId": 42934, "question": "If retention is withheld until substantial completion of the entire job, the subs who worked on the early stages of the project can be put at a financial disadvantage. What is the best way to remedy this situation?", "choices": [{"pos": 0, "letter": "A", "text": "Tie the release of proportional retentions to the completion of the sub’s work rather than the entire job.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Pay the subs when they finish, no matter what.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Contact the owner immediately.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "None of the above.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Retention is an amount of money “held back” from a contractor or subcontractor during the term of a construction project. This is a very unique practice specific to the construction industry, but within the industry, it’s extremely popular.", "finished": false}, {"number": 11, "total": 120, "type": "single", "questionId": 42935, "question": "If you find that you are not getting work because your bids are too high, you should try:", "choices": [{"pos": 0, "letter": "A", "text": "using a standard 10% overhead figure", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "lowering your fixed expenses", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "hiring lower wage employees", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "working for time and materials", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The State may offer a better answer choice. You should review all expenses. If expenses are rock-bottom and your bids are still too high, check to see if your markup for overhead and profit is realistic.", "finished": false}, {"number": 12, "total": 120, "type": "single", "questionId": 42936, "question": "On a job site, a Cal/OSHA inspector discovers that a piece of equipment does not comply with a new safety standard. A temporary variance may be granted if the equipment:", "choices": [{"pos": 0, "letter": "A", "text": "is new and requires extra time to be brought into compliance.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "is old but had a good safety record in the past.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "will be replaced within one year.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "can be recycled.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. If the equipment is new and requires extra time to bring it into compliance, the employer may apply for a temporary variance. A variance will be granted only after notice is given to the employees and a hearing is held by DOSH.", "finished": false}, {"number": 13, "total": 120, "type": "single", "questionId": 42937, "question": "What precautions must the contractor take with hazardous substances?", "choices": [{"pos": 0, "letter": "A", "text": "Each employee must sign a sheet stating that he or she understands the safety and health risks.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "You must hang a safety poster in an area near the time clock.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "The contractor must adopt a Code of Safe Practices that relates to work at each job site.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "You should make every employee wear a dust mask.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. is correct and the best answer out of the choices given. The Code of Safe Practices should include a requirement that employees use personal protective clothing and equipment while working with hazardous substances. The contractor must also develop a written hazard communication program and provide training for employees.", "finished": false}, {"number": 14, "total": 120, "type": "single", "questionId": 42938, "question": "What is a relatively simple way to figure overhead and profit (OH&P) for a bid?", "choices": [{"pos": 0, "letter": "A", "text": "use the industry standard", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "average the OH&P on jobs for the previous month", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "review OH&P and contracts for the past year", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "check the profit and loss (P&L) statements for jobs of similar size", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The profit and loss (P&L) statement is a financial statement that summarizes the revenues, costs and expenses incurred during a specified period, usually a fiscal quarter or year.", "finished": false}, {"number": 15, "total": 120, "type": "single", "questionId": 42939, "question": "Who is the overall responsible party for work contracted?", "choices": [{"pos": 0, "letter": "A", "text": "Direct Contractor", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Original Contractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Prime Contractor", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "All of the above.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Direct Contractor, Original Contractor & Prime Contractor are same. They are responsible for the work contracted. His/Her responsibilities include on and off-site duties but are not limited to: * scheduling * inspections * contacting the dig alert notification center * updating “as-built” drawings * ensuring subs are duly licensed, bonded and insured * ensuring codes are followed * making sure all payments are made *accounting for supplies on site * making sure there is a min. of 1 bathroom for every 20 employees * making sure there is drinking water on site * making sure there is a first aide kit on site * making sure that the employees of the subs are qualified * dealing with changes * dealing with disputes * establishing & maintaining safety code according to Cal/OSHA, DOSH and IIPP", "finished": false}, {"number": 16, "total": 120, "type": "single", "questionId": 42940, "question": "You sign a contract that includes fixing the hinges of a home owner’s door. After finishing the work, the owner complains that you did not remove the dog scratches from the door’s finish. Which is the best way to avoid a dispute or lawsuit?", "choices": [{"pos": 0, "letter": "A", "text": "Be very specific about the work to be done: Review the contract and specifications line-by-line with the owner.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Write a change order.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Schedule an on-site meeting with the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Have an attorney explain the job description to the owner.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Always be very specific about the work to be done and be sure to review the contract and specifications line-by-line with the owner.", "finished": false}, {"number": 17, "total": 120, "type": "single", "questionId": 42941, "question": "Who is responsible for having the job ready for the inspector?", "choices": [{"pos": 0, "letter": "A", "text": "contractor", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "owner", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "architect", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "foreman", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. It’s the contractor’s responsibility to have the job ready for the inspector.", "finished": false}, {"number": 18, "total": 120, "type": "single", "questionId": 4294
