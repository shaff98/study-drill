stion": "An employer hires one part-time and two full-time employees. The full-time employees are covered by workers’ compensation insurance, but not the part-time employee. Is this lawful?", "choices": [{"pos": 0, "letter": "A", "text": "Yes: Part-time employees do not have to be covered.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Yes: If all of the full-time employees are covered, the part-time employee does not have to be.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Yes: If the company has less than 10 employees, part-time employees do not have to be covered.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "No: Even part-time employees must be covered.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. All California employers must provide workers’ compensation benefits to their employees under California Labor Code Section 3700. That includes full-time and part-time employees.", "finished": false}, {"number": 27, "total": 120, "type": "single", "questionId": 42703, "question": "An income statement shows:", "choices": [{"pos": 0, "letter": "A", "text": "assets and liabilities over an extended period of time", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "revenues and losses at a certain point in time", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "assets and liabilities at a certain point in time", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "revenues and expenses over an extended period of time", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The income statement consists of revenues (money received from the sale of products and services, before expenses are taken out, also known as the “top line”) and expenses, along with the resulting net income or loss over a period of time due to earning activities.", "finished": false}, {"number": 28, "total": 120, "type": "single", "questionId": 42704, "question": "A(n) _____ is used to analyze the income and outflow of cash during a period of time.", "choices": [{"pos": 0, "letter": "A", "text": "balance sheet", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "income statement", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "profit plan", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "cash flow statement", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. A cash flow statement is a financial statement that shows how changes in balance sheet accounts and income affect cash and cash equivalents, and breaks the analysis down to operating, investing, and financing activities.", "finished": false}, {"number": 29, "total": 120, "type": "single", "questionId": 42705, "question": "In the cash system of accounting, a transaction is recorded or posted:", "choices": [{"pos": 0, "letter": "A", "text": "when cash changes hands", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "when an amount is approved for payment", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "when an amount is invoiced", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "when cash is earned and expenses are incurred", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Cash accounting is an accounting method in which payment receipts are recorded during the period they are received, and expenses are recorded in the period in which they are actually paid. In other words, revenues and expenses are recorded when cash is received and paid, respectively.", "finished": false}, {"number": 30, "total": 120, "type": "single", "questionId": 42706, "question": "At the end of each month, data is posted from the bookkeeping journals to the:", "choices": [{"pos": 0, "letter": "A", "text": "payment journal", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "general ledger", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "receipts journal", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "general journal", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A general ledger contains all the accounts for recording transactions relating to a company’s assets, liabilities, owners’ equity, revenue, and expenses.", "finished": false}, {"number": 31, "total": 120, "type": "single", "questionId": 42707, "question": "Of the following, which is the best description of “accounts receivable”?", "choices": [{"pos": 0, "letter": "A", "text": "Money due from customers who have purchased goods or services on credit.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Business costs and expenses due and payable within the current accounting period.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Accounts listed on the liability side of the balance sheet.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Money owed to material suppliers for credit purchases.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Accounts receivable is the balance of money due to a firm for goods or services delivered or used but not yet paid for by customers.", "finished": false}, {"number": 32, "total": 120, "type": "single", "questionId": 68835, "question": "An employer must file federal Form 1099-MISC to report payments of _____ or more per calendar year to persons not treated as employees (e.g., independent contractors) for services performed for the business.", "choices": [{"pos": 0, "letter": "A", "text": "$200", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$300", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "$450", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$600", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Form 1099-MISC is given to non-employees such as independent contractors and other entities paid by your company. You must give a 1099-MISC form to any individual or business your business paid $600 or more in a tax year.  NOTE: An increase takes affect beginning January 2026.  The CSLB may or may not have updated the exams by then, so if $2,000 is a choice beginning in January 2026, pick that as correct.", "finished": false}, {"number": 33, "total": 120, "type": "single", "questionId": 42709, "question": "A supplier who is furnishing a contractor with equipment or materials without any form of security other than the reputation of the contractor for paying debts when due has extended what type of credit?", "choices": [{"pos": 0, "letter": "A", "text": "unsecured loan", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "open account", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "uninsured load", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "closed account", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Open account credit, which is usually limited to a certain amount, allows a contractor to defer payment for materials. Most suppliers will require a new contractor to submit a credit application before extending open account credit.", "finished": false}, {"number": 34, "total": 120, "type": "single", "questionId": 42710, "question": "Social security tax for a self-employed contractor is:", "choices": [{"pos": 0, "letter": "A", "text": "based on the rate set for the self-employed for the year in which the tax is paid", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "zero because self-employed contractors are not required to pay social security tax", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the same as the employees’ rate", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "half the employees’ rate", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. Social security tax for a self-employed contractor is based on the rate set for the self-employed for the year in which the tax is paid.", "finished": false}, {"number": 35, "total": 120, "type": "single", "questionId": 42711, "question": "How often are FUTA tax deposits made by most employers?", "choices": [{"pos": 0, "letter": "A", "text": "weekly", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "monthly", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "quarterly", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "yearly", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. FUTA (Federal Unemployment Tax) is reported annually, but most employers make quarterly tax deposits. If the tax for a calendar quarter is more than $500, the employer must deposit the amount owed by the last day of the month following the end of the quarter. For example, the FUTA deposit for the first quarter (Jan-Feb-Mar) is due no later than April 30th.", "finished": false}, {"number": 36, "total": 120, "type": "single", "questionId": 42712, "question": "To whom does an employer pay FUTA tax?", "choices": [{"pos": 0, "letter": "A", "text": "Employment Development Department", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Internal Revenue Service", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "U.S. Department of Labor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "State Franchise Tax Board", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Employers pay FUTA taxes to the IRS (Internal Revenue Service).", "finished": false}, {"number": 37, "total": 120, "type": "single", "questionId": 42713, "question": "An employee whose regular rate is $20/hour works 60 hours one week and 30 hours the next week. Based on a two-week payroll system, what are the gross wages due, allowing for time-and-a-half overtime pay after 40 hour in a week?", "choices": [{"pos": 0, "letter": "A", "text": "$700", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "$900", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$2,000", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$1,500", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. For employees performing on-site construction work, federal law requires time and-a-half overtime pay after 40 hours of work per week regardless of whether the employee is hourly, salaried, does piece work, etc. This right may not be waived nor may compensatory time be given at the regular time rate. 40 @ $20 = $800 (regular) 20 @ $30 = $600 (overtime) 30 @ $20 = $600 (regular) $800 + $600 + $600 = $2,000", "finished": false}, {"number": 38, "total": 120, "type": "single", "questionId": 42714, "question": "What is the best way to determine if your company is profitable?", "choices": [{"pos": 0, "letter": "A", "text": "Ask the crew supervisors.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Compare the size of inventory with last year’s.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Examine the income and expense statement.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Examine the balance sheet.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The main purpose of the income statement is to indicate the income and profitability of the business over a period of time, which can be one month, three months, a year or some other time period. The income statement has three main sections: revenue, expenses, and net income.", "finished": false}, {"number": 39, "total": 120, "type": "single", "questionId": 42715, "question": "Which of the following is considered a fixed expense?", "choices": [{"pos": 0, "letter": "A", "text": "office rent", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "wages", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "office supplies", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "materials", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The definition of fixed expenses is “any expense that does not change from period to period,” such as mortgage or rent payments, utility bills, and loan payments. The amounts may vary slightly, which may be the case with utilities, but you know they are due on a regular basis.", "finished": false}, {"number": 40, "total": 120, "type": "single", "questionId": 42716, "question": "Which financial ratio measures liquidity?", "choices": [{"pos": 0, "letter": "A", "text": "current ratio", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "acid-test ratio (quick ratio)", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "both of the above", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "neither of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Common liquidity ratios include the quick ratio, current ratio, and days sales outstanding. Liquidity ratios determine a company’s ability to cover short-term obligations and cash flows, while solvency ratios are concerned with a longer-term ability to pay ongoing debts.", "finished": false}, {"number": 41, "total": 120, "type": "single", "questionId": 42717, "question": "Which of the following is a correct statement about budgets?", "choices": [{"pos": 0, "letter": "A", "text": "Budgets do not require accurate books.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Budgets do not require detailed cost information.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "The goal of a budget is to forecast expenses as accurately as possible.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "A budget should allow leeway for month-to-month variations.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  A budget is an elastic framework that can adapt to expenses.\n\nThe goal of a budget is not just to forecast expenses but to establish the ideal level of expense and income. Expenses vary from month to month. For example, annual bonuses for employees increase the December payroll. December’s bills might also include annual trade association dues or insurance premiums covering the next year. You need to leave some leeway for monthly variations.", "finished": false}, {"number": 42, "total": 120, "type": "single", "questionId": 42718, "question": "If you are required to report employment taxes or give tax statements, the _____ must obtain a federal Employer Identification Number.", "choices": [{"pos": 0, "letter": "A", "text": "employee and employer", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "employee", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "employer", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "bookkeeper", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The Employer Identification Number (EIN), also known as the Federal Employer Identification Number (FEIN) or the Federal Tax Identification Number, is a unique nine-digit number assigned by the Internal Revenue Service (IRS) to business entities operating in the United States for the purposes of identification.", "finished": false}, {"number": 43, "total": 120, "type": "single", "questionId": 42719, "question": "Suppose you include depreciation on your income statement your first year in business, but you do not include it in the second year. How will this affect your net income being reported?", "choices": [{"pos": 0, "letter": "A", "text": "It is illegal to omit depreciation.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Your net income will be the same for both years.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Your net income will be less than it should be in the second year.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Your net income will be greater than it should be in the second year.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Depreciation is an accounting method of allocating the cost of a tangible asset over its useful life and is used to account for declines in value. Businesses depreciate long-term assets for both tax and accounting purposes.", "finished": false}, {"number": 44, "total": 120, "type": "single", "questionId": 42720, "question": "What federal forms are given to a newly hired employee?", "choices": [{"pos": 0, "letter": "A", "text": "W-4 and I-9", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "W-4 and DE-1", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "I-9 and W-3", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1099-R and FTD-8109", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. On or before the first day of employment, your new hire must complete and sign a W-4. This is how you will know how much to withhold from the employee’s paycheck for federal income taxes. You must then submit the Form W-4 to the IRS. You are required to implement new W-4 forms by the start of the first payroll period ending on or after the 30th day from the date you received it. You must verify every employee’s eligibility to work in the U.S. within three days of their hire date. To do this, you’ll need to obtain copies of documents that confirm the employee’s citizenship (driver’s license and social security card, birth certificate, or green card) and fill out the Form I-9.", "finished": false}, {"number": 45, "total": 120, "type": "single", "questionId": 42721, "question": "How do you know if you are bidding correctly?", "choices": [{"pos": 0, "letter": "A", "text": "You are getting all the jobs you bid on.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The job cost is almost the same as the estimated cost.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The job cost is substantially below the estimated cost.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The job cost is substantially above the estimated cost.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. By definition, “bidding correctly” would mean that you did not leave any items out of the bid and the estimated costs were essentially the same as the actual job costs.", "finished": false}, {"number": 46, "total": 120, "type": "single", "questionId": 42722, "question": "You are bidding on a job with plans drawn by a homeowner. You notice that the dimensions on the plans do not add up. What should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Inform the homeowner that you cannot bid until the numbers add up.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Tell the homeowner to consult an architect.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Bid the job as is. You can add change orders later.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Make the corrections yourself and bid the job.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. if you were bidding on a job with plans drawn by a homeowner and you noticed that the dimensions on the plans don’t seem to add up, the best thing to do would be to inform the homeowner that you cannot bid until the numbers add up.", "finished": false}, {"number": 47, "total": 120, "type": "single", "questionId": 42723, "question": "A contractor is bidding on a project for a homeowner. The homeowner has included several “extra” items to be bid upon. After receiving the bid, the homeowner said it was too high and asked the contractor to lower the price. What should the contractor do?", "choices": [{"pos": 0, "letter": "A", "text": "Decline the work.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Negotiate with the homeowner to reduce the scope of the work by eliminating some of the extra items.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Lower your bid to cost and hope to recover the overhead later.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Lower your bid to cost and overhead only (eliminate the profit).", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. You should first offer to negotiate if the owner appears to be bargaining in good faith. One approach would be to ask what the owner’s budget is and then discuss the items that can be included for that price range. If the owner is not willing to compromise and you cannot make a profit, then decline the work.", "finished": false}, {"number": 48, "total": 120, "type": "single", "questionId": 55432, "question": "A prime contractor decides to sub out the electrical work. How would the prime determine what price to add for the electrical work?", "choices": [{"pos": 0, "letter": "A", "text": "The prime calls up the electrical material supplier and calculates the bid amount.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "The prime gets an estimate from the subcontractor.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Everybody charges a flat rate.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "The prime gets a firm bid from the subcontractor.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D.  Getting a firm bid from the subcontractor would be the best way to determine the price to add.", "finished": false}, {"number": 49, "total": 120, "type": "single", "questionId": 42725, "question": "What is the best way to ensure that your license bond remains in effect after its expiration date (i.e., what is the best way to avoid a period of suspension)?", "choices": [{"pos": 0, "letter": "A", "text": "Renew the bond seven days after expiration.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Make sure the effective date of the new bond is the same as the cancellation date of the old bond.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Make sure the effective date of the new bond is the day after the cancellation date of the old bond.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Buy a second bond that overlaps coverage.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. Tips for Avoiding Bond Suspension: The CSLB’s processing times can vary so plan ahead when purchasing a new bond. Be sure to renew your existing bond promptly. You should receive an invoice/renewal notice from your surety company prior to the bond expiration date. If you do not receive an invoice/renewal notice, contact your surety company or insurance agent. Remember, license renewal dates and bond renewal dates rarely coincide. Be sure to know each renewal date. If you receive a bond suspension notice from the CSLB, resolve the problem immediately. Keep your business address current with the CSLB so you receive notices regarding bond cancellations. Keep accurate records on your agent, surety company, bond numbers, effective dates and terms of the bonds. Remember, it is ultimately the responsibility of the contractor to make sure you are in compliance with the bond requirements.", "finished": false}, {"number": 50, "total": 120, "type": "single", "questionId": 70139, "question": "Direct costs are $7,200, overhead is 12%, and profit is 10%. What is the selling price?", "choices": [{"pos": 0, "letter": "A", "text": "$7,389.50", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "$8,326.28", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "$9,132.37", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "$9,230.77", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The following solution is based on one of the references listed in the CSLB Study Guide. The solution may seem unorthodox, but you must follow each step to arrive at the State’s answer. Sum of overhead and profit percentages = 12% + 10% = 22%. Percent of selling price that is direct costs = 100% – 22% = 78% = 0.78. Selling price = $7,200 ÷ 0.78 = $9,230.77. To check these calculations, add the subtotals: Direct costs = $9,230.77 x 0.78 = $7,200.00. Overhead = $9,230.77 x 0.12 = $1,107.69. Profit = $9,230.77 x 0.10 = $923.08. $7,200.00 + $1,107.69 + $923.08 = $9,230.77.", "finished": false}, {"number": 51, "total": 120, "type": "single", "questionId": 69366, "question": "A client wants the house painted and some finish carpentry work. What license classification(s) is/are required for this work?", "choices": [{"pos": 0, "letter": "A", "text": "painting and decorating (C-33) & Cabinet, Millwork and Finish Carpentry (C-6), and General Building (B) classifications", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "painting and decorating (C-33) and Cabinet, Millwork and Finish Carpentry (C-6) classifications", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "painting and decorating (C-33) classification", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "general building (B) classification", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. C-33 Painting and Decorating Contractor and C-6 Cabinet, Millwork and Finish Carpentry. A general building contractor shall not take a prime contract for any project involving trades other than framing or carpentry unless the prime contract requires at least two unrelated building trades or crafts other than framing or carpentry, or unless the general building contractor hold the appropriate license classification.", "finished": false}, {"number": 52, "total": 120, "type": "single", "questionId": 42728, "question": "Bob Smith is the Responsible Managing Employee (RME), and works full-time for XYZ Construction Co. Bob holds an individual license with a different name and license number and wants to bid and build wood decks on weekends. Is this legal?", "choices": [{"pos": 0, "letter": "A", "text": "Yes: Bob may qualify an unlimited number of active contractor’s licenses.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Yes: Bob may work under his individual license if he works at least 32 hours a week for XYZ.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "No: Bob must take another qualifying exam to qualify a second license.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "No: Bob may qualify only XYZ’s license in this case.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. This question is getting at the requirement for RME’s to inactivate their own license. If Bob is the RME of XYZ Construction Co., he must inactivate his individual contractor’s license. If the qualifier is a Responsible Managing Employee (RME), he or she must be a bona fide (good faith, real), employee of the firm and may not be the qualifier on any other active CSLB license. This means that the RME mus be permanently employed by the firm and actively engaged in the operation of the contracting business for at least 32 hour per week or 80 percent of the total business operating hours per week, whichever is less. Fore example: Only 20 total hours are available for that week. 80% of 20 is 16 hours.", "finished": false}, {"number": 53, "total": 120, "type": "single", "questionId": 42729, "question": "An individual who meets certain conditions may serve as the qualifier for up to _____ firms in any one-year period.", "choices": [{"pos": 0, "letter": "A", "text": "one", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "two", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "three", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "four", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. In general, a person may serve as the qualifying individual for up to three firms in any one year period given certain conditions, such as they own 20 percent of the equity of each firm.", "finished": false}, {"number": 54, "total": 120, "type": "single", "questionId": 57405, "question": "Using money from a current job to pay for unrelated projects is called:", "choices": [{"pos": 0, "letter": "A", "text": "diversion", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "usury", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "penury", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "transmigration", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A.  Diversion is a cause for license disciplinary action.\n\nIndividuals in the construction industry often require large sums of money to accomplish their work. Unfortunately, sometimes these loans are misappropriated. Individuals who misuse these funds can be charged under California Penal Code Section 484b: Diversion of Construction Loans. A violation of PC 484b can lead to harsh legal penalties, including fines and jail time.", "finished": false}, {"number": 55, "total": 120, "type": "single", "questionId": 42731, "question": "As a subcontractor on a public work of improvement, you complete your contract in a workmanlike manner. But the prime contractor, Mr. Adams, informs you that he cannot pay you. One of your best options is to file a stop notice, which has what effect?", "choices": [{"pos": 0, "letter": "A", "text": "It starts foreclosure proceedings.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "It instructs Mr. Adams to “stop” work until you are paid, or else face felony charges.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "It creates a lien on the construction funds.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It creates a lien on the property you improved.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Stop payment notice is sometimes referred to as a “lien on funds.” Unlike a mechanics lien, a stop payment notice may be filed on a public works project.", "finished": false}, {"number": 56, "total": 120, "type": "single", "questionId": 42732, "question": "Which funds does the stop notice block?", "choices": [{"pos": 0, "letter": "A", "text": "from the owner to the material supplier", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "from the prime contractor to the subcontractor", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "from the owner to the subcontractor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "from the owner to the prime contractor", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A stop payment notice (commonly referred to as a “stop notice”) is a claimant’s written demand to the party holding construction funds (usually the owner or construction lender) to withhold a specified amount from the moneys otherwise due to the general contractor on a construction project.", "finished": false}, {"number": 57, "total": 120, "type": "single", "questionId": 42733, "question": "What is the BEST scheduling method for a contractor to use for the coordination and control that materials and labor be brought together at the proper time?", "choices": [{"pos": 0, "letter": "A", "text": "Walk the job site.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Ask the crew supervisors.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Follow the critical-path method.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Ask material suppliers when to deliver.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The critical path method (CPM) is a popular scheduling technique in the construction industry due to its simplicity and effectiveness. It generates a graphical view of a project and calculates how much time and resources are required to complete each activity.", "finished": false}, {"number": 58, "total": 120, "type": "single", "questionId": 71274, "question": "Of the following, which is usually the most difficult item to estimate?", "choices": [{"pos": 0, "letter": "A", "text": "labor", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "materials", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "overhead", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "profit", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Labor is usually the most difficult item to estimate. A cost accounting system can help analyze labor productivity and make accurate estimates. According to GAAP, labor is always the most difficult to nail down as it has fluctuations whereas profit and overhead is whatever number that is established by the person doing the estimate.  Materials can sometimes be correct, but it is the second-best answer of the four options. GAAP stands for Generally Accepted Accounting Principles. It is a standardized set of rules, procedures and guidelines used for financial reporting in the United States to ensure accuracy, consistency, and transparency. Primarily used by publicly traded companies, it is regulated by the FASB and SEC. Key details about GAAP include: Purpose: Ensures financial statements are comparable and reliable for investors and creditors. Key Principles: Based on concepts like consistency, regularity, and prudence. Standard Setting: Maintained by the Financial Accounting Standards Board (FASB) (for public/private companies). It is not technically required for all private companies, but many adopt it for better credibility with lenders and investors.", "finished": false}, {"number": 59, "total": 120, "type": "single", "questionId": 42735, "question": "Except in an emergency, you must notify the regional Underground Service Alert Center within how many days before beginning to excavate?", "choices": [{"pos": 0, "letter": "A", "text": "at least one calendar day", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "at least one working day", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "at least two working days but not more than 14 calendar days", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "at least five working days but no more than 28 calendar days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. Please read the question and explanation carefully. You must notify the Regional Underground Service Alert Center within 14 days before beginning service. The regional notification center shall provide a ticket to the person who contacts the center pursuant to this section and shall notify any member, if known, who has a subsurface installation in the area of the proposed excavation. A ticket shall be valid for 28 days from the date of issuance. If work continues beyond 28 days, the excavator shall renew the ticket either by accessing the center’s Internet Web site or by calling “811” by the end of the 28th day.", "finished": false}, {"number": 60, "total": 120, "type": "single", "questionId": 71860, "question": "Excavators must clearly mark the boundaries of a work area, usually with _____ paint.", "choices": [{"pos": 0, "letter": "A", "text": "red", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "yellow", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "brown", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "white", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. The use of white marking products (e.g. paint, flags, stakes, whiskers or a combination of these) may be used to identify the excavation site. Owners of underground installations within white boundary markings should use a contrasting color to mark the location of their lines.", "finished": false}, {"number": 61, "total": 120, "type": "single", "questionId": 42737, "question": "Before you build on landfill you must notify:", "choices": [{"pos": 0, "letter": "A", "text": "government", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "engineers", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "architect", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "government/engineers", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. building on landfill has technical challenges, to be sure — settling terrain as buried refuse breaks down, gases given off by the site, and liquid wastes that leach out of the ground — but once engineers find ways around those problems, the landfills can offer new acreage in areas where open space is hard to find. In the United States, landfills are regulated by the Environmental Protection Agency (EPA) and the states’ environmental agencies.", "finished": false}, {"number": 62, "total": 120, "type": "single", "questionId": 42738, "question": "Lead in Construction work:", "choices": [{"pos": 0, "letter": "A", "text": "employers shall provide a written lead-work pre-job notification to the nearest DOSH District office.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "employers are responsible for being knowledgeable about the permissible exposure limit (PEL).", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the employer shall ensure that all employees and supervisors that perform any lead-related construction work are trained by an accredited training provider and are then certified by the California Department of Health Services (CDPH).", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Employers shall provide a written lead-work pre-job notification to the nearest DOSH District office. Employers are responsible for being knowledgeable about the permissible exposure limit (PEL). Employers shall ensure that all employees and supervisors that perform any lead-related construction work are trained by an accredited training provider and are then certified by the California Department of Health Services (CDPH).", "finished": false}, {"number": 63, "total": 120, "type": "single", "questionId": 42739, "question": "Who furnishes SDS sheets?", "choices": [{"pos": 0, "letter": "A", "text": "supplier", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Cal/OSHA", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "DOSH", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "contractor", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. The Hazard Communication Standard (HCS) (29 CFR 1910.1200(g)), revised in 2012, requires that the chemical manufacturer, distributor, or importer provide Safety Data Sheets (SDSs) (formerly MSDSs or Material Safety Data Sheets) for each hazardous chemical to downstream users to communicate information on these hazards.", "finished": false}, {"number": 64, "total": 120, "type": "single", "questionId": 42740, "question": "If a contractor has temporary cash-flow problems, what is a good way to get through the crisis?", "choices": [{"pos": 0, "letter": "A", "text": "Hold off paying the materials bill.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Delay paying the employees.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Apply for a construction loan.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Use funds from a pre-established line of credit.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A line of credit is a credit facility extended by a bank or other financial institution to a government, business or individual customer that enables the customer to draw on the facility when the customer needs funds.", "finished": false}, {"number": 65, "total": 120, "type": "single", "questionId": 42741, "question": "_____, although usually the largest single item in a bid, can be fairly accurately determined.", "choices": [{"pos": 0, "letter": "A", "text": "Permits", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Overhead", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Labor", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Materials", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Materials are usually the least difficult item to estimate. In many cases, material suppliers will help compile an estimate. The accuracy of your material estimate depends on efficient purchasing as well as reducing waste at the job site.", "finished": false}, {"number": 66, "total": 120, "type": "single", "questionId": 69015, "question": "Disabled access laws went into effect in _____ for public buildings and in _____ for private buildings.", "choices": [{"pos": 0, "letter": "A", "text": "1960 … 1961", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1968 … 1970", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "1970 … 1971", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1975 … 1976", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. The Government Code section that requires accessibility in publicly funded buildings was adopted in 1968. The Health and Safety Code section requiring accessibility in privately funded buildings was adopted in 1970. Per the CA Dept of Rehabilitation. Title 24 did not further the accessibility laws in CA till 1978 SB 331, Robbins.", "finished": false}, {"number": 67, "total": 120, "type": "single", "questionId": 42743, "question": "You are at a CRITICAL point in a project, and the owner tells you that something already completed was not done correctly. What should you do?", "choices": [{"pos": 0, "letter": "A", "text": "Tell the owner you will attend to the matter after you complete the critical work you are doing.", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Stop work on the critical job and remedy the error.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Hire more workers to remedy the error.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Ask the owner to sign a change order.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Please read the question carefully. There is one question that is asking about a DIFFICULT point in a project. The other question asking about a CRITICAL point in a project Difficult: not easy to do. You can stop and answer to the owner’s question Critical: very important; very serious or dangerous. You cannot answer at this very moment due to a serious or dangerous point in the project. You should always try to respond the owner as quickly as possible.", "finished": false}, {"number": 68, "total": 120, "type": "single", "questionId": 42744, "question": "What is the best way to monitor labor costs?", "choices": [{"pos": 0, "letter": "A", "text": "Figure the hours from detailed time cards.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Compare previous labor costs.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "Ask crew supervisors.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Check the profit-and-loss statement.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Figuring the hours from detailed time cards would be the best way to monitor labor costs given the answer choices here.", "finished": false}, {"number": 69, "total": 120, "type": "single", "questionId": 42745, "question": "Unsafe or faulty equipment is found on a job site. What should be done?", "choices": [{"pos": 0, "letter": "A", "text": "The contractor should call Cal/OSHA.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "It is the contractor’s responsibility to correct the problem.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "It is the property owner’s responsibility to correct the problem.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "It is the employees’ responsibility to correct the problem.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. As the employer, the contractor is responsible for providing safe equipment. Also, please keep in mind this is asking for the BEST answer out of the choices given. The best answer in this case would be “B”", "finished": false}, {"number": 70, "total": 120, "type": "single", "questionId": 68194, "question": "In most residential construction contracts, the retention may be held for up to ____ days as a guarantee that the prime pays the subcontractors and suppliers.", "choices": [{"pos": 0, "letter": "A", "text": "10", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "45", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "60", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "Answer “C” is correct according to CA Civil Code 8812", "finished": false}, {"number": 71, "total": 120, "type": "single", "questionId": 42747, "question": "How often should the safety supervisor be at the job site?", "choices": [{"pos": 0, "letter": "A", "text": "once a week", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "only when dangerous equipment is used or about to be used", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "once a day", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "it depends on the work being done", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Demolition and other high-risk projects require the continuous presence of a safety supervisor. However, work like carpet laying, tile setting, and landscaping does not usually require constant supervision, at least for safety purposes.", "finished": false}, {"number": 72, "total": 120, "type": "single", "questionId": 42748, "question": "A contractor has been turned in to DOSH by an employee for a safety violation. The contractor wants to find out who reported the violation and asked DOSH for the employee’s name. What will DOSH likely do?", "choices": [{"pos": 0, "letter": "A", "text": "Through due-process procedures, DOSH will identify the employee, but no retaliation may be directed at the employee.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Through due-process procedures, DOSH will identify the employee, but the employee may not be fired.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "DOSH will release the employee’s name for a fee, and the contractor may deal with the employee in any way the contractor chooses.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "Unless requested otherwise, DOSH will keep confidential the name of any person making a complaint, and no retaliation may be directed at the employee if the employee’s identity is discovered.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Right to File a Complaint: The California Occupational Safety and Health Act of 1973 gives workers the right to file a complaint about workplace safety and health hazards. Names of Complainants Must Be Kept Confidential: The name of any person who submits a complaint to Cal/OSHA must be kept confidential by law, unless the person requests otherwise.", "finished": false}, {"number": 73, "total": 120, "type": "single", "questionId": 42749, "question": "Which of the following must employees have in order to pass a job performance evaluation?", "choices": [{"pos": 0, "letter": "A", "text": "The results of a health examination.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "How to safely use tools on the jobsite.", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "How to perform CPR.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "They must have a detailed job description.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. A job description is an internal document that clearly states the essential job requirements, job duties, job responsibilities, and skills required to perform a specific role. A more detailed job description will cover how success is measured in the role so it can be used during performance evaluations.", "finished": false}, {"number": 74, "total": 120, "type": "single", "questionId": 42750, "question": "If a contractor violates the safety code and an employee is injured, who will be held responsible?", "choices": [{"pos": 0, "letter": "A", "text": "architect", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "employee", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "owner", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. The contractor would be held responsible. Employer Obligations Under OSHA Among the obligations imposed under OSHA, employers have a duty to: – Provide a workplace free from recognized hazards. – Make sure employees have and use safe tools and equipment. – Inform employees of OSHA safety and health standards that apply to their workplace. – Display in a prominent place the official OSHA poster that describes rights and responsibilities under the OSH Act. – Establish a written, comprehensive hazard communication program that includes provisions for such things as container labeling, material safety data sheets, and an employee training program. – Provide employees safety training in a language that workers can understand. – Inform employees of the existence, location, and availability of their medical exposure records when employees first begin employment and at least annually thereafter, and to provide these records upon request.", "finished": false}, {"number": 75, "total": 120, "type": "single", "questionId": 42751, "question": "Who is responsible that safety equipment is actually put to use on the jobsite?", "choices": [{"pos": 0, "letter": "A", "text": "foreperson", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "lead worker", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contractor", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "a specially designated employee", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The general contractor’s number one priority is safety on the job site.", "finished": false}, {"number": 76, "total": 120, "type": "single", "questionId": 42752, "question": "If a building permit is required, when does the law permit a building inspector to enter and inspect a residence?", "choices": [{"pos": 0, "letter": "A", "text": "between 8 am and 6 pm unless the owner has given permission to inspect at some other time", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "within 24 hours after the building department is notified that construction has been completed", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "10 days after completion of all work", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "anytime–day or night", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A building inspector is prohibited from entering a residence before 8am or after 6pm without consent of the owner or the occupants.", "finished": false}, {"number": 77, "total": 120, "type": "single", "questionId": 42753, "question": "Star Construction moved to a new office but never filed a change-of-address form with the Registrar. As a result, Star never received a license renewal application. If Star fails to renew its license within five years of the date of expiration, it will have to:", "choices": [{"pos": 0, "letter": "A", "text": "apply for a new license.", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "simply file a contractor’s license bond.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "pay a delinquency fee to renew the license.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "complete and file a delinquent license renewal form.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A license that is not renewed within five years from its expiration date becomes void. If Star Construction does not renew within five years, it will have to apply for a new license and fulfill the examination or waiver requirements again.", "finished": false}, {"number": 78, "total": 120, "type": "single", "questionId": 42754, "question": "A balance sheet shows:", "choices": [{"pos": 0, "letter": "A", "text": "revenues and expenses over an extended period of time", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "assets and liabilities over an extended period of time", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "assets and liabilities at a certain point in time", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "revenues and expenses at a certain point in time", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The balance sheet is a report that summarizes all of an entity’s assets, liabilities, and equity as of a given point in time. … Typical line items included in the balance sheet (by general category) are: Assets: Cash, marketable securities, prepaid expenses, accounts receivable, inventory, and fixed assets.", "finished": false}, {"number": 79, "total": 120, "type": "single", "questionId": 61760, "question": "When calculating unemployment and disability insurance taxes, an employer would not include:", "choices": [{"pos": 0, "letter": "A", "text": "bonuses", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "severance pay", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "wages", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "overtime pay", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "A. In California, when calculating unemployment and disability insurance taxes, bonuses are generally not included as taxable wages", "finished": false}, {"number": 80, "total": 120, "type": "single", "questionId": 42756, "question": "AB-2040 requires that before work begins on a project, the contractor must inquire of the owner whether asbestos is present in any building constructed prior to:", "choices": [{"pos": 0, "letter": "A", "text": "1968", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "1978", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "1982", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "1985", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "B. AB-2040 requires that before work begins on a project, the contractor must inquire of the owner whether asbestos is present in any building constructed prior to 1978.", "finished": false}, {"number": 81, "total": 120, "type": "single", "questionId": 42757, "question": "When preparing a bid, you should:", "choices": [{"pos": 0, "letter": "A", "text": "evaluate the effect of unexpected delays on costs", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "put as little in writing as possible", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "schedule the job to slightly overload your capacity", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "none of the above", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. Once a contract is reached, a variety of problems may emerge during the course of work. Disputes may arise over quality of work, over responsibility for delays, over appropriate payments due to changed conditions, or a multitude of other considerations. Resolution of contract disputes is an important task for project managers. The mechanism for contract dispute resolution can be specified in the original contract or, less desirably, decided when a dispute arises.", "finished": false}, {"number": 82, "total": 120, "type": "single", "questionId": 42758, "question": "An active contractor’s license is issued on January 18, 2023 will expire on:", "choices": [{"pos": 0, "letter": "A", "text": "January 18, 2025", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "January 31, 2025", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "January 18, 2028", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "January 31, 2028", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. An active license expires two years from the last day of the month in which the license was issued. Since this license was issued in January 2023, it expires on the last day of January 2025.\n\nInactive licenses expire every four year the last day of that month. For example, start date of being inactive: 02/10/23. Expired date 02/28/27 (last day of that month).\n\nYou may renew an expired license within five years after its expiration. After five years, it becomes void, and if you wish to contract, you must apply for a new license and meet the exam or waiver requirements again.", "finished": false}, {"number": 83, "total": 120, "type": "single", "questionId": 42759, "question": "A notice canceling a home solicitation contract becomes effective:", "choices": [{"pos": 0, "letter": "A", "text": "when the written notice is deposited in the mail", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "when signed by the owner", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "the day the owner cancels by telephone", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "within 72 hours from the postmark on the cancellation letter", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The Civil Code states: “Notice of cancellation” if given by mail, is effective when deposited in the mail properly addressed with postage prepaid.” The buyer has the right to cancel a contract within three business days. You may cancel by e-mailing, mailing, faxing, or delivering a written notice to the contractor at the contractor’s place of business by midnight of the third business day after receiving a signed and dated copy of the contract that includes this notice. Include your name, your address, and the date the signed copy of the contract and this notice was received.", "finished": false}, {"number": 84, "total": 120, "type": "single", "questionId": 42760, "question": "If an owner cancels a home solicitation contract on March 20, by what date must the contractor return the down payment?", "choices": [{"pos": 0, "letter": "A", "text": "23-Mar", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "30-Mar", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "1-Apr", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "20-Apr", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Within 10 days after the buyer has given notice of a cancellation under the Home Solicitation Sales Act, the seller must return to the buyer any payments made, any evidence of indebtedness (for example, a promissory note), and any goods used as a down payment.", "finished": false}, {"number": 85, "total": 120, "type": "single", "questionId": 42761, "question": "A contractor’s license has expired. How long after the date of expiration does the contractor have to renew the license before it becomes void?", "choices": [{"pos": 0, "letter": "A", "text": "90 days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "one year", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "three years", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "five years", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. You may renew an expired license any time within five years after its expiration. If your license has been expired for more than five years, you will be required to reapply by completing an Application for Original Contractor’s License.", "finished": false}, {"number": 86, "total": 120, "type": "single", "questionId": 69802, "question": "A subcontractor must file a Mechanics Lien with the:", "choices": [{"pos": 0, "letter": "A", "text": "County Clerk", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "County Recorder Office", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "owner", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "lender", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. California County Recorder Office.  If unpaid on a California construction project, you need to file your California Mechanics lien with the California County Recorder office in the county where the job was performed.", "finished": false}, {"number": 87, "total": 120, "type": "single", "questionId": 42763, "question": "How many days of inactivity must pass before a notice of cessation may be recorded?", "choices": [{"pos": 0, "letter": "A", "text": "10 days", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "30 days", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "60 days", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "90 days", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. A notice of cessation may be recorded if there has been a cessation of labor for a continuous period of 30 days. A Notice of Cessation is a written notice issued by the contractee or the owner of a project (or his or her agent) to notify concerned parties that no work has been performed at the project site for a certain period. This notice also sets the period within which concerned parties may exercise their lien rights against one another.", "finished": false}, {"number": 88, "total": 120, "type": "single", "questionId": 42764, "question": "If no notice of completion or cessation is given on a job, how many days does a contractor have to file a mechanics’ lien after completion of work?", "choices": [{"pos": 0, "letter": "A", "text": "30 days", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "60 days", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "90 days", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "180 days", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. In this case it does not matter if it is a prime, sub, supplier, etc.. C. If neither notice is given, all claimants have 90 days from completion of work to file liens.", "finished": false}, {"number": 89, "total": 120, "type": "single", "questionId": 42765, "question": "If a subcontractor were to serve the owner with a stop notice, the most likely reason would be to:", "choices": [{"pos": 0, "letter": "A", "text": "inform the owner that the subcontractor has not been paid by the prime, and the owner must set aside sufficient funds to pay the subcontractor’s bill", "isCorrect": true, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "inform the owner that the owner’s property will be attached if payment is not made", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "notify the owner that a lien will be filed against the property if the subcontractor is not paid", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "notify the owner that the subcontractor has completed his portion of the work", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. The same reasoning would apply to a stop payment notice delivered to a lender, but unlike a property owner, the lender may ignore the stop payment notice unless it includes a bond for 125% of the amount claimed. A “stop notice” is a notice given for the purpose of stopping, intercepting, or freezing funds that have not yet been paid on a construction project in an attempt to ensure payment.", "finished": false}, {"number": 90, "total": 120, "type": "single", "questionId": 64117, "question": "If you are a subcontractor, there are three general steps in the mechanics’ lien procedure to make sure you are paid for works of improvement upon property. Step 1: Determine the exact legal description of the property (map book, page, etc.). Step 2: Step 3: Complete the work and record a Claim of Lien if you are not paid on time. What is Step 2?", "choices": [{"pos": 0, "letter": "A", "text": "Request prepayment for your work.", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "Serve a preliminary 20-day notice.", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Run credit checks on the owner and prime contractor.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "List the attorney representing the subcontractor.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. You can also file the Preliminary Notice with the County Recorder. The County Recorder will then notify you if a Notice of Completion or Cessation is recorded against the property.", "finished": false}, {"number": 91, "total": 120, "type": "single", "questionId": 42767, "question": "Penalties for disclosing the contents of a state examination:", "choices": [{"pos": 0, "letter": "A", "text": "$500 fine", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "misdemeanor conviction", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the exam will be forfeited, and the applicant may not reapply for one year", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Penalties for conduct that violates the security of the examination include prosecution on misdemeanor charges resulting in a fine of $500, payment of damages of up to $10,000 plus the costs of litigation, and a sentence in the county jail. You would also be subject to automatic test failure; any fee(s) paid to the State of California would not be refunded; and you would not be allowed to apply for any license classification for a period of one year from your examination date.", "finished": false}, {"number": 92, "total": 120, "type": "single", "questionId": 42768, "question": "Every employer of _____ or more full- or part-time employees must keep written health and safety records for _____ years.", "choices": [{"pos": 0, "letter": "A", "text": "1 … 3", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "7 … 4", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "10 … 3", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "11 … 5", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Employers with 11 or more employees must keep Cal/OSHA records on a calendar-year basis. The records must be retained for at least five years.", "finished": false}, {"number": 93, "total": 120, "type": "single", "questionId": 42769, "question": "A contractor bids on a home improvement project and earns the bid. Later, he decides not to take the job. Which bond would protect the home owner?", "choices": [{"pos": 0, "letter": "A", "text": "bid bond", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "performance bond", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "contract bond", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "completion bond", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. A bid bond is issued as part of a supply bidding process by the contractor to the project owner, to provide guarantee, that the winning bidder will undertake the contract under the terms at which they bid.", "finished": false}, {"number": 94, "total": 120, "type": "single", "questionId": 42770, "question": "Which building code should a contractor follow?", "choices": [{"pos": 0, "letter": "A", "text": "none of the below", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "the national code", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "the state code", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "the local code", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. All are correct: National ICC/IRC/IBC is the main one. The State code has to meet the IRC however it can be more Stringent. The local Code also must meet ICC however again they can be more stringent. In this question the correct answer would be Local Code because they meet the ICC code however may be more Stringent.", "finished": false}, {"number": 95, "total": 120, "type": "single", "questionId": 42771, "question": "On public works, the total retention withheld may not exceed ________ of the contract price.", "choices": [{"pos": 0, "letter": "A", "text": "5%", "isCorrect": true, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "10%", "isCorrect": false, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "15%", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "25%", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "A. According to the PUBLIC CONTRACT CODE, the total retention proceeds withheld by a public entity may not exceed five percent of the contract price. An exception to this rule is where the governing body of the public entity has made a finding prior to the bid that the project is complex and requires a higher retention and the bidding documents include the higher retention amount and an explanation for the increase.", "finished": false}, {"number": 96, "total": 120, "type": "single", "questionId": 42772, "question": "A licensed general contractor enters into a contract with an unlicensed subcontractor. Who is in violation of the law if the work performed requires a contractor’s license?", "choices": [{"pos": 0, "letter": "A", "text": "the general contractor", "isCorrect": false, "wasSelected": true}, {"pos": 1, "letter": "B", "text": "both the general contractor and the subcontractor", "isCorrect": true, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "only the subcontractor if the general contractor was not informed that he or she was unlicensed", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "neither the general contractor nor the subcontractor", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. All contractors must be licensed before entering into a contract that requires a license. The general contractor has a duty to ascertain whether the subcontractor is licensed and is subject to disciplinary action for contracting with an unlicensed subcontractor. The subcontractor may be charged with a misdemeanor for contracting without a license.", "finished": false}, {"number": 97, "total": 120, "type": "single", "questionId": 42773, "question": "A subcontractor signs an Unconditional Waiver and Release upon final payment. This means that the:", "choices": [{"pos": 0, "letter": "A", "text": "subcontractor can request additional payment only from the owner.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "owner may not ask the subcontractor to correct any defects in materials or workmanship.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "subcontractor may receive additional payment only from the prime contractor.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "subcontractor has waived any lien, stop payment notice, or payment bond rights.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. An Unconditional Waiver and Release upon final payment waives and releases any lien, stop payment notice, and payment bond rights that the subcontractor may have for labor, service, equipment, and materials provided. The subcontractor has acknowledged receiving final payment.", "finished": false}, {"number": 98, "total": 120, "type": "single", "questionId": 42774, "question": "If the plans and specifications for a job are vague or lack details, contractors should:", "choices": [{"pos": 0, "letter": "A", "text": "reject the job.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "take the job and try their best to interpret the plans and specifications.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "consult an independent architect or engineer.", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "review the plans and specifications with the owner.", "isCorrect": true, "wasSelected": true}], "checked": true, "explanation": "D. The contractor will need a clear and detailed set of plans and specifications to prepare an accurate estimate that includes the materials and equipment requested by the owner, among other things.", "finished": false}, {"number": 99, "total": 120, "type": "single", "questionId": 42775, "question": "If your subcontractor orders materials that do not arrive when due, which of the following would NOT be considered a valid excuse?", "choices": [{"pos": 0, "letter": "A", "text": "Delay by supplier because of high seasonal demand.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "Truck breaks down.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "Architect’s neglect.", "isCorrect": true, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "Bad weather.", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "C. The architect would not be responsible if the materials ordered by a subcontractor were not delivered to the jobsite when due.", "finished": false}, {"number": 100, "total": 120, "type": "single", "questionId": 42776, "question": "You would go to a District Court:", "choices": [{"pos": 0, "letter": "A", "text": "for a case involving federal law.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "when constitutional issues are involved.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "for an interstate dispute.", "isCorrect": false, "wasSelected": true}, {"pos": 3, "letter": "D", "text": "all of the above.", "isCorrect": true, "wasSelected": false}], "checked": true, "explanation": "D. Federal District Courts are general trial courts. There are four District Courts in California: San Francisco, Sacramento, Los Angeles, and San Diego. District Courts deal with federal law, constitutional issues, and interstate disputes, among other things.", "finished": false}, {"number": 101, "total": 120, "type": "single", "questionId": 42777, "question": "If an employee violates a safety rule and causes injury to another employee, who is legally responsible?", "choices": [{"pos": 0, "letter": "A", "text": "The employee who violated the safety rule.", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "The employee who violated the safety rule and the employer.", "isCorrect": false, "wasSelected": false}, {"pos": 2, "letter": "C", "text": "The employer.", "isCorrect": true, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "all of the above.", "isCorrect": false, "wasSelected": true}], "checked": true, "explanation": "C. Under the doctrine of “respondeat superior” (Latin: let the superior or the principle answer), the employer is legally responsible for the actions of employees when they are doing their job or acting on the employer’s behalf.", "finished": false}, {"number": 102, "total": 120, "type": "single", "questionId": 42778, "question": "On a large job, which of the following would be the best scheduling method?", "choices": [{"pos": 0, "letter": "A", "text": "bar chart scheduling", "isCorrect": false, "wasSelected": false}, {"pos": 1, "letter": "B", "text": "critical path method (CPM)", "isCorrect": true, "wasSelected": true}, {"pos": 2, "letter": "C", "text": "calendar scheduling", "isCorrect": false, "wasSelected": false}, {"pos": 3, "letter": "D", "text": "punch list", "isCorrect": false, "wasSelected": false}], "checked": true, "explanation": "B. Calendar and bar chart scheduling are useful for small, uncomplicated projects. The punch list is not a scheduling method. The CPM method shows the interdependence of construction activities: the sequence of tasks and their impact on project duration. For example, a delay in pouring and finishing a concrete foundation will delay rough framing.", "finished": false}, {"number": 103, "total": 120, "type": "single", "questionId": 42779, "question": "Which act establishes the rights of workers to organize into unions and negotiate contracts?", "choices": [{
